# Required Status Check Gate (M1.1)
# ==================================
# GitHub branch protection treats `cancelled` and `skipped` workflow runs as
# a pass (fail-open). PR #419 (memory `feedback_ci_cancelled_baseline`) showed
# how that lets a baseline collapse merge silently. This workflow is the hub
# of a hub-and-spoke gateway: it asks the REST API for the latest run of
# every monitored spoke at `head_sha` and fails if any spoke is missing,
# cancelled, skipped, failed, or timed out.
#
# A spoke that is still *running* is reported but does not fail the gate.
# This workflow fires on each monitored spoke's `workflow_run: completed`,
# so it necessarily runs while the other spokes are still going: treating
# that as a failure turned every firing but the last one red (38 failure /
# 22 success across the 60 runs before this was fixed) and buried genuine
# gate failures. The last monitored spoke to complete always triggers a
# final firing, and every other spoke has completed by then, so the
# authoritative evaluation still happens. A spoke that actually failed
# still fails the gate immediately, pending siblings or not.
#
# Why a separate workflow rather than touching the spokes:
#   - The 18+ contract gates have well-isolated responsibilities; we don't
#     want to add fail-open guards into each of them.
#   - Spoke renames / consolidations don't touch branch protection — only
#     the `MONITORED_WORKFLOWS` env below changes.
#
# Add a workflow to MONITORED_WORKFLOWS after it has been green on dev for
# at least one week (informational tiers from M2/M4 stay off this list).

name: Required Status Check Gate

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows:
      - Multi-Runtime RTF Benchmark
      - Memory regression (per-language)
      - CodeQL
      - Parity Hub
      - PUA Consistency Gate
    types: [completed]

# Avoid self-cancellation when several spokes complete in quick succession;
# letting the gate be cancelled is exactly the fail-open path we are closing.
concurrency:
  group: required-gate-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MONITORED_WORKFLOWS: >-
        Multi-Runtime RTF Benchmark,Memory regression (per-language),CodeQL,Parity Hub,PUA Consistency Gate
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          # gate は workspace の scripts/ しか読まない。 check_required_gate.py は
          # GITHUB_TOKEN env 経由で REST API を叩く (stdlib urllib のみ、 git は
          # 呼ばない) ため credential helper は不要。 workflow_run は fork PR でも
          # write context で走るので .git/config に token を残さない。
          persist-credentials: false

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Resolve head_sha and PR number
        id: ctx
        # workflow_run.head_branch は fork 側の branch 名 = 外部 contributor が
        # 自由に決められる文字列で `$( )` / backtick を含められる。 run: に
        # ${{ }} を直接展開すると script injection になるため、 pr-title-check /
        # pr-body-validate と同じく env 経由で shell 変数として参照する。
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          # Which monitored spokes may legitimately be absent depends on the
          # event, because two of them are path-filtered on pull_request but
          # NOT on push:
          #
          #   spoke                        pull_request   push
          #   Memory regression            paths          paths
          #   PUA Consistency Gate         paths          paths
          #   Multi-Runtime RTF Benchmark  paths          (none)
          #   Parity Hub                   paths          (none)
          #   CodeQL                       (none)         (none)
          #
          # So on a push to dev, RTF and Parity Hub MUST run, and exempting
          # them there would silently drop them from the gate. A `workflow_run`
          # firing carries the ORIGINAL event in
          # github.event.workflow_run.event, so a spoke completing on a
          # feature-branch PR still gets the pull_request list.
          PR_FILTERED="Multi-Runtime RTF Benchmark,Memory regression (per-language),Parity Hub,PUA Consistency Gate"
          PUSH_FILTERED="Memory regression (per-language),PUA Consistency Gate"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "sha=${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
            echo "pr=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "paths_filtered=${PR_FILTERED}" >> "$GITHUB_OUTPUT"
            # No supersede branch on pull_request. The base ref was passed
            # here, and --branch-for-supersede compares head_sha against that
            # branch's TIP -- a PR head is never the tip of its own base, so
            # the gate deferred and exited 0 on every pull_request firing
            # without ever aggregating a spoke (measured: 4/4 runs printed
            # "Head SHA <pr-head> is no longer the branch tip (latest: <dev
            # tip>)"). The supersede guard exists for the workflow_run path,
            # where a spoke completing late can fire the gate on a stale SHA;
            # on pull_request, `synchronize` re-fires with the new head SHA
            # and the checks list shows the latest run for that SHA, so a
            # stale verdict cannot linger.
            echo "base_branch=" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${RUN_HEAD_SHA}" >> "$GITHUB_OUTPUT"
            # `workflow_run` doesn't carry the PR number directly; surface the
            # head branch so the next step can look it up if needed.
            echo "pr=" >> "$GITHUB_OUTPUT"
            echo "base_branch=${RUN_HEAD_BRANCH}" >> "$GITHUB_OUTPUT"
            if [ "${RUN_EVENT}" = "pull_request" ]; then
              echo "paths_filtered=${PR_FILTERED}" >> "$GITHUB_OUTPUT"
            else
              echo "paths_filtered=${PUSH_FILTERED}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Aggregate spoke conclusions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.ctx.outputs.sha }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr }}
          BASE_BRANCH: ${{ steps.ctx.outputs.base_branch }}
          PATHS_FILTERED: ${{ steps.ctx.outputs.paths_filtered }}
        run: |
          set -euo pipefail
          extra_args=()
          if [ -n "${PR_NUMBER}" ]; then
            extra_args+=("--post-pr-comment" "${PR_NUMBER}")
          fi
          if [ -n "${BASE_BRANCH}" ]; then
            extra_args+=("--branch-for-supersede" "${BASE_BRANCH}")
          fi
          python scripts/check_required_gate.py \
            --head-sha "${HEAD_SHA}" \
            --repo "${GITHUB_REPOSITORY}" \
            --monitored "${MONITORED_WORKFLOWS}" \
            --paths-filtered "${PATHS_FILTERED}" \
            --on-cancelled fail \
            --on-skipped fail \
            "${extra_args[@]}"
