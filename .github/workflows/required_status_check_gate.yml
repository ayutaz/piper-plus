# Required Status Check Gate
# ==========================
# Waits for EVERY workflow that ran for a pull request's head commit and
# publishes one verdict as the commit status `required-gate/all-workflows`
# on that commit. The dev ruleset requires that status, so a PR with any red
# workflow cannot be merged, whichever paths filter that workflow carries.
#
# Why a commit status rather than this job's own check:
#   A `workflow_run` run is recorded against the default branch, so its check
#   never appears on the PR. The earlier version therefore evaluated in two
#   places: a `pull_request` firing (visible on the PR) that always ran while
#   the spokes were still going and passed as "deferred", and `workflow_run`
#   firings (the real verdict) that only reached a PR comment. Measured: the
#   PR-visible gate was green on essentially every PR, and it was not
#   required by any ruleset.
#
# Why every workflow rather than a list of spokes:
#   The list covered 5 of the ~95 workflows a PR can trigger. Branch
#   protection can only require named checks, and requiring a path-filtered
#   workflow by name blocks every PR whose diff does not trigger it, so those
#   workflows could be red and still merge. Counting every run recorded for
#   the head commit covers them without naming them.
#
# How the final verdict is guaranteed:
#   Every pull_request workflow is listed under `workflow_run.workflows`
#   (tests/scripts/test_required_gate_workflow_contract.py derives the list
#   from the workflow files and fails when one is missing), so the last one
#   to finish fires a firing that sees all of them completed. Firings for
#   one head commit share a concurrency group that never cancels a running
#   evaluation; GitHub keeps only the newest pending one, which is the one
#   that sees the most completed runs. While something is still running the
#   status is `pending`, and a failure is published as soon as it is seen.
#   `--require-present CI` keeps the verdict pending until CI's run exists,
#   so a firing just after the push cannot call a half-created set green.

name: Required Status Check Gate

on:
  workflow_run:
    workflows:
      - Action Pin Safety Gate
      - Action SHA Drift Detector
      - actionlint
      - Android Build
      - Audio MOS Proxy
      - Build All Platforms
      - Build piper-phonemize Windows wheels
      - Bundle size gate
      - C# CI
      - C++ ABI Compliance Check
      - C++ Lint
      - C++ Tests
      - CHANGELOG Format
      - CI
      - clang-tidy
      - CLI and Python consumer contracts
      - CLI Help / Docs Drift Gate
      - CLI Help Extract
      - Co-install Smoke (piper-tts + piper-plus)
      - CodeQL
      - codespell
      - Commitlint
      - cppcheck
      - CSharp deleted working directory regression
      - dependency-review
      - Dictionary Consistency Gate
      - doc-examples-gate
      - Docker Build and Push
      - Docker Build Validate
      - Docker Tests
      - docker-distroless-trial
      - E2E Issue
      - Extended contract gates
      - First-PR Fast Lane
      - Forward-compat Fuzz
      - Fuzz Smoke
      - G2P Cross-Platform Consistency
      - G2P Known Divergences Gate
      - G2P Python CI
      - G2P Rust CI
      - G2P WASM CI
      - Go CI
      - hadolint
      - Inference Input Contract Gate
      - Integration Tests (Issue
      - Kotlin G2P CI
      - License Compliance Check
      - link-check
      - Linux ARMv7 release verification
      - markdownlint
      - Memory regression (per-language)
      - Migration <-> CHANGELOG Parity Gate
      - Migration Guide Lint
      - Model Card Generation
      - model-quality-gate
      - Multi-Runtime RTF Benchmark
      - ORT Version Sync Gate
      - Parity Hub
      - Phoneme Timing Parity
      - PR Title Check
      - pr-body-validate
      - Pre-commit
      - PUA Consistency Gate
      - Public ABI Snapshot
      - Public Base Runtime Verification
      - public-api-diff
      - Python Doctest
      - Python license and wheel consumers
      - Python Linting
      - python-inference-distroless-trial
      - python-tests
      - README Heading Tree Parity
      - Release Kotlin G2P (Maven Central)
      - Release Shared Library
      - RTF Regression
      - Ruff Version Sync Gate
      - Rulesets
      - Runtime Parity Deep
      - rust-tests
      - sbom
      - Secret Scan
      - Security Audit
      - Swedish LID Sync Gate
      - Swift G2P CI
      - Test ARM64 Multilingual TTS
      - Test ARM64 TTS
      - Test HF Space Build
      - Test Japanese TTS
      - Test Multilingual TTS
      - Test Threshold Relaxation Gate
      - Test WebAssembly
      - Timing Monotonicity
      - Trivy Container Scan
      - Tsukuyomi Publication Preparation
      - Version Consistency Meta-check
      - WASM Build
      - WebUI Tests
      - Wyoming Protocol Smoke Test
      - ZH-EN Loanword Sync Gate
    types: [completed]

concurrency:
  group: required-gate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  gate:
    # Pushes to dev, schedules and manual runs complete too; only a pull
    # request head is gated. A cancelled run is nearly always a superseded
    # commit (a new push cancels ~50 runs at once), so it does not fire an
    # evaluation either. That cannot let a PR through: until a firing sees
    # every run completed, the status stays pending, which blocks the merge.
    # Re-running the cancelled workflow fires the gate again. Skipping here
    # costs no runner.
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          # workflow_run checks out the default branch, never the PR's code.
          # The script is stdlib-only and talks to the REST API through
          # GITHUB_TOKEN, so no credential is left in .git/config.
          persist-credentials: false
          sparse-checkout: scripts/check_required_gate.py
          sparse-checkout-cone-mode: false

      - name: Aggregate every workflow at the PR head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/check_required_gate.py \
            --head-sha "${HEAD_SHA}" \
            --repo "${GITHUB_REPOSITORY}" \
            --all-workflows \
            --event pull_request \
            --exclude "Required Status Check Gate" \
            --require-present CI \
            --on-cancelled fail \
            --status-context "required-gate/all-workflows" \
            --target-url "${RUN_URL}"
