name: "G2P Python CI"

on:
  push:
    branches: [dev, main]
    paths:
      - 'src/python/g2p/**'
      - '.github/workflows/g2p-python-ci.yml'
      - 'scripts/check_python_release_wheel.py'
    tags:
      - 'python-g2p-v*'
  pull_request:
    paths:
      - 'src/python/g2p/**'
      - '.github/workflows/g2p-python-ci.yml'
      - 'scripts/check_python_release_wheel.py'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '既存の公開用タグ（例: python-g2p-v0.3.0）。パッケージ内容が一致する場合だけ公開します'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.release_tag && format('refs/tags/{0}', github.event.inputs.release_tag) || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
      - name: Validate Python G2P release source
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [[ "$GITHUB_REF" != refs/tags/python-g2p-v* ]]; then
            echo "Regular CI: no publication requested"
            exit 0
          fi
          [[ "$RELEASE_TAG" =~ ^python-g2p-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid Python G2P release tag"
            exit 1
          }
          TAG_VERSION="${RELEASE_TAG#python-g2p-v}"
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("src/python/g2p/pyproject.toml", "rb"))["project"]["version"])')
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
          TAG_COMMIT=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          # Recovery may change CI, but must not change the package at its tag.
          git diff --exit-code "$TAG_COMMIT" HEAD -- src/python/g2p scripts/check_python_release_wheel.py
          test -z "$(git status --porcelain -- src/python/g2p scripts/check_python_release_wheel.py)"
          echo "Verified release tag: $RELEASE_TAG ($TAG_COMMIT)"
          echo "Build/provenance source: $(git rev-parse HEAD)"

  lint:
    needs: validate-release
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: astral-sh/setup-uv@v6.8.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: src/python/g2p
        run: uv sync --extra all --extra dev

      - name: Ruff check
        working-directory: src/python/g2p
        run: uv run ruff check piper_plus_g2p/ tests/

      - name: Ruff format check
        working-directory: src/python/g2p
        run: uv run ruff format --check piper_plus_g2p/ tests/

      - name: Mypy
        working-directory: src/python/g2p
        run: uv run mypy --ignore-missing-imports piper_plus_g2p/

  test:
    needs: validate-release
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: astral-sh/setup-uv@v6.8.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: src/python/g2p
        run: uv sync --extra all --extra dev

      - name: Download NLTK data (for g2p-en)
        working-directory: src/python/g2p
        run: uv run python -c "import nltk; nltk.download('averaged_perceptron_tagger_eng', quiet=True); nltk.download('cmudict', quiet=True)"

      - name: Run tests
        working-directory: src/python/g2p
        run: uv run pytest --cov=piper_plus_g2p --cov-report=term-missing -v

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-report
          path: src/python/g2p/.coverage
          retention-days: 7

  rust-check:
    needs: validate-release
    name: rust-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust

      - name: Cargo check piper-plus-g2p
        working-directory: src/rust
        run: cargo check -p piper-plus-g2p --all-features

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, test, rust-check]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: astral-sh/setup-uv@v6.8.0
        with:
          python-version: "3.13"

      - name: Build package
        working-directory: src/python/g2p
        run: uv build

      - name: Verify wheel
        working-directory: src/python/g2p
        run: |
          ls -la dist/
          test -f dist/piper_plus_g2p-*.whl
          test -f dist/piper_plus_g2p-*.tar.gz
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python ../../../scripts/check_python_release_wheel.py --name piper-plus-g2p --version "$VERSION" dist/*.whl

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dist
          path: src/python/g2p/dist/
          retention-days: 7

  test-extras:
    needs: validate-release
    name: test extras (${{ matrix.extra }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        extra: [ja, en, zh]
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: astral-sh/setup-uv@v6.8.0
      # venv は workspace (= cwd) の外に作る。 この job は uv.lock を経由せず
      # PyPI から fresh resolve するため nltk 3.10.x を引くが、 3.10 で追加された
      # nltk/inisec.py の NLTKSafeImportFinder は「解決先ファイルが cwd 配下に
      # 物理的に存在する」モジュールを一律 ImportError でブロックする。
      # workspace 内に venv を置くと site-packages 全体が cwd 配下となり、
      # regex 等の正規依存まで誤検知される。
      # エラーメッセージが案内する `-P` / PYTHONSAFEPATH=1 は判定が sys.path では
      # なくファイルの物理位置なので回避にならない (実測で確認済み)。
      - run: uv venv "${RUNNER_TEMP}/venv-extras"
      - run: uv pip install --python "${RUNNER_TEMP}/venv-extras" "./src/python/g2p[${{ matrix.extra }}]"
      - name: Download NLTK data (EN only)
        if: matrix.extra == 'en'
        run: |
          "${RUNNER_TEMP}/venv-extras/bin/python" -c "import nltk; nltk.download('averaged_perceptron_tagger_eng', quiet=True); nltk.download('cmudict', quiet=True)"
      - run: |
          "${RUNNER_TEMP}/venv-extras/bin/python" -c "from piper_plus_g2p import get_phonemizer; p = get_phonemizer('${{ matrix.extra }}'); print(p.phonemize('test'))"

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [validate-release, build, test-extras]
    if: startsWith(github.ref, 'refs/tags/python-g2p-v') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: astral-sh/setup-uv@v6.8.0

      - name: Verify version matches tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          TAG_VERSION="${RELEASE_TAG#python-g2p-v}"
          TOML_VERSION=$(grep '^version' src/python/g2p/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Tag version: $TAG_VERSION"
          echo "pyproject.toml version: $TOML_VERSION"
          if [ "$TAG_VERSION" != "$TOML_VERSION" ]; then
            echo "ERROR: Tag ($TAG_VERSION) != pyproject.toml ($TOML_VERSION)"
            exit 1
          fi

      - name: Download verified distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: src/python/g2p/dist/

      - name: Generate build provenance
        uses: actions/attest-build-provenance@v3.2.0
        with:
          subject-path: 'src/python/g2p/dist/*'

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: src/python/g2p/dist/
