# WaveNeXt RTF kill-switch bench (branch-local, one-shot)
#
# Stage 1 GPU smoke に投資する前に、WaveNeXt vs MB-iSTFT の decoder RTF を
# canonical 代理環境 (ubuntu-24.04 = サーバー級 4 vCPU、multi-runtime-rtf gate
# と同一ランナー) で白黒付ける。ランダム重みで速度のみ判定。
# 詳細: docs/design/wavenext-decoder-ablation/03-ablation-plan.md (Stage 1 評価)
#
# feat/wavenext-decoder-ablation ブランチ専用。dev マージ時にはこのファイルを
# 削除する (一時的な検証 workflow)。

name: WaveNeXt RTF Kill-Switch

on:
  push:
    branches: [feat/wavenext-decoder-ablation]
    paths:
      - 'scripts/bench_wavenext_rtf.py'
      - '.github/workflows/wavenext-rtf-killswitch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU torch + ORT
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxruntime onnxconverter-common numpy

      - name: Run kill-switch bench (contract threading)
        shell: bash
        run: |
          set -o pipefail
          python scripts/bench_wavenext_rtf.py --output wavenext_rtf_results.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: wavenext-rtf-results
          path: wavenext_rtf_results.json
          if-no-files-found: error
