name: dependency-review

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Dependency Review
        uses: actions/dependency-review-action@v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # ライセンス互換性チェック (allow-licenses と deny-licenses は同時指定不可)
          # allow-licenses にあるものだけ通過、それ以外は暗黙拒否。
          # GPL/AGPL/LGPL は当然 list にないので拒否される。
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC,
            Unicode-DFS-2016, Unicode-3.0, CC0-1.0, MPL-2.0,
            Zlib, OpenSSL, BSL-1.0, 0BSD, Apache-2.0 WITH LLVM-exception
          # dev / lint / docs 用 transitive dependency の例外
          # (配布バイナリには含まれず copyleft 伝播リスクなし)。
          # ライセンスを広く allow する代わりに、対象パッケージを明示し
          # carve-out することで scope を最小化する。
          #
          # pkg:npm/protobufjs: 7.5.8+ で scancode が
          # `BSD-3-Clause AND LicenseRef-scancode-protobuf` を検出する。
          # 後者は Google Protocol Buffers のオリジナル license (BSD-3-Clause
          # 系) で copyleft なし。 SPDX 標準名でないため allow-licenses では
          # 通せず、 package 単位で carve-out する。
          #
          # pkg:pypi/typing-extensions: 4.15+ で scancode が
          # `Python-2.0 AND GPL-1.0-or-later AND ... AND 0BSD` という合成式を
          # 検出する。 PyPI の license_expression は 4.14 / 4.16 とも PSF-2.0 で
          # copyleft なし (LICENSE 本文の GPL 互換性言及と同梱テストヘルパを
          # 誤検出したもの)。 AND 合成式は全構成要素が allow-licenses に必要で、
          # 通すには GPL-1.0-or-later を許可せざるを得ないため package 単位で
          # carve-out する。
          #
          # pkg:pypi/llvmlite: PyPI の license_expression は
          # `BSD-2-Clause AND Apache-2.0 WITH LLVM-exception` で 2 構成要素とも
          # allow-licenses に含まれているが、 dependency-review が WITH 例外を
          # 含む AND 合成式を解釈できず
          # `LicenseRef-bad-bsd-2-clause-and-apache-2.0-and-llvm-exception-and-bsd-2-clause`
          # (bsd-2-clause が重複した壊れた文字列) に落とすため素通りできない。
          # copyleft なしの parser bug なので package 単位で carve-out する。
          #
          # pkg:pypi/soxr: LGPL-2.1-or-later (実際に copyleft)。 以下 3 点から
          # 明示的に受容する。
          #   1. train extra 限定。 配布 wheel (`src/python_run`) には含まれず、
          #      piper-plus が soxr を再頒布することはない (LGPL の義務は頒布時
          #      に発生する)。
          #   2. librosa 0.11 の **必須** 依存であり、 explicit floor を外しても
          #      推移的に入る。 排除には librosa ごと落とす必要がある。
          #   3. 1.0.0 から機械可読な license_expression を宣言するようになった
          #      だけで、 0.5.x も classifier では LGPLv2+。 本 carve-out は新規
          #      exposure ではなく既存実態の明文化。
          #
          # pkg:pypi/defusedxml: PSF-2.0 (Python Software Foundation License 2.0)。
          # nltk 3.10.x が新規に依存する (XML パースの安全化用)。 PSF-2.0 は
          # permissive で copyleft 条項を持たず、 配布物に含めても頒布義務は
          # 発生しない。 SPDX 標準名だが allow-licenses に足すと PSF-2.0 全体を
          # 無条件許可することになるため、 既存方針どおり package 単位に絞る。
          #
          # pkg:pypi/pillow: MIT-CMU (HPND 系の permissive license)。 12.3.0 で
          # license 表記が `MIT-CMU` として機械可読化された (12.2.0 時点では
          # 検出されず素通りしていた) だけで、 ライセンス自体の変更はない。
          # copyleft なし。
          #
          # pkg:cargo/webpki-roots: CDLA-Permissive-2.0 (permissive、 copyleft なし)。
          # ureq 経由で ort-sys / jpreprocess-naist-jdic の build-dependencies に
          # だけ入り、 配布物には含まれない。 src/rust/deny.toml でも同じ理由で
          # 許可済み。 RUSTSEC-2026-0381 の修正で 1.0.6 → 1.0.10 に上げた際に
          # 検出された (ライセンス自体の変更はない)。 allow-licenses に足すと
          # CDLA-Permissive-2.0 全体を許可することになるため package 単位に絞る。
          #
          # Published archives reviewed in docs/design/python-g2p-license-2026-10-16.md:
          # audioop-lts 0.2.2: PSF-2.0 (scanner expands historical Python licenses).
          # protobuf 7.36.2: BSD-3-Clause + original Google protobuf notice.
          # regex 2026.9.29: Apache-2.0 AND CNRI-Python; both retained upstream.
          # These package-scoped entries do not permit GPL dependencies.
          allow-dependencies-licenses: >-
            pkg:pypi/audioop-lts,
            pkg:pypi/protobuf,
            pkg:pypi/regex,
            pkg:pypi/astroid,
            pkg:pypi/defusedxml,
            pkg:pypi/pillow,
            pkg:pypi/matplotlib,
            pkg:pypi/mypy,
            pkg:pypi/pylint,
            pkg:pypi/sphinx-rtd-theme,
            pkg:pypi/typing-extensions,
            pkg:pypi/llvmlite,
            pkg:pypi/soxr,
            pkg:npm/protobufjs,
            pkg:cargo/webpki-roots
          # 修正版が存在しない advisory の carve-out。
          # fail-on-severity: high のため、 upstream が未修正の high advisory は
          # 「依存を上げても下げても該当する」 のに PR で依存行を触った瞬間だけ
          # gate が落ちる (既存依存は dependency-review の検査対象外のため)。
          # 結果として脆弱性を減らす PR がブロックされるので、 patched 版が
          # 出るまで GHSA 単位で `allow-ghsas` に明示 carve-out する。 現在は無し。
          #
          # 解除済み: GHSA-8mgp-746c-j5xp (nltk <= 3.10.3) は 3.10.4 で修正され、
          # floor を `>=3.10.4` へ上げて外した (#709)。 修正済みの carve-out が
          # 残ると scripts/check_dependency_floors.py が落ちる。
          # 自動 fail にせず、PR comment で報告
          warn-only: false
          # vulnerability scope
          vulnerability-check: true
