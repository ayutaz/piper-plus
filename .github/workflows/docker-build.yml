          done

  build-cpp-inference:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write    # NEW: for OIDC sigstore signing
      attestations: write  # NEW: for build provenance attestation
    # ORT ExternalProject + Open JTalk dictionary build is already heavy
    # under amd64; arm64 emulation roughly doubles wall time. Bump the
    # default 360-min timeout headroom explicitly so builds don't get
    # killed mid-`ninja install`.
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean

      - uses: actions/checkout@v6.1.0
      - uses: docker/setup-qemu-action@v3
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to ghcr.io
        # PR では push しないので ghcr.io login も不要 (token write 権限も
        # 持たない fork PR でここが落ちるのも回避できる)。
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/cpp-inference
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=match,pattern=docker-v(.*),group=1
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./docker/cpp-inference/Dockerfile
          # cmake/ExternalDeps.cmake handles aarch64 — see
          # CMAKE_SYSTEM_PROCESSOR MATCHES "aarch64" branch. arm64 build
          # via QEMU emulation is slow (~2x amd64) but produces a valid
          # native arm64 image.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-cpp-inference,timeout=2m
          cache-to: type=gha,mode=max,scope=build-cpp-inference,timeout=2m,ignore-error=true
          # NEW: SLSA provenance + SBOM attestation
          provenance: true
          sbom: true

      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/docker-v')
        uses: sigstore/cosign-installer@v3.10.1
        with:
          cosign-release: 'v2.4.1'

      - name: Sign the published image
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/docker-v')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          images=()
          for tag in ${TAGS}; do
            images+=("${tag}@${DIGEST}")
          done
          cosign sign --yes "${images[@]}"
          for image in "${images[@]}"; do
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate-github-workflow-sha "$GITHUB_SHA" "$image"
          done

  # Multi-arch is critical here: Home Assistant ships on Raspberry Pi
  # (arm64) and the docker-build job is the only path users have to a
  # working wyoming-piper-plus tag. CPU-only image, no CUDA pinning.
  build-wyoming:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write    # NEW: for OIDC sigstore signing
      attestations: write  # NEW: for build provenance attestation
    # arm64 emulated build for pyopenjtalk (C++ extension compile from
    # source) takes ~25 min per arch on QEMU; default 360-min is plenty,
    # but we set an explicit headroom so a hung `pip install` is killed
    # before it consumes the whole queue slot.
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean

      - uses: actions/checkout@v6.1.0
      - uses: docker/setup-qemu-action@v3
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to ghcr.io
        # PR では push しないので ghcr.io login も不要 (token write 権限も
        # 持たない fork PR でここが落ちるのも回避できる)。
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/wyoming
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=match,pattern=docker-v(.*),group=1
            type=sha

      - name: Build and push to ghcr.io
        id: build
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./docker/wyoming/Dockerfile
          # python:3.11-slim-trixie has a native arm64 manifest; the
          # wyoming Dockerfile already builds pyopenjtalk from source in
          # stage 1 (build-essential + cmake + g++), so arm64 works
          # without further changes.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-wyoming,timeout=2m
          cache-to: type=gha,mode=max,scope=build-wyoming,timeout=2m,ignore-error=true
          # NEW: SLSA provenance + SBOM attestation
          provenance: true
          sbom: true

      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/docker-v')
        uses: sigstore/cosign-installer@v3.10.1
        with:
          cosign-release: 'v2.4.1'

      - name: Sign the published image
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/docker-v')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          images=()
          for tag in ${TAGS}; do
            images+=("${tag}@${DIGEST}")
          done
          cosign sign --yes "${images[@]}"
          for image in "${images[@]}"; do
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate-github-workflow-sha "$GITHUB_SHA" "$image"
          done

      # --- Docker Hub publish (tag push or workflow_dispatch only) ---
      # Fail-fast on missing credentials — see python-inference job above
      # for full rationale (silent-skip = baseline collapse a la PR #419).
      - name: Check Docker Hub credentials
        if: startsWith(github.ref, 'refs/tags/docker-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        id: dockerhub-check
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not configured but tag push / workflow_dispatch requires Docker Hub publish. Configure repository secrets to unblock release."
            exit 1
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: >-
          steps.dockerhub-check.outputs.available == 'true' &&
          (startsWith(github.ref, 'refs/tags/docker-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Hub metadata
        if: >-
          steps.dockerhub-check.outputs.available == 'true' &&
          (startsWith(github.ref, 'refs/tags/docker-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        id: meta-dockerhub
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/wyoming-piper-plus
          tags: |
            type=semver,pattern={{version}},prefix=
            type=match,pattern=docker-v(.*),group=1,prefix=
            type=semver,pattern={{major}}.{{minor}},prefix=
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Push to Docker Hub
        if: >-
          steps.dockerhub-check.outputs.available == 'true' &&
          (startsWith(github.ref, 'refs/tags/docker-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        timeout-minutes: 25
        env:
          SOURCE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/wyoming
          SOURCE_DIGEST: ${{ steps.build.outputs.digest }}
          DESTINATION_TAGS: ${{ steps.meta-dockerhub.outputs.tags }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          python3 scripts/publish_docker_mirror.py

      - name: Sign and verify Docker Hub mirrors
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/docker-v')
        env:
          TAGS: ${{ steps.meta-dockerhub.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for tag in ${TAGS}; do
            image="docker.io/${tag}@${DIGEST}"
            cosign sign --yes "$image"
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate-github-workflow-sha "$GITHUB_SHA" "$image" \
              > "docker-mirror-proof/signature-$(echo "$tag" | tr '/:' '--').json"
          done

      - name: Preserve registry mirror evidence
        if: always() && steps.dockerhub-check.outputs.available == 'true'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: docker-mirror-wyoming
          path: docker-mirror-proof/
          if-no-files-found: error

  build-webui:
    needs: inference-regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write    # NEW: for OIDC sigstore signing
      attestations: write  # NEW: for build provenance attestation
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean

      - uses: actions/checkout@v6.1.0
      - uses: docker/setup-qemu-action@v3
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to ghcr.io
        # PR では push しないので ghcr.io login も不要 (token write 権限も
        # 持たない fork PR でここが落ちるのも回避できる)。
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/webui
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=match,pattern=docker-v(.*),group=1
            type=sha

      - name: Build and push to ghcr.io
        id: build
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./docker/webui/Dockerfile
          # Pure Python + Gradio + slim-trixie -> arm64 native available.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-webui,timeout=2m
          cache-to: type=gha,mode=max,scope=build-webui,timeout=2m,ignore-error=true
          # NEW: SLSA provenance + SBOM attestation
          provenance: true
          sbom: true

      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/docker-v')
        uses: sigstore/cosign-installer@v3.10.1
        with:
          cosign-release: 'v2.4.1'

      - name: Sign the published image
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/docker-v')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          images=()
          for tag in ${TAGS}; do
            images+=("${tag}@${DIGEST}")
          done
          cosign sign --yes "${images[@]}"
          for image in "${images[@]}"; do
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate-github-workflow-sha "$GITHUB_SHA" "$image"
          done

      # --- Docker Hub publish (tag push or workflow_dispatch only) ---
      # Fail-fast on missing credentials — see python-inference job above
      # for full rationale (silent-skip = baseline collapse a la PR #419).
      - name: Check Docker Hub credentials
        if: startsWith(github.ref, 'refs/tags/docker-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        id: dockerhub-check
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not configured but tag push / workflow_dispatch requires Docker Hub publish. Configure repository secrets to unblock release."
            exit 1
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: >-
          steps.dockerhub-check.outputs.available == 'true' &&
          (startsWith(github.ref, 'refs/tags/docker-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Hub metadata
        if: >-
          steps.dockerhub-check.outputs.available == 'true' &&
          (startsWith(github.ref, 'refs/tags/docker-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        id: meta-dockerhub
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/piper-plus-webui
          tags: |
            type=semver,pattern={{version}},prefix=
            type=match,pattern=docker-v(.*),group=1,prefix=
            type=semver,pattern={{major}}.{{minor}},prefix=
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Push to Docker Hub
        if: >-
          steps.dockerhub-check.outputs.available == 'true' &&
          (startsWith(github.ref, 'refs/tags/docker-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        timeout-minutes: 25
        env:
          SOURCE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/webui
          SOURCE_DIGEST: ${{ steps.build.outputs.digest }}
          DESTINATION_TAGS: ${{ steps.meta-dockerhub.outputs.tags }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          python3 scripts/publish_docker_mirror.py

      - name: Sign and verify Docker Hub mirrors
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/docker-v')
        env:
          TAGS: ${{ steps.meta-dockerhub.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for tag in ${TAGS}; do
            image="docker.io/${tag}@${DIGEST}"
            cosign sign --yes "$image"
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate-github-workflow-sha "$GITHUB_SHA" "$image" \
              > "docker-mirror-proof/signature-$(echo "$tag" | tr '/:' '--').json"
          done

      - name: Preserve registry mirror evidence
        if: always() && steps.dockerhub-check.outputs.available == 'true'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: docker-mirror-webui
          path: docker-mirror-proof/
          if-no-files-found: error
