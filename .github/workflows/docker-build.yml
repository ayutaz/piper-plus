name: Docker Build and Push

# Multi-arch publishing strategy (Issue: HA Raspberry Pi user, dev audit):
#
# Most images target both linux/amd64 and linux/arm64 via QEMU emulation
# (set up by docker/setup-qemu-action). emulated arm64 builds are 3-5x
# slower than native amd64; we accept that to keep a single workflow.
#
# python-inference is CUDA-based and has NO arm64 image available
# upstream (nvidia/cuda:* manifests are amd64-only outside Jetson).
# Two build-* jobs handle this:
#   * build-python-inference          -> amd64 only, CUDA (Dockerfile)
#   * build-python-inference-cpu      -> arm64 (+ amd64), CPU (Dockerfile.cpu)
# Same ghcr.io image; tags carry a `-cpu` suffix on the CPU variant so HA
# users on Raspberry Pi can pull `:dev-cpu` and not the CUDA tag.
#
# Other images (wyoming, webui, cpp-dev, cpp-inference, python-train) use
# CUDA-free or arm64-compatible bases and build natively on both arches.

on:
  push:
    branches: [dev]
    paths:
      - 'docker/**'
      - 'Dockerfile'
      - 'src/python/**'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      # Copied by the python-inference / webui / wyoming / python-train /
      # cpp-inference Dockerfiles (tests/scripts/test_docker_workflow_paths.py).
      - 'VERSION'
      - 'src/python_run/requirements_webui.txt'
      - 'src/python_run/overrides_webui.txt'
      - '.github/workflows/docker-build.yml'
      - 'tests/scripts/test_docker_release_tags.py'
      - 'tests/scripts/test_docker_publish_stability.py'
      - 'scripts/check_docker_publish_stability.py'
      - 'scripts/publish_docker_mirror.py'
      - 'tests/scripts/test_docker_signature_recovery.py'
      - 'scripts/resolve_docker_release_images.py'
      - '.github/workflows/release-docker-signatures.yml'
    tags:
      # A root v* release reuses this independently published Docker release.
      # Building both tag families rebuilt the same seven images twice.
      - 'docker-v*'
  # PR でも build-only で同じ Dockerfile を回し、 dev push 限定で潜む
  # Dockerfile 起因の失敗 (wget silent fail / OS update による package
  # 取得失敗等) を早期検知する。 ghcr.io login / cosign sign / Docker Hub
  # への push は push event 限定なので、 PR では副作用なし。 paths は
  # push 側と同期。
  # PR では python-inference / python-train を docker に読み込み、 同じ
  # job でイメージの中身を検査する (以前は docker-test.yml が同じ
  # Dockerfile をもう一度ビルドして検査していた)。
  pull_request:
    branches: [dev]
    paths:
      - 'docker/**'
      - 'Dockerfile'
      - 'src/python/**'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      # Copied by the python-inference / webui / wyoming / python-train /
      # cpp-inference Dockerfiles (tests/scripts/test_docker_workflow_paths.py).
      - 'VERSION'
      - 'src/python_run/requirements_webui.txt'
      - 'src/python_run/overrides_webui.txt'
      - '.github/workflows/docker-build.yml'
      - 'tests/scripts/test_docker_release_tags.py'
      - 'tests/scripts/test_docker_publish_stability.py'
      - 'scripts/check_docker_publish_stability.py'
      - 'scripts/publish_docker_mirror.py'
      - 'tests/scripts/test_docker_signature_recovery.py'
      - 'scripts/resolve_docker_release_images.py'
      - '.github/workflows/release-docker-signatures.yml'
  workflow_dispatch:

# 同一 PR への連続 push で古い build を cancel。 push to dev は cancel しない
# (image push が途中で死ぬとレジストリが不整合になり得るため)。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  inference-regression:
    name: Docker inference PUA regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: astral-sh/setup-uv@v6.8.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
      - name: Install isolated inference test dependencies
        run: |
          uv venv --python 3.13 "${RUNNER_TEMP}/venv-docker-inference"
          uv pip install --python "${RUNNER_TEMP}/venv-docker-inference/bin/python" \
            pytest pyyaml numpy soundfile onnxruntime ./src/python/g2p
      - name: Check synthesis, timing and release tag regression
        run: |
          "${RUNNER_TEMP}/venv-docker-inference/bin/python" -m pytest \
            docker/python-inference/test_phoneme_encoding.py \
            tests/scripts/test_docker_release_tags.py \
            tests/scripts/test_docker_publish_stability.py -o addopts= -q
          "${RUNNER_TEMP}/venv-docker-inference/bin/python" -m pytest \
            tests/scripts/test_docker_signature_recovery.py -o addopts= -q

  build-python-inference:
    needs: inference-regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write    # NEW: for OIDC sigstore signing
      attestations: write  # NEW: for build provenance attestation
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean

      - uses: actions/checkout@v6.1.0
      - uses: docker/setup-qemu-action@v3
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to ghcr.io
        # PR では push しないので ghcr.io login も不要 (token write 権限も
        # 持たない fork PR でここが落ちるのも回避できる)。
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/python-inference
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=match,pattern=docker-v(.*),group=1
            type=sha

      - name: Build and push to ghcr.io
        id: build
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./docker/python-inference/Dockerfile
          # CUDA base nvidia/cuda:* is amd64-only; arm64 build is published
          # by the build-python-inference-cpu job below.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # A PR does not push; it loads the image into docker so the test
          # steps below run against this build.
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ github.event_name == 'pull_request' && 'piper-python-inference:test' || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-python-inference,timeout=2m
          cache-to: type=gha,mode=max,scope=build-python-inference,timeout=2m,ignore-error=true
          # NEW: SLSA provenance + SBOM attestation. A PR pushes nothing, so
          # its attestations were never used, and an image with attestations
          # is a manifest list that `load` cannot import.
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      # PR only: the image was loaded into docker above. These checks moved
      # here from docker-test.yml, which built the same Dockerfile a second
      # time to run them.
      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm piper-python-inference:test python -c "
          import piper_train; print('piper_train OK')
          import onnxruntime as ort; print(f'onnxruntime {ort.__version__} OK')
          print(f'Available providers: {ort.get_available_providers()}')
          import soundfile; print('soundfile OK')
          print('All smoke tests passed')
          "

      - name: OpenAI-compatible API tests
        if: github.event_name == 'pull_request'
        run: |
          # Run docker/python-inference/test_openai_api.py inside the built image.
          # The test uses FastAPI TestClient with a mocked PiperInferenceEngine,
          # so no ONNX model is required. The runtime image ships without pip
          # (#748), so the test dependencies go in with uv, as root, into this
          # throwaway container.
          docker run --rm -u root \
            -v ${{ github.workspace }}/docker/python-inference/test_openai_api.py:/app/test_openai_api.py \
            -e PYTHONUNBUFFERED=1 \
            piper-python-inference:test \
            bash -c "uv pip install --system --no-cache pytest httpx && python -m pytest /app/test_openai_api.py -v --tb=short"

      - name: WebUI smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm piper-python-inference:test python -c "
          import gradio; print(f'gradio {gradio.__version__} OK')
          print('WebUI smoke test passed')
          "

      - name: Test --device cpu providers
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm piper-python-inference:test python -c "
          import onnxruntime as ort
          providers = ort.get_available_providers()
          assert 'CPUExecutionProvider' in providers, f'CPUExecutionProvider not found in {providers}'
          print(f'CPU provider available: OK')
          print('--device cpu test passed')
          "

      - name: Inference test - Japanese
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/output && chmod 777 /tmp/output
          docker run --rm \
            -v ${{ github.workspace }}/test/models:/models \
            -v /tmp/output:/output \
            -e CUDA_VISIBLE_DEVICES="" \
            -e PIPER_PLUS_DISABLE_CACHE=1 \
            piper-python-inference:test \
            python inference.py \
              --model /models/multilingual-test-medium.onnx \
              --config /models/multilingual-test-medium.onnx.json \
              --output /output/test_ja.wav \
              --text "こんにちは、今日は良い天気ですね。" \
              --language ja \
              --speaker-id 0 \
              --device cpu

          FILE_SIZE=$(stat --format=%s /tmp/output/test_ja.wav)
          echo "Output: test_ja.wav ($FILE_SIZE bytes)"
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "ERROR: Output file too small ($FILE_SIZE bytes)"
            exit 1
          fi
          echo "Japanese inference test passed"

      - name: Inference test - English
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/test/models:/models \
            -v /tmp/output:/output \
            -e CUDA_VISIBLE_DEVICES="" \
            -e PIPER_PLUS_DISABLE_CACHE=1 \
            piper-python-inference:test \
            python inference.py \
              --model /models/multilingual-test-medium.onnx \
              --config /models/multilingual-test-medium.onnx.json \
              --output /output/test_en.wav \
              --text "Hello, how are you today?" \
              --language en \
              --speaker-id 0 \
              --device cpu

          FILE_SIZE=$(stat --format=%s /tmp/output/test_en.wav)
          echo "Output: $OUTPUT_FILE ($FILE_SIZE bytes)"
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "ERROR: Output file too small ($FILE_SIZE bytes)"
            exit 1
          fi
          echo "English inference test passed"

      - name: Config auto-detect test - {model}.onnx.json
        if: github.event_name == 'pull_request'
        run: |
          # Test that --config can be omitted when {model}.onnx.json exists next to the model
          docker run --rm \
            -v ${{ github.workspace }}/test/models:/models \
            -v /tmp/output:/output \
            -e CUDA_VISIBLE_DEVICES="" \
            -e PIPER_PLUS_DISABLE_CACHE=1 \
            piper-python-inference:test \
            python inference.py \
              --model /models/multilingual-test-medium.onnx \
              --output /output/test_autodetect.wav \
              --text "自動検出テストです。" \
              --language ja \
              --speaker-id 0 \
              --device cpu

          FILE_SIZE=$(stat --format=%s /tmp/output/test_autodetect.wav)
          echo "Output: test_autodetect.wav ($FILE_SIZE bytes)"
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "ERROR: Output file too small ($FILE_SIZE bytes)"
            exit 1
          fi
          echo "Config auto-detect ({model}.onnx.json) test passed"

      - name: Config fallback test - config.json
        if: github.event_name == 'pull_request'
        run: |
          # Test that --config can be omitted when only config.json exists in model directory
          # Create a temp directory with model + config.json (no {model}.onnx.json)
          mkdir -p /tmp/fallback-test
          cp ${{ github.workspace }}/test/models/multilingual-test-medium.onnx /tmp/fallback-test/multilingual-test-medium.onnx
          cp ${{ github.workspace }}/test/models/multilingual-test-medium.onnx.json /tmp/fallback-test/config.json

          docker run --rm \
            -v /tmp/fallback-test:/models/fallback \
            -v /tmp/output:/output \
            -e CUDA_VISIBLE_DEVICES="" \
            -e PIPER_PLUS_DISABLE_CACHE=1 \
            piper-python-inference:test \
            python inference.py \
              --model /models/fallback/multilingual-test-medium.onnx \
              --output /output/test_fallback.wav \
              --text "Hello, this is a fallback config test." \
              --language en \
              --speaker-id 0 \
              --device cpu

          FILE_SIZE=$(stat --format=%s /tmp/output/test_fallback.wav)
          echo "Output: test_fallback.wav ($FILE_SIZE bytes)"
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "ERROR: Output file too small ($FILE_SIZE bytes)"
            exit 1
          fi
          echo "Config fallback (config.json) test passed"

      - name: Config not found error test
        if: github.event_name == 'pull_request'
        run: |
          # Test that inference exits with error when no config file exists
          mkdir -p /tmp/noconfig
          cp ${{ github.workspace }}/test/models/multilingual-test-medium.onnx /tmp/noconfig/multilingual-test-medium.onnx

          docker run --rm \
            -v /tmp/noconfig:/models/noconfig \
            -v /tmp/output:/output \
            -e CUDA_VISIBLE_DEVICES="" \
            -e PIPER_PLUS_DISABLE_CACHE=1 \
            piper-python-inference:test \
            python inference.py \
              --model /models/noconfig/multilingual-test-medium.onnx \
              --output /output/should_not_exist.wav \
              --text "This should fail." \
              --language en \
              --speaker-id 0 \
              --device cpu \
            && { echo "ERROR: Expected non-zero exit code but got 0"; exit 1; } \
            || echo "Config not found error test passed (non-zero exit as expected)"

          if [ -f /tmp/output/should_not_exist.wav ]; then
            echo "ERROR: Output file should not exist"
            exit 1
          fi
          echo "Python config not found error test passed"

      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/docker-v')
        uses: sigstore/cosign-installer@v3.10.1
        with:
          cosign-release: 'v2.4.1'

      - name: Sign the published image
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/docker-v')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          images=()
          for tag in ${TAGS}; do
            images+=("${tag}@${DIGEST}")
          done
          cosign sign --yes "${images[@]}"
          for image in "${images[@]}"; do
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate-github-workflow-sha "$GITHUB_SHA" "$image"
          done

      # --- Docker Hub publish (tag push or workflow_dispatch only) ---
      #
      # Fail-fast on missing credentials when the trigger explicitly asks for
      # a Docker Hub publish (tag push or manual dispatch). Previously the
      # step emitted `::notice::` and continued green, which made silent
      # publish skips invisible (same failure pattern as the PR #419 baseline
      # collapse — see feedback_ci_cancelled_baseline.md). For tag pushes
      # the publish is mandatory; for workflow_dispatch we also require
      # credentials because the only reason to manually dispatch is to
      # publish. Non-tag / non-dispatch triggers never enter this branch
      # (the outer `if:` gates it) so dev pushes / PRs remain unaffected.
      - name: Check Docker Hub credentials
        if: startsWith(github.ref, 'refs/tags/docker-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        id: dockerhub-check
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not configured but tag push / workflow_dispatch requires Docker Hub publish. Configure repository secrets to unblock release."
            exit 1
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: >-
          steps.dockerhub-check.outputs.available == 'true' &&
          (startsWith(github.ref, 'refs/tags/docker-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Hub metadata
        if: >-
          steps.dockerhub-check.outputs.available == 'true' &&
          (startsWith(github.ref, 'refs/tags/docker-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        id: meta-dockerhub
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/piper-plus-api
          tags: |
            type=semver,pattern={{version}},prefix=
            type=match,pattern=docker-v(.*),group=1,prefix=
            type=semver,pattern={{major}}.{{minor}},prefix=
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Push to Docker Hub
        if: >-
          steps.dockerhub-check.outputs.available == 'true' &&
          (startsWith(github.ref, 'refs/tags/docker-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        timeout-minutes: 25
        env:
          SOURCE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/python-inference
          SOURCE_DIGEST: ${{ steps.build.outputs.digest }}
          DESTINATION_TAGS: ${{ steps.meta-dockerhub.outputs.tags }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          python3 scripts/publish_docker_mirror.py

      - name: Sign and verify Docker Hub mirrors
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/docker-v')
        env:
          TAGS: ${{ steps.meta-dockerhub.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for tag in ${TAGS}; do
            image="docker.io/${tag}@${DIGEST}"
            cosign sign --yes "$image"
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate-github-workflow-sha "$GITHUB_SHA" "$image" \
              > "docker-mirror-proof/signature-$(echo "$tag" | tr '/:' '--').json"
          done

      - name: Preserve registry mirror evidence
        if: always() && steps.dockerhub-check.outputs.available == 'true'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: docker-mirror-python-inference
          path: docker-mirror-proof/
          if-no-files-found: error


  # CPU-only variant of python-inference for arm64 (HA Raspberry Pi /
  # Apple Silicon / AWS Graviton). nvidia/cuda:* base used by the CUDA
  # variant has no arm64 manifest, so we ship a separate image built from
  # docker/python-inference/Dockerfile.cpu. The image is tagged with a
  # `-cpu` suffix on ghcr.io so consumers can pin explicitly:
  #   ghcr.io/.../python-inference:dev-cpu
  build-python-inference-cpu:
    needs: inference-regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write    # NEW: for OIDC sigstore signing
      attestations: write  # NEW: for build provenance attestation
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean

      - uses: actions/checkout@v6.1.0
      - uses: docker/setup-qemu-action@v3
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to ghcr.io
        # PR では push しないので ghcr.io login も不要 (token write 権限も
        # 持たない fork PR でここが落ちるのも回避できる)。
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/python-inference
          # `-cpu` suffix distinguishes from the CUDA-default tags above.
          # type=ref produces e.g. `dev-cpu`, type=semver produces `1.12.0-cpu`.
          flavor: |
            suffix=-cpu,onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=match,pattern=docker-v(.*),group=1
            type=sha

      - name: Build and push CPU image (multi-arch)
        id: build
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./docker/python-inference/Dockerfile.cpu
          # arm64 first so multi-arch manifest defaults to the value HA
          # users care about. amd64 also published for Apple Silicon devs
          # who don't want CUDA pulls.
          platforms: linux/arm64,linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-python-inference-cpu,timeout=2m
          cache-to: type=gha,mode=max,scope=build-python-inference-cpu,timeout=2m,ignore-error=true
          # NEW: SLSA provenance + SBOM attestation
          provenance: true
          sbom: true

      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/docker-v')
        uses: sigstore/cosign-installer@v3.10.1
        with:
          cosign-release: 'v2.4.1'

      - name: Sign the published image
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/docker-v')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          images=()
          for tag in ${TAGS}; do
            images+=("${tag}@${DIGEST}")
          done
          cosign sign --yes "${images[@]}"
          for image in "${images[@]}"; do
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate-github-workflow-sha "$GITHUB_SHA" "$image"
          done

  # Trial distroless variants. Build-only (never pushed to ghcr.io)
  # until a promotion PR validates each image's runtime behaviour
  # (HF Space cold start for python-inference, webui-test.yml smoke
  # for webui, container test for cpp-inference, dev-experience for
  # cpp-dev). Each job catches multi-arch buildx breakage the
  # per-image trial workflow doesn't exercise (those run amd64 only
  # for A/B size comparisons).
  build-distroless-trials:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: python-inference-cpu
            dockerfile: docker/python-inference/Dockerfile.cpu.distroless
            cache_scope: python-inference-cpu-distroless
          - name: cpp-inference
            dockerfile: docker/cpp-inference/Dockerfile.distroless
            cache_scope: cpp-inference-distroless
          - name: webui
            dockerfile: docker/webui/Dockerfile.distroless
            cache_scope: webui-distroless
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean

      - uses: actions/checkout@v6.1.0
      - uses: docker/setup-qemu-action@v3
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@v3.12.0

      - name: Build distroless trial image (multi-arch, no push)
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          # Same arch coverage as the canonical CPU image — proves the
          # multi-stage builder + final combo works for arm64 too.
          platforms: linux/arm64,linux/amd64
          push: false
          load: false
          tags: piper-plus-${{ matrix.target.name }}:distroless-trial
          cache-from: type=gha,scope=${{ matrix.target.cache_scope }},timeout=2m
          cache-to: type=gha,mode=max,scope=${{ matrix.target.cache_scope }},timeout=2m,ignore-error=true

  build-python-train:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write    # NEW: for OIDC sigstore signing
      attestations: write  # NEW: for build provenance attestation
    timeout-minutes: 90
    steps:
      - name: Free disk space (aggressive)
        # CUDA 12.1 devel + cuDNN8 + PyTorch CUDA wheels の組み合わせは ~25-30GB を消費し、
        # ubuntu-latest の 84GB のうち pre-installed toolchain (Android SDK, .NET, Haskell,
        # Swift, miniconda, etc.) が ~50GB を専有しているため、 build 中に "no space left
        # on device" で fail することがある (PR #474, run 25851898518)。
        # 既知の hostedtoolcache + apt の hard-to-find slot を全部 nuke して 40GB+ を確保する。
        run: |
          set -eux
          # === Hosted tool caches (>20GB) ===
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /opt/microsoft \
            /opt/pipx \
            "$AGENT_TOOLSDIRECTORY" \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/graalvm \
            /usr/local/.ghcup \
            /usr/local/julia* \
            /usr/share/swift \
            /usr/share/miniconda \
            /usr/share/az_* \
            /usr/share/kotlinc \
            /usr/share/gradle* \
            /home/linuxbrew \
            /home/runneradmin/.rustup
          # === Heavy apt packages (Azure CLI, gcloud, Firefox, Chromium, ...) ===
          sudo apt-get purge -y --auto-remove \
            'aspnetcore-*' 'dotnet-*' 'llvm-*' 'php*' \
            azure-cli google-cloud-cli google-chrome-stable firefox \
            powershell mono-devel 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean
          # === Docker dangling images + buildx prune ===
          sudo docker image prune --all --force
          sudo docker builder prune --all --force 2>/dev/null || true
          # === Swap is unused for buildx; release 4GB ===
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /mnt/swapfile /swapfile 2>/dev/null || true
          echo "--- Disk space after cleanup ---"
          df -h /
          avail_gb=$(df / --output=avail -BG | tail -1 | tr -d ' G')
          if [ "$avail_gb" -lt 40 ]; then
            echo "::warning::Low disk space (${avail_gb}G). Build may fail on small runners."
          fi

      - uses: actions/checkout@v6.1.0
      - uses: docker/setup-qemu-action@v3
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to ghcr.io
        # PR では push しないので ghcr.io login も不要 (token write 権限も
        # 持たない fork PR でここが落ちるのも回避できる)。
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/python-train
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=match,pattern=docker-v(.*),group=1
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./docker/python-train/Dockerfile
          # python-train uses nvidia/cuda:12.1.0-cudnn8-* which has no
          # arm64 manifest, and arm64 model training is unsupported (no
          # PyTorch CUDA wheels). amd64 only.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # A PR does not push; it loads the image into docker so the test
          # steps below run against this build.
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ github.event_name == 'pull_request' && 'piper-python-train:test' || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-python-train,timeout=2m
          # A PR exports mode=min, as docker-test.yml did for this image.
          # mode=max writes every intermediate stage (CUDA devel + cuDNN8
          # builder, ~15GB): on PR run 40234640733 the export alone took
          # 2756s of a 56-minute job, and it competes with `load` for disk
          # ("no space left on device", PR #474). Pushes keep mode=max.
          cache-to: type=gha,mode=${{ github.event_name == 'pull_request' && 'min' || 'max' }},scope=build-python-train,timeout=2m,ignore-error=true
          # NEW: SLSA provenance + SBOM attestation. A PR pushes nothing, so
          # its attestations were never used, and an image with attestations
          # is a manifest list that `load` cannot import.
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      # PR only: the image was loaded into docker above. These checks moved
      # here from docker-test.yml, which built the same Dockerfile a second
      # time to run them.
      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm piper-python-train:test python -c "
          import torch; print(f'PyTorch {torch.__version__} OK')
          import pytorch_lightning; print(f'PyTorch Lightning {pytorch_lightning.__version__} OK')
          import piper_train; print('piper_train OK')
          import onnxruntime as ort; print(f'onnxruntime {ort.__version__} OK')
          print('All smoke tests passed')
          "

      - name: NLTK data availability test
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm piper-python-train:test python -c "
          import nltk
          nltk.data.find('taggers/averaged_perceptron_tagger_eng')
          print('averaged_perceptron_tagger_eng: OK')
          nltk.data.find('corpora/cmudict')
          print('cmudict: OK')
          print('NLTK data test passed')
          "

      - name: English phonemizer test
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm piper-python-train:test python -c "
          import importlib.metadata
          from piper_plus_g2p._vendor.g2p_en import G2p
          installed = {d.metadata['Name'].lower().replace('_', '-') for d in importlib.metadata.distributions()}
          assert not installed.intersection({'distance', 'g2p-en'}), 'Old English dependencies are installed'
          g2p = G2p()
          result = g2p('Hello world')
          assert result == ['HH', 'AH0', 'L', 'OW1', ' ', 'W', 'ER1', 'L', 'D'], result
          print(f'Bundled English G2P output: {result}')
          print('English phonemizer test passed')
          "

      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/docker-v')
        uses: sigstore/cosign-installer@v3.10.1
        with:
          cosign-release: 'v2.4.1'

      - name: Sign the published image
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/docker-v')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          images=()
          for tag in ${TAGS}; do
            images+=("${tag}@${DIGEST}")
          done
          cosign sign --yes "${images[@]}"
          for image in "${images[@]}"; do
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate-github-workflow-sha "$GITHUB_SHA" "$image"
          done

  build-cpp-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write    # NEW: for OIDC sigstore signing
