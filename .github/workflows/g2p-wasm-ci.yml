name: "G2P WASM CI"

on:
  push:
    branches: [dev]
    paths:
      - 'src/wasm/g2p/**'
      - 'src/wasm/g2p/src/latin-common/**'
      - 'src/python/g2p/piper_plus_g2p/data/zh_en_loanword.json'
      # Canonical of the bundled CMU dictionary (test-package-metadata.js,
      # test-english-cmudict.js).
      - 'src/rust/piper-plus-g2p/data/cmudict_data.json'
      # Shared normalization cases read by test-english-normalize.js.
      - 'tests/fixtures/g2p/english_normalize_cases.json'
      # Canonical of the bundled pinyin dictionaries (test-package-metadata.js).
      - 'src/rust/piper-plus-g2p/data/pinyin_*.json'
      - 'tests/fixtures/g2p/phoneme_test_cases.json'
      # Read by test/test-g2p-golden-parity.js.
      - 'tests/fixtures/g2p/phoneme_test_cases_golden.json'
      - 'tests/fixtures/g2p/known_divergences.json'
      # Read by the CJK punctuation contract tests (#823).
      - 'tests/fixtures/g2p/cjk_punctuation_cases.json'
      # Read by the input-sanitize contract tests.
      - 'tests/fixtures/g2p/input_sanitize_cases.json'
      - 'tests/fixtures/g2p/english_no_drop_words.json'
      - 'src/python/g2p/piper_plus_g2p/data/pua.json'
      - 'tests/fixtures/g2p/zh_en_loanword_matrix.json'
      - '.github/workflows/g2p-wasm-ci.yml'
    tags:
      - 'wasm-g2p-v*'
  # GitHub creates no tag push event when one push carries more than three
  # tags, so a release tag pushed together with others never starts this
  # workflow. Run it from dev with the existing tag to publish that tag.
  workflow_dispatch:
    inputs:
      release_tag:
        description: '既存の公開用タグ（例: wasm-g2p-v0.5.0）。タグの push で起動しなかったときに使います'
        required: true
        type: string
  pull_request:
    paths:
      - 'src/wasm/g2p/**'
      - 'src/wasm/g2p/src/latin-common/**'
      - 'src/python/g2p/piper_plus_g2p/data/zh_en_loanword.json'
      # Canonical of the bundled CMU dictionary (test-package-metadata.js,
      # test-english-cmudict.js).
      - 'src/rust/piper-plus-g2p/data/cmudict_data.json'
      # Shared normalization cases read by test-english-normalize.js.
      - 'tests/fixtures/g2p/english_normalize_cases.json'
      # Canonical of the bundled pinyin dictionaries (test-package-metadata.js).
      - 'src/rust/piper-plus-g2p/data/pinyin_*.json'
      - 'tests/fixtures/g2p/phoneme_test_cases.json'
      # Read by test/test-g2p-golden-parity.js.
      - 'tests/fixtures/g2p/phoneme_test_cases_golden.json'
      - 'tests/fixtures/g2p/known_divergences.json'
      # Read by the CJK punctuation contract tests (#823).
      - 'tests/fixtures/g2p/cjk_punctuation_cases.json'
      # Read by the input-sanitize contract tests.
      - 'tests/fixtures/g2p/input_sanitize_cases.json'
      - 'tests/fixtures/g2p/english_no_drop_words.json'
      - 'src/python/g2p/piper_plus_g2p/data/pua.json'
      - 'tests/fixtures/g2p/zh_en_loanword_matrix.json'
      - '.github/workflows/g2p-wasm-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/wasm/g2p
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          # Empty except on workflow_dispatch, where every job checks out the tag.
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/wasm/g2p/package.json

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: |
          if npm run lint --if-present 2>/dev/null; then
            echo "Lint passed"
          else
            echo "No lint script found, skipping"
          fi

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['24.x']
    defaults:
      run:
        working-directory: src/wasm/g2p
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          # Empty except on workflow_dispatch, where every job checks out the tag.
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: src/wasm/g2p/package.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: node --test test/test-encode.js test/test-english.js test/test-g2p.js test/test-g2p-contract.js test/test-g2p-integration.js test/test-languages.js test/test-detect.js test/test-cjk-punctuation-contract.js test/test-pua-map.js test/test-swedish.js test/test-korean.js test/test-custom-dict.js test/test-strict-mode.js test/test-spanish.js test/test-french.js test/test-portuguese.js test/test-chinese.js test/test-chinese-zh-en.js test/test-latin-common.js test/test-exports.js test/test-package-metadata.js test/test-input-sanitize-contract.js

      - name: Run golden tests
        run: node --test test/test-g2p-golden.js test/test-g2p-golden-parity.js

  size-check:
    name: size-check
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/wasm/g2p
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          # Empty except on workflow_dispatch, where every job checks out the tag.
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/wasm/g2p/package.json

      - name: Install dependencies
        run: npm install

      - name: Check package size
        run: |
          TARBALL=$(npm pack 2>/dev/null)
          SIZE=$(stat -c%s "$TARBALL" 2>/dev/null || stat -f%z "$TARBALL")
          SIZE_KB=$(awk "BEGIN {printf \"%.2f\", $SIZE / 1024}")
          echo "Package size: $SIZE bytes ($SIZE_KB KB)"
          rm -f "$TARBALL"
          # The package bundles the CMU dictionary (#828, ~0.9 MB packed) and
          # the pinyin dictionaries (#829, ~0.8 MB packed); 3 MB leaves room
          # for both without hiding an accidental large file.
          if [ "$SIZE" -gt 3145728 ]; then
            echo "ERROR: Package size ($SIZE_KB KB) exceeds 3MB limit"
            exit 1
          fi
          echo "OK: Package size is within the 3MB limit"

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [lint, test, size-check]
    if: startsWith(github.ref, 'refs/tags/wasm-g2p-v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'wasm-g2p-v'))
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: src/wasm/g2p
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          # Empty except on workflow_dispatch, where every job checks out the tag.
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/wasm/g2p/package.json
          registry-url: https://registry.npmjs.org

      # Run the prepublishOnly checks here, with the npm that setup-node
      # installs, and publish with --ignore-scripts below. npm@latest is npm 12,
      # whose `npm pack --json` prints an object keyed by package name instead
      # of an array; a release tag cut before its tests read both shapes would
      # otherwise fail inside `npm publish` and could never be published.
      - name: Install dependencies
        run: npm install

      - name: Type check and test (prepublishOnly)
        run: npm run check:types && npm test

      - name: Upgrade npm for OIDC trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" ]; then
            echo "ERROR: checkout is not at tag ${RELEASE_TAG}"
            exit 1
          fi
          TAG="${RELEASE_TAG#wasm-g2p-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Git tag version: $TAG"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        # OIDC trusted publishing: NODE_AUTH_TOKEN を使わず、GitHub Actions の
        # OIDC token (permissions.id-token: write) で npm Trusted Publisher 設定に
        # 対して認証する。org の 2FA 強制を回避し、token 失効/期限切れも根絶する。
        # 要件: npm >= 11.5.1 (上で upgrade) + npm package 側の Trusted Publisher 登録。
        run: npm publish --provenance --access public --ignore-scripts
