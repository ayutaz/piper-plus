name: Build Piper (Reusable)

on:
  workflow_call:
    inputs:
      os:
        description: 'Operating system to build on'
        required: true
        type: string
      build-type:
        description: 'Build type (Release or Debug)'
        required: false
        type: string
        default: 'Release'
      include-tests:
        description: 'Include test build flags'
        required: false
        type: boolean
        default: false
      artifact-name:
        description: 'Name for the build artifact'
        required: false
        type: string
        default: ''
      cache-key-prefix:
        description: 'Cache key prefix for dependency caching'
        required: false
        type: string
        default: 'piper-deps'
    outputs:
      artifact-name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-name }}
      build-path:
        description: 'Path to the build directory'
        value: ${{ jobs.build.outputs.build-path }}

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    outputs:
      artifact-name: ${{ steps.set-artifact-name.outputs.name }}
      build-path: ${{ steps.set-build-path.outputs.path }}

    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set artifact name
        id: set-artifact-name
        shell: bash
        run: |
          if [ -n "${{ inputs.artifact-name }}" ]; then
            echo "name=${{ inputs.artifact-name }}" >> $GITHUB_OUTPUT
          else
            echo "name=piper-${{ runner.os }}-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set build path
        id: set-build-path
        shell: bash
        run: |
          echo "path=${{ github.workspace }}/build" >> $GITHUB_OUTPUT

      # Cache for Linux dependencies
      - name: Cache Linux dependencies
        if: runner.os == 'Linux'
        uses: actions/cache@v4.3.0
        with:
          path: |
            /usr/local/lib/libonnxruntime*
            /usr/local/include/onnxruntime*
          key: ${{ inputs.cache-key-prefix }}-linux-onnxruntime-1.20.0-v3

      # Cache for macOS dependencies
      - name: Cache macOS dependencies
        if: runner.os == 'macOS'
        uses: actions/cache@v4.3.0
        with:
          path: |
            /usr/local/lib/libonnxruntime*
            /usr/local/include/onnxruntime*
          key: ${{ inputs.cache-key-prefix }}-macos-${{ runner.arch }}-onnxruntime-1.20.0-v3

      # Install dependencies
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential curl wget \
            autoconf automake libtool m4 pkg-config

          # Check if ONNX Runtime is already cached
          if [ ! -f "/usr/local/lib/libonnxruntime.so" ]; then
            echo "Installing ONNX Runtime..."
            wget https://github.com/microsoft/onnxruntime/releases/download/v1.20.0/onnxruntime-linux-x64-1.20.0.tgz
            tar -xzf onnxruntime-linux-x64-1.20.0.tgz
            sudo cp -r onnxruntime-linux-x64-1.20.0/lib/* /usr/local/lib/
            sudo cp -r onnxruntime-linux-x64-1.20.0/include/* /usr/local/include/
            sudo ldconfig
            rm -rf onnxruntime-linux-x64-1.20.0*
          else
            echo "Using cached ONNX Runtime"
            sudo ldconfig
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # Unlink conflicting cmake if exists
          brew unlink cmake || true
          # Install or upgrade cmake from homebrew/core
          brew install --overwrite cmake ninja wget || brew upgrade cmake ninja wget

          # Check if ONNX Runtime is already cached
          if [ ! -f "/usr/local/lib/libonnxruntime.dylib" ]; then
            echo "Installing ONNX Runtime for Apple Silicon..."
            sudo mkdir -p /usr/local/lib /usr/local/include

            # Only support arm64 (Apple Silicon)
            wget https://github.com/microsoft/onnxruntime/releases/download/v1.20.0/onnxruntime-osx-arm64-1.20.0.tgz
            tar -xzf onnxruntime-osx-arm64-1.20.0.tgz
            sudo cp -r onnxruntime-osx-arm64-1.20.0/lib/* /usr/local/lib/
            sudo cp -r onnxruntime-osx-arm64-1.20.0/include/* /usr/local/include/
            rm -rf onnxruntime-osx-arm64-1.20.0*
          else
            echo "Using cached ONNX Runtime"
          fi

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      # Build Piper
      - name: Build piper (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p build
          cd build

          # Set CMAKE flags
          CMAKE_FLAGS="-DCMAKE_BUILD_TYPE=${{ inputs.build-type }}"
          if [ "${{ inputs.include-tests }}" = "true" ]; then
            CMAKE_FLAGS="$CMAKE_FLAGS -DBUILD_TESTS=ON"
          fi

          echo "Building with flags: $CMAKE_FLAGS"

          # Retry cmake configuration up to 3 times with delay for rate limiting
          for i in 1 2 3; do
            if cmake .. $CMAKE_FLAGS; then
              break
            else
              echo "CMake configuration failed (attempt $i/3)"
              if [ $i -lt 3 ]; then
                echo "Waiting 30 seconds before retry..."
                sleep 30
              else
                echo "CMake configuration failed after 3 attempts"
                exit 1
              fi
            fi
          done

          if ! make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu); then
            echo "❌ Build failed"
            exit 1
          fi
          echo "Build succeeded"

          # For test builds, ensure OpenJTalk binary is in expected locations
          if [ "${{ inputs.include-tests }}" = "true" ] && [ -f "oj/bin/open_jtalk" ]; then
            cp oj/bin/open_jtalk ./
            mkdir -p bin && cp oj/bin/open_jtalk bin/
          fi

          # Run tests if enabled
          if [ "${{ inputs.include-tests }}" = "true" ]; then
            echo "Running C++ tests..."
            if [ -f "CTestTestfile.cmake" ] || [ -f "tests/CTestTestfile.cmake" ]; then
              ctest --output-on-failure --verbose || echo "Some tests failed, but continuing..."
            else
              echo "No tests configured, skipping test execution"
            fi
          fi

      - name: Build piper (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          cd build

          # Set CMAKE flags.
          # Do NOT hardcode the VS generator: the windows-latest runner image
          # upgraded its Visual Studio (VS17 -> VS18), which broke a pinned
          # "Visual Studio 17 2022" generator at project(). Let CMake auto-detect
          # the installed VS generator; -A x64 still selects the x64 platform and
          # survives future runner VS bumps.
          $cmakeFlags = @("-A", "x64", "-DCMAKE_BUILD_TYPE=${{ inputs.build-type }}")
          if ("${{ inputs.include-tests }}" -eq "true") {
            $cmakeFlags += "-DBUILD_TESTS=ON"
          }

          Write-Host "Building with flags: $($cmakeFlags -join ' ')"

          # Retry cmake configuration up to 3 times with delay for rate limiting
          $retryCount = 3
          for ($i = 1; $i -le $retryCount; $i++) {
            try {
              cmake .. @cmakeFlags
              break
            }
            catch {
              Write-Host "CMake configuration failed (attempt $i/$retryCount)"
              if ($i -lt $retryCount) {
                Write-Host "Waiting 30 seconds before retry..."
                Start-Sleep -Seconds 30
              }
              else {
                Write-Host "CMake configuration failed after $retryCount attempts"
                exit 1
              }
            }
          }

          # 出力をキャプチャせず stdout/stderr を直接表示する
          # ($var = cmake --build ...) は build ログが見えなくなり、piper-plus.exe が
          # 生成されない原因の特定が困難になる。
          # NOTE: cmake target 名は `piper` のまま (OUTPUT_NAME だけ piper-plus)。
          cmake --build . --config ${{ inputs.build-type }} --parallel 2 --target piper --verbose
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Build failed (cmake --build returned $LASTEXITCODE)"
            exit 1
          }
          Write-Host "Build succeeded"

          # piper-plus.exe が生成されていない場合は build を失敗扱いにする
          # (CMake が exit 0 を返しても target が出力されない構成不良を検出)
          if (-not (Test-Path "Release/piper-plus.exe") -and -not (Test-Path "piper-plus.exe")) {
            Write-Host "❌ piper-plus.exe not found after build; listing build outputs:"
            Get-ChildItem -Recurse -Filter "*.exe" | Select-Object -First 30 | Format-Table FullName
            Get-ChildItem -Recurse -Filter "*.dll" | Select-Object -First 30 | Format-Table FullName
            exit 1
          }

          # Run tests if enabled
          if ("${{ inputs.include-tests }}" -eq "true") {
            Write-Host "Running C++ tests..."
            try {
              ctest -C ${{ inputs.build-type }} --output-on-failure --verbose
            }
            catch {
              Write-Host "Some tests failed, but continuing"
            }
          }

      # Create distribution package
      - name: Create distribution package (Unix)
        if: runner.os != 'Windows'
        # `shell: bash` は `bash --noprofile --norc -eo pipefail {0}` を意味する。
        # 既定 (shell 未指定) は `bash -e` で **pipefail が無い** ため、 下の
        # `echo "<sha>  <file>" | sha256sum -c -` のようなパイプは右端の終了
        # 状態しか見ず、 検証失敗を取りこぼしうる。 同 step 内の他のパイプ
        # (otool | grep | awk 等) も併せて硬化する。
        shell: bash
        run: |
          mkdir -p dist/piper-plus/bin
          mkdir -p dist/piper-plus/lib
          mkdir -p dist/piper-plus/share

          # Copy main binary
          if [ -f "build/piper-plus" ]; then
            cp build/piper-plus dist/piper-plus/bin/
          else
            echo "Warning: piper-plus binary not found at build/piper-plus, checking alternative locations..."
            # Try to find piper-plus binary in other locations
            PIPER_BIN=$(find build -name "piper-plus" -type f -executable 2>/dev/null | head -1)
            if [ -n "$PIPER_BIN" ]; then
              echo "Found piper-plus at: $PIPER_BIN"
              cp "$PIPER_BIN" dist/piper-plus/bin/
            else
              echo "❌ Error: piper-plus binary not found anywhere in build directory"
              echo "Build directory contents:"
              find build -type f -executable 2>/dev/null | head -20 || echo "No executables found"
              exit 1
            fi
          fi

          # Copy espeak-ng data
          if [ -d "build/ei/share/espeak-ng-data" ]; then
            cp -r build/ei/share/espeak-ng-data dist/piper-plus/share/
          elif [ -d "build/p/src/piper_phonemize_external-build/install/share/espeak-ng-data" ]; then
            cp -r build/p/src/piper_phonemize_external-build/install/share/espeak-ng-data dist/piper-plus/share/
          elif [ -d "build/pi/share/espeak-ng-data" ]; then
            cp -r build/pi/share/espeak-ng-data dist/piper-plus/share/
          fi

          # Copy libraries
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Copy main libraries
            find build -name "*.so*" -type f -exec cp {} dist/piper-plus/lib/ \; 2>/dev/null || true
            # Check specific paths
            [ -d "build/pi/lib" ] && cp build/pi/lib/*.so* dist/piper-plus/lib/ 2>/dev/null || true
            [ -d "build/p/src/piper_phonemize_external-build/install/lib" ] && cp build/p/src/piper_phonemize_external-build/install/lib/*.so* dist/piper-plus/lib/ 2>/dev/null || true
            # Copy ONNX Runtime from system install location (installed by build step)
            cp /usr/local/lib/libonnxruntime*.so* dist/piper-plus/lib/ 2>/dev/null || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # Copy main libraries
            find build -name "*.dylib" -type f -exec cp {} dist/piper-plus/lib/ \; 2>/dev/null || true
            # Check specific paths
            [ -d "build/pi/lib" ] && cp build/pi/lib/*.dylib dist/piper-plus/lib/ 2>/dev/null || true
            [ -d "build/p/src/piper_phonemize_external-build/install/lib" ] && cp build/p/src/piper_phonemize_external-build/install/lib/*.dylib dist/piper-plus/lib/ 2>/dev/null || true
            # Copy ONNX Runtime from system install location (installed by build step)
            cp /usr/local/lib/libonnxruntime*.dylib dist/piper-plus/lib/ 2>/dev/null || true
          fi

          # Fix macOS rpath for relocatable distribution
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "Fixing macOS rpath for relocatable distribution..."

            # Fix piper-plus binary rpath
            if [ -f "dist/piper-plus/bin/piper-plus" ]; then
              # Remove all existing rpath entries
              for rpath in $(otool -l dist/piper-plus/bin/piper-plus | grep -A2 'LC_RPATH' | grep 'path ' | awk '{print $2}'); do
                install_name_tool -delete_rpath "$rpath" dist/piper-plus/bin/piper-plus 2>/dev/null || true
              done
              # Add relative rpath
              install_name_tool -add_rpath @executable_path/../lib dist/piper-plus/bin/piper-plus
              echo "Fixed piper-plus binary rpath"
            fi

            # Fix dylib install names to use @rpath
            for dylib in dist/piper-plus/lib/*.dylib; do
              if [ -f "$dylib" ]; then
                basename=$(basename "$dylib")
                install_name_tool -id "@rpath/$basename" "$dylib" 2>/dev/null || true
              fi
            done

            # Verify
            echo "Verification - piper-plus rpath entries:"
            otool -l dist/piper-plus/bin/piper-plus | grep -A2 'LC_RPATH' || echo "No LC_RPATH found"
            echo "Verification - piper-plus linked libraries:"
            otool -L dist/piper-plus/bin/piper-plus
          fi

          # Copy OpenJTalk binary and data
          for oj_path in "build/oj/bin/open_jtalk" "build/open_jtalk" "build/bin/open_jtalk"; do
            if [ -f "$oj_path" ]; then
              cp "$oj_path" dist/piper-plus/bin/
              chmod +x dist/piper-plus/bin/open_jtalk
              break
            fi
          done

          # Copy OpenJTalk phonemizer binary
          for oj_path in "build/oj/bin/open_jtalk_phonemizer" "build/open_jtalk_phonemizer" "build/bin/open_jtalk_phonemizer"; do
            if [ -f "$oj_path" ]; then
              cp "$oj_path" dist/piper-plus/bin/
              chmod +x dist/piper-plus/bin/open_jtalk_phonemizer
              break
            fi
          done

          # Download and install OpenJTalk dictionary.
          #
          # `if curl ...; then` で包んではいけない。 curl が非 0 で終わると
          # (DNS 失敗 / TLS / 接続リセット / タイムアウト) install ブロックごと
          # skip され、 step は緑のまま下の `tar -czf` に到達して **辞書欠落
          # パッケージがそのまま出荷される**。 `--fail` を足しただけで `if` を
          # 残すのはむしろ逆効果で、 404 でも同じ経路に落ちる。
          #
          # 取得元は他 4 ランタイム (openjtalk_dictionary_manager.c:29 /
          # dictionary_manager.rs:36 / DictionaryManager.cs:32 /
          # dict-loader.js) と同じ canonical ミラーに揃え、 同じ sha256 を
          # 検証する。 SourceForge はリクエストごとにランダムミラーへ 302 する
          # ため chronic flake 源で、 かつ HTTP 200 + 空ボディを返した場合
          # bsdtar が 0 バイト .tar.gz を exit 0 で受理してしまう
          # (= checksum が無いと素通りする)。
          #
          # `--retry-all-errors` は付けない。 `-f` と併用すると 404 のような
          # 恒久エラーまで 3 回リトライして「一過性 flake」に偽装する。
          echo "Downloading OpenJTalk dictionary..."
          DICT_URL="https://github.com/r9y9/open_jtalk/releases/download/v1.11.1/open_jtalk_dic_utf_8-1.11.tar.gz"
          DICT_SHA256="fe6ba0e43542cef98339abdffd903e062008ea170b04e7e2a35da805902f382a"
          curl -fsSL --retry 3 --retry-delay 5 -o naist-jdic.tar.gz "$DICT_URL"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${DICT_SHA256}  naist-jdic.tar.gz" | sha256sum -c -
          else
            echo "${DICT_SHA256}  naist-jdic.tar.gz" | shasum -a 256 -c -
          fi
          tar -xzf naist-jdic.tar.gz
          echo "Installing OpenJTalk dictionary..."
          mkdir -p dist/piper-plus/share/open_jtalk/dic
          cp -r open_jtalk_dic_utf_8-1.11/* dist/piper-plus/share/open_jtalk/dic/
          rm -f naist-jdic.tar.gz
          rm -rf open_jtalk_dic_utf_8-1.11

          # Copy phonemizer dictionaries
          # Source of truth: src/rust/piper-plus-g2p/data/ (Issue #387)
          mkdir -p dist/piper-plus/share/piper/dicts
          cp src/rust/piper-plus-g2p/data/cmudict_data.json dist/piper-plus/share/piper/dicts/ 2>/dev/null || true
          cp src/rust/piper-plus-g2p/data/pinyin_single.json dist/piper-plus/share/piper/dicts/ 2>/dev/null || true
          cp src/rust/piper-plus-g2p/data/pinyin_phrases.json dist/piper-plus/share/piper/dicts/ 2>/dev/null || true

          # --- packaged artifact manifest (欠けたら出荷しない) ---
          #
          # 同 step には `|| true` / `2>/dev/null` / else なしの if が 13 箇所
          # あり、 コピー失敗はすべて緑のまま通る。 個別に潰すと壊れやすいので、
          # アーカイブ直前に「入っているべきものが入っているか」を一度だけ
          # 検査する。 判定基準は tools/build-openjtalk-dict-archive.sh:39-43 の
          # 既存慣行 (sys.dic / unk.dic が無ければ stripped とみなして exit) を
          # 踏襲する。
          #
          # espeak-ng-data は **意図的に必須リストへ入れない**。 上の
          # `Copy espeak-ng data` は else なしの if/elif で silent skip するが、
          # C++ CLI は自前の 8 言語 G2P を使っており espeak にリンクしていない
          # (src/cpp の espeak 参照はコメントのみ、 v1.13.0 の実配布バイナリ内の
          # espeak 文字列は 0 件、 同アセットに espeak-ng-data は同梱されて
          # いないが日本語以外も動作している)。 必須にすると実態と乖離して
          # 即座に赤くなる。
          echo "Verifying packaged artifact..."
          missing=0
          for f in \
            bin/piper-plus \
            share/open_jtalk/dic/sys.dic \
            share/open_jtalk/dic/unk.dic \
            share/open_jtalk/dic/char.bin \
            share/open_jtalk/dic/matrix.bin \
            share/piper/dicts/cmudict_data.json \
            share/piper/dicts/pinyin_single.json \
            share/piper/dicts/pinyin_phrases.json
          do
            if [ ! -s "dist/piper-plus/$f" ]; then
              echo "::error::packaged artifact is missing or empty: $f"
              missing=1
            fi
          done
          if ! ls dist/piper-plus/lib/libonnxruntime* >/dev/null 2>&1; then
            echo "::error::packaged artifact has no libonnxruntime in lib/"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Contents of dist/piper-plus:"
            find dist/piper-plus -type f | sort
            exit 1
          fi
          echo "OK all required files present"

          # Create archive
          tar -czf piper-plus-cpp-${{ runner.os }}.tar.gz -C dist piper-plus

          # Create a debug info file
          echo "Distribution package contents:" > dist-contents.txt
          find dist -type f | sort >> dist-contents.txt
          echo "" >> dist-contents.txt
          echo "Build directory OpenJTalk search:" >> dist-contents.txt
          find build -name "open_jtalk" -type f 2>/dev/null | head -10 >> dist-contents.txt || echo "No open_jtalk found in build" >> dist-contents.txt

      - name: Create distribution package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist/piper-plus/bin
          New-Item -ItemType Directory -Force -Path dist/piper-plus/lib
          New-Item -ItemType Directory -Force -Path dist/piper-plus/share

          # Copy main binary
          if (Test-Path "build/${{ inputs.build-type }}/piper-plus.exe") {
            Copy-Item "build/${{ inputs.build-type }}/piper-plus.exe" -Destination dist/piper-plus/bin/
          } elseif (Test-Path "build/piper-plus.exe") {
            Copy-Item "build/piper-plus.exe" -Destination dist/piper-plus/bin/
          } else {
            Write-Host "Warning: piper-plus.exe not found, creating minimal package"
          }

          # Copy required DLLs (exclude test files like .wav)
          Get-ChildItem "build/${{ inputs.build-type }}/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination dist/piper-plus/bin/

          # Copy espeak-ng data
          $espeakPaths = @(
            "build/ei/share/espeak-ng-data",
            "build/p/src/piper_phonemize_external-build/install/share/espeak-ng-data",
            "build/pi/share/espeak-ng-data"
          )
          foreach ($path in $espeakPaths) {
            if (Test-Path $path) {
              Copy-Item $path -Destination dist/piper-plus/share/ -Recurse -Force
              break
            }
          }

          # Copy OpenJTalk executable
          $ojPaths = @(
            "build/oj/bin/open_jtalk.exe",
            "build/open_jtalk.exe",
            "build/bin/open_jtalk.exe",
            "build/${{ inputs.build-type }}/open_jtalk.exe"
          )
          foreach ($path in $ojPaths) {
            if (Test-Path $path) {
              Copy-Item $path -Destination dist/piper-plus/bin/ -Force
              break
            }
          }

          # Copy OpenJTalk phonemizer executable
          $ojPhonemizerPaths = @(
            "build/oj/bin/open_jtalk_phonemizer.exe",
            "build/open_jtalk_phonemizer.exe",
            "build/bin/open_jtalk_phonemizer.exe",
            "build/${{ inputs.build-type }}/open_jtalk_phonemizer.exe"
          )
          foreach ($path in $ojPhonemizerPaths) {
            if (Test-Path $path) {
              Copy-Item $path -Destination dist/piper-plus/bin/ -Force
              break
            }
          }

          # Download and install OpenJTalk dictionary.
          # Unix 側と同じ canonical ミラー + sha256。 旧実装は curl の終了
          # 状態を見ず、 展開に失敗しても `Write-Host "Warning: ..."` で続行
          # していたため、 辞書欠落パッケージがそのまま .zip 化されていた。
          # `curl.exe` / `tar.exe` と明示するのは、 PowerShell では `curl` が
          # `Invoke-WebRequest` の alias になりうるため (5.1 fallback 時)。
          Write-Host "Downloading OpenJTalk dictionary..."
          $DictUrl = "https://github.com/r9y9/open_jtalk/releases/download/v1.11.1/open_jtalk_dic_utf_8-1.11.tar.gz"
          $DictSha256 = "fe6ba0e43542cef98339abdffd903e062008ea170b04e7e2a35da805902f382a"
          & curl.exe -fsSL --retry 3 --retry-delay 5 -o naist-jdic.tar.gz "$DictUrl"
          if ($LASTEXITCODE -ne 0) { throw "OpenJTalk dictionary download failed (curl exit $LASTEXITCODE)" }

          $actual = (Get-FileHash -Algorithm SHA256 naist-jdic.tar.gz).Hash.ToLower()
          if ($actual -ne $DictSha256) {
            throw "OpenJTalk dictionary checksum mismatch: expected $DictSha256, got $actual"
          }

          & tar.exe -xzf naist-jdic.tar.gz
          if ($LASTEXITCODE -ne 0) { throw "OpenJTalk dictionary extraction failed (tar exit $LASTEXITCODE)" }
          if (-not (Test-Path "open_jtalk_dic_utf_8-1.11")) {
            throw "OpenJTalk dictionary extracted but open_jtalk_dic_utf_8-1.11/ is absent"
          }

          Write-Host "Installing OpenJTalk dictionary..."
          New-Item -ItemType Directory -Force -Path dist/piper-plus/share/open_jtalk/dic
          Copy-Item -Path "open_jtalk_dic_utf_8-1.11\*" -Destination "dist/piper-plus/share/open_jtalk/dic/" -Recurse -Force

          # Clean up
          Remove-Item -Force naist-jdic.tar.gz -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force open_jtalk_dic_utf_8-1.11 -ErrorAction SilentlyContinue

          # Copy phonemizer dictionaries
          # Source of truth: src/rust/piper-plus-g2p/data/ (Issue #387)
          New-Item -ItemType Directory -Force -Path dist/piper-plus/share/piper/dicts
          Copy-Item src/rust/piper-plus-g2p/data/cmudict_data.json -Destination dist/piper-plus/share/piper/dicts/ -ErrorAction SilentlyContinue
          Copy-Item src/rust/piper-plus-g2p/data/pinyin_single.json -Destination dist/piper-plus/share/piper/dicts/ -ErrorAction SilentlyContinue
          Copy-Item src/rust/piper-plus-g2p/data/pinyin_phrases.json -Destination dist/piper-plus/share/piper/dicts/ -ErrorAction SilentlyContinue

          # --- packaged artifact manifest (欠けたら出荷しない) ---
          # Unix 側と同じ趣旨。 Windows は ORT を lib/ ではなく bin/ に置く
          # (v1.13.0 の piper-windows-x64.zip で確認: bin/onnxruntime.dll)。
          # espeak-ng-data は Unix 側と同じ理由で必須リストに入れない。
          Write-Host "Verifying packaged artifact..."
          $missing = $false
          $required = @(
            "bin/piper-plus.exe",
            "share/open_jtalk/dic/sys.dic",
            "share/open_jtalk/dic/unk.dic",
            "share/open_jtalk/dic/char.bin",
            "share/open_jtalk/dic/matrix.bin",
            "share/piper/dicts/cmudict_data.json",
            "share/piper/dicts/pinyin_single.json",
            "share/piper/dicts/pinyin_phrases.json"
          )
          foreach ($f in $required) {
            $p = Join-Path "dist/piper-plus" $f
            if (-not (Test-Path $p) -or ((Get-Item $p).Length -eq 0)) {
              Write-Host "::error::packaged artifact is missing or empty: $f"
              $missing = $true
            }
          }
          if (-not (Get-ChildItem "dist/piper-plus/bin/onnxruntime*.dll" -ErrorAction SilentlyContinue)) {
            Write-Host "::error::packaged artifact has no onnxruntime DLL in bin/"
            $missing = $true
          }
          if ($missing) {
            Write-Host "Contents of dist/piper-plus:"
            Get-ChildItem -Path dist/piper-plus -Recurse -File | Select-Object -ExpandProperty FullName | Sort-Object
            throw "packaged artifact is incomplete"
          }
          Write-Host "OK all required files present"

          # Create archive
          Compress-Archive -Path dist/piper-plus -DestinationPath piper-plus-cpp-${{ runner.os }}.zip

          # Create a debug info file
          "Distribution package contents:" | Out-File -FilePath dist-contents.txt
          Get-ChildItem -Path dist -Recurse | Select-Object FullName | Sort-Object FullName | Out-File -FilePath dist-contents.txt -Append
          "" | Out-File -FilePath dist-contents.txt -Append
          "Build directory OpenJTalk search:" | Out-File -FilePath dist-contents.txt -Append
          Get-ChildItem -Path build -Filter "open_jtalk.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 10 | Select-Object FullName | Out-File -FilePath dist-contents.txt -Append

      # Upload artifacts
      - name: Upload build artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ steps.set-artifact-name.outputs.name }}
          path: |
            piper-plus-cpp-${{ runner.os }}.tar.gz
            piper-plus-cpp-${{ runner.os }}.zip
            dist-contents.txt
          retention-days: 1

      # Upload build logs on failure
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: build-logs-${{ runner.os }}-${{ github.sha }}
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          retention-days: 7
