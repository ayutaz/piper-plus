name: clang-tidy

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/cpp/**'
      - '.clang-tidy'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/clang-tidy.yml'
  push:
    branches: [dev, main]
    paths:
      - 'src/cpp/**'
      - '.clang-tidy'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install clang-tidy + dependencies
        run: |
          sudo apt-get update
          # Note: libonnxruntime-dev は Ubuntu apt にないため除外
          # (CMake ExternalProject で fetch される。clang-tidy は header-only の
          # static analysis なので ORT 実体は不要、include path のみあれば動く)
          sudo apt-get install -y clang-tidy-18 cmake ninja-build \
            libsndfile1-dev libfmt-dev libspdlog-dev
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100

      - name: Configure CMake (compile_commands.json)
        run: |
          mkdir -p build-tidy
          cd build-tidy
          # ORT external project は heavy なので skip して compile_commands だけ生成
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=OFF \
            -DPIPER_BUILD_LIBRARY=OFF \
            -DPIPER_BUILD_CLI=OFF

      - name: Run clang-tidy on changed files (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The checkout is shallow, so `origin/<base>..HEAD` did not resolve
          # and `|| true` turned that into "No C++ files changed" on every PR.
          # Fetch the base commit and diff the two trees directly.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD -- 'src/cpp/*.cpp' 'src/cpp/*.c' 'src/cpp/*.hpp' 'src/cpp/*.h')
          if [ -z "$CHANGED_FILES" ]; then
            echo "No C++ files changed in PR"
            exit 0
          fi
          echo "Files to check:"
          echo "$CHANGED_FILES"
          # Check every file, then fail if any of them failed. Failures are
          # still ignored by continue-on-error (tracked in
          # docs/spec/continue-on-error-allowlist.toml) until the backlog is fixed.
          status=0
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              clang-tidy -p build-tidy "$file" --use-color=true || status=1
            fi
          done
          exit "$status"
        continue-on-error: true

      - name: Run clang-tidy on all files (push to dev/main)
        if: github.event_name == 'push'
        run: |
          set -o pipefail
          # Full scan, but parallelize for speed. The step fails when
          # clang-tidy does; continue-on-error (tracked in
          # docs/spec/continue-on-error-allowlist.toml) still ignores it.
          find src/cpp -name '*.cpp' -o -name '*.c' | head -50 | \
            xargs -I {} -P 4 clang-tidy -p build-tidy {} --use-color=true 2>&1 | tee tidy-output.txt
        continue-on-error: true

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: clang-tidy-report
          path: tidy-output.txt
          retention-days: 7
        continue-on-error: true
