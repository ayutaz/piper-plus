name: npm publish

on:
  push:
    tags:
      - 'npm-v*'

# Serialise tag publishes — re-tagging the same npm-v* should not race
# the in-flight publish run (npm rejects duplicate version uploads but
# the dist-tags update window is small).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.x'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/wasm/openjtalk-web

    steps:
      - uses: actions/checkout@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/npm-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Git tag version: $TAG"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Run npm package tests
        run: npm run test:npm-package:all

      - name: Test real ONNX input contracts
        run: npm run test:onnx-inputs

  wasm-build:
    uses: ./.github/workflows/build-wasm-reusable.yml

  publish:
    needs: [validate, wasm-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: src/wasm/openjtalk-web

    steps:
      - uses: actions/checkout@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing (>= 11.5.1)
        # setup-node が入れる npm は OIDC trusted publishing に対応した
        # 11.5.1 より古いことがある。g2p-wasm-ci.yml と同じ手当て。
        run: npm install -g npm@latest

      - name: Install locked verification dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Cache pinned public models
        uses: actions/cache@v4.3.0
        with:
          path: src/wasm/openjtalk-web/test/browser/models
          key: browser-tts-models-${{ hashFiles('src/wasm/openjtalk-web/test/browser/models.json') }}

      - name: Download WASM artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: piper-plus-wasm
          path: src/wasm/openjtalk-web/dist/rust-wasm/

      - name: Verify WASM output
        run: |
          # Check the file `exports` actually resolves to, not just the binary.
          test -f dist/rust-wasm/piper_plus_wasm.js
          test -f dist/rust-wasm/piper_plus_wasm_bg.wasm

      - name: Verify every exports target is in the tarball
        # Guards the failure mode that shipped `./wasm/ja` with 0 files for
        # four releases: a declaration can be present everywhere while the
        # tarball is empty. This is the only check that opens the tarball.
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check_npm_exports_shipped.py

      - name: Pack tarball for attestation
        # Pack first so attestation covers the exact bytes that get uploaded.
        # `npm publish <tarball>` below republishes the same file rather than
        # repacking, which guarantees attest-build-provenance and the npm
        # provenance flag refer to identical content.
        run: npm pack

      - name: Verify exact tarball in a clean consumer with real browser synthesis
        run: npm run test:distribution -- *.tgz

      - name: Upload distribution verification results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: npm-distribution-verification
          path: |
            src/wasm/openjtalk-web/test-results
            src/wasm/openjtalk-web/playwright-report
          if-no-files-found: warn

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v3.2.0
        with:
          subject-path: 'src/wasm/openjtalk-web/*.tgz'

      - name: Publish to npm
        # Publishes the already-packed tarball with both SLSA-provenance
        # (GitHub artifact attestation, attached above) and npm-provenance
        # (sigstore via --provenance, attached by the registry).
        #
        # OIDC trusted publishing: NODE_AUTH_TOKEN は設定しない。npm は
        # トークンが存在するとそちらを優先し、org の 2FA 強制下では OTP を
        # 要求して EOTP で失敗する (npm-v0.7.0 の初回 publish が実際にこれで
        # 落ちた)。permissions.id-token: write の OIDC token で npm 側の
        # Trusted Publisher 設定に対して認証する。g2p-wasm-ci.yml と同じ構成。
        run: npm publish *.tgz --provenance --access public
