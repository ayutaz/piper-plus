name: Build WASM (Reusable)

# 3 variant (multilingual / ja-only / ja-lite) を matrix 並列ビルドする
# reusable workflow。以前は単一 job 内で 3 variant を順次ビルドしていたため、
# wasm-pack の cargo build (~5 分/variant) が直列に蓄積し合計 ~15 分掛かって
# いた。matrix 化により 3 runner で同時実行され、最遅 variant の時間 (~5 分)
# が実質的な所要時間になる。
#
# Caller (wasm-build.yml / npm-publish.yml) は変更不要 — `uses:
# ./.github/workflows/build-wasm-reusable.yml` だけ呼んでおり、artifact
# 名 (piper-plus-wasm / piper-plus-wasm-ja / piper-plus-wasm-ja-lite) も
# 変えていない。以前あった ``outputs.wasm-size*`` は参照箇所が存在しな
# かったため matrix 化に合わせて削除した (matrix job の output は仕様上
# 1 値しか返せず、3 variant の集約に手間がかかる割に未使用)。

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: multilingual
            features: '--features multilingual'
            dist_subdir: rust-wasm
            artifact: piper-plus-wasm
          - name: ja-only
            features: '--features ja'
            dist_subdir: rust-wasm-ja
            artifact: piper-plus-wasm-ja
          - name: ja-lite
            # `--no-default-features` は wasm-pack が直接受け付けないため
            # `--` 以降で cargo build に転送する (wasm-pack CLI 仕様)。
            # 従前は wasm-pack が透過的に処理していたが 2026-07 リリース
            # で挙動が変わり ja-lite variant のみ回帰したため明示化する。
            features: '-- --no-default-features --features ja-external'
            dist_subdir: rust-wasm-ja-lite
            artifact: piper-plus-wasm-ja-lite
          # 辞書を同梱せず 8 言語すべてを有効にする variant。 辞書が要るのは
          # ja と zh だけで、 ko/es/fr/pt/sv は規則ベースのため辞書不要
          # (piper-wasm/Cargo.toml の feature 定義)。 rust-tests.yml では
          # wasm-pack test で既に検証しているが、 配布 artifact としては
          # 一度もビルドされていなかった。
          #
          # npm の exports にはまだ追加しない。 ja の外部辞書 blob が未公開の
          # ため、 今 subpath を生やすと「宣言はあるが日本語が passthrough に
          # 落ちる」という、 この PR が ./wasm/ja で直した欠陥を再生産する。
          # まず artifact とサイズ実測を得て、 辞書配布が整ってから出荷する。
          - name: multilingual-external
            features: '-- --no-default-features --features multilingual-external'
            dist_subdir: rust-wasm-multilingual-external
            artifact: piper-plus-wasm-multilingual-external
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust -> target
          # variant 別に cache を分けることで feature combination の
          # incremental build が cross-pollination で壊れるのを防ぐ
          # (以前の単一 job では順次ビルドで cargo target が共有され
          # た副作用で再ビルドが発生していた)。
          key: wasm-${{ matrix.name }}

      - name: Install wasm-pack
        # prebuilt binary を取得 (cargo install wasm-pack --locked は
        # ~5 分かかる)。wasm-build.yml の wasm-test job と同じ pin。
        #
        # version: 'latest' は 2026-07-10 に jetli/wasm-pack-action@v0.4.0 の
        # resolver が v0.15.0 → v0.9.1 (2020 release) を返す regression が
        # 発生。 v0.9.1 は Cargo workspace inheritance (license.workspace = true
        # 等) を parse できず "invalid type: map, expected a string" で fail する。
        # 明示的に最新 stable の v0.15.0 に pin して安定化。
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'

      - name: Build WASM (${{ matrix.name }})
        working-directory: src/rust/piper-wasm
        run: |
          wasm-pack build --target web --release ${{ matrix.features }}
          # wasm-pack writes a `.gitignore` containing `*` into pkg/. Moving it
          # into dist/ silently nullifies the `dist/rust-wasm/**` entry in
          # package.json `files` -- npm packs 0 files from the directory and
          # prints no warning. Releases only work today because
          # actions/upload-artifact drops hidden files by default, which is an
          # undocumented accident. Delete it here so the tarball never depends
          # on that behaviour (scripts/check_npm_exports_shipped.py guards it).
          rm -f pkg/.gitignore
          rm -rf ../../wasm/openjtalk-web/dist/${{ matrix.dist_subdir }}
          mv pkg ../../wasm/openjtalk-web/dist/${{ matrix.dist_subdir }}

      - name: Verify output
        run: |
          # Check the file `exports` actually resolves to, not just the binary.
          test -f src/wasm/openjtalk-web/dist/${{ matrix.dist_subdir }}/piper_plus_wasm.js
          test -f src/wasm/openjtalk-web/dist/${{ matrix.dist_subdir }}/piper_plus_wasm_bg.wasm
          test ! -e src/wasm/openjtalk-web/dist/${{ matrix.dist_subdir }}/.gitignore

      - name: Report size
        run: |
          SIZE=$(stat -c%s src/wasm/openjtalk-web/dist/${{ matrix.dist_subdir }}/piper_plus_wasm_bg.wasm)
          echo "WASM ${{ matrix.name }} size: $SIZE bytes ($(( SIZE / 1048576 )) MB)"

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: src/wasm/openjtalk-web/dist/${{ matrix.dist_subdir }}/
          retention-days: 7
