name: link-check

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.lychee.toml'
      - '.github/workflows/link-check.yml'
  push:
    branches: [dev, main]
    paths:
      - '**/*.md'
      - '.lychee.toml'
      - '.github/workflows/link-check.yml'
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC — catch link rot
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # for posting summary on schedule

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Restore lychee cache
        id: lychee-cache
        uses: actions/cache@v4.3.0
        continue-on-error: true
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - uses: lycheeverse/lychee-action@v2
        id: link-scan
        with:
          # --base は URL or absolute path 必須。relative '.' は invalid。
          # root-relative link の解決は --root-dir で行う。
          args: >-
            --config .lychee.toml
            --no-progress
            --root-dir ${{ github.workspace }}
            './**/*.md'
          # The final retry step retains the strict gate. v0.24.2 does not
          # retry ErrorKind::RejectedStatusCode(5xx) through max_retries.
          lycheeVersion: v0.24.2
          fail: false
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Retry failed full scans with lower concurrency
        if: steps.link-scan.outputs.exit_code != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Recheck every link; do not reuse cached errors or accept 5xx.
          # A permanent broken link fails all attempts and still blocks CI.
          for delay in 5 15; do
            sleep "$delay"
            if lychee --config .lychee.toml --no-progress --cache=false \
              --max-concurrency 1 --root-dir "$GITHUB_WORKSPACE" \
              --format markdown --output lychee/retry.md './**/*.md'; then
              cat lychee/retry.md >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          cat lychee/retry.md >> "$GITHUB_STEP_SUMMARY"
          exit 1
