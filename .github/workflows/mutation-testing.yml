name: mutation-testing

# -----------------------------------------------------------------------------
# Mutation testing (manual + weekly cron)
# -----------------------------------------------------------------------------
# - Too slow for every push (the slowest target takes over an hour), so it
#   runs weekly and on demand.
# - Targets, the tests run against each one and the `break` scores live in
#   docs/spec/mutation-testing.toml; the `plan` job turns that file into
#   the job matrices, and every job fails when its score is below `break`
#   (scripts/check_mutation_score.py).
# - Reports (HTML / JSON) are kept as artifacts for 30 days.
# - Details: docs/reference/mutation-testing.md
#
# Until 2026-10 every job was continue-on-error and none of them had ever
# measured anything: mutmut was unpinned and its Cython build step failed,
# cargo-mutants found 0 mutants (wrong --file paths), and Stryker rejected
# its config (`_comment` keys; `-c` means --concurrency in Stryker 5).
# -----------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: "対象 runtime ('all' でフル実行)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - python
          - rust
          - csharp
  # Weekly: 毎週日曜 00:00 UTC (= 月曜 09:00 JST)
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan (docs/spec/mutation-testing.toml)
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.matrix.outputs.python }}
      rust: ${{ steps.matrix.outputs.rust }}
      csharp: ${{ steps.matrix.outputs.csharp }}
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Build matrices
        id: matrix
        run: |
          for runtime in python rust csharp; do
            echo "${runtime}=$(python3 scripts/check_mutation_score.py matrix "$runtime")" >> "$GITHUB_OUTPUT"
          done

  python:
    name: Python (mutmut) / ${{ matrix.module }}
    needs: plan
    if: github.event_name == 'schedule' || github.event.inputs.runtime == 'all' || github.event.inputs.runtime == 'python'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.python) }}
    env:
      TARGET: ${{ matrix.target }}
      TESTS: ${{ join(matrix.tests, ' ') }}

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Install project + mutmut
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/mut-venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/mut-venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/mut-venv/bin" >> "$GITHUB_PATH"
          VIRTUAL_ENV="$RUNNER_TEMP/mut-venv" uv pip install \
            -e "src/python/g2p[all]" -e "src/python_run[test,cpu,http]" 'mutmut==2.5.1'

      - name: Run the target's tests once (unmutated)
        run: |
          # shellcheck disable=SC2086  # TESTS holds several paths
          python -m pytest $TESTS -q -p no:cacheprovider --override-ini=addopts=

      - name: Run mutmut
        run: |
          set +e
          mutmut run \
            --paths-to-mutate "$TARGET" \
            --runner "python -m pytest $TESTS -x -q -p no:cacheprovider --override-ini=addopts= -p no:randomly" \
            --no-progress
          rc=$?
          set -e
          # The exit code is a bit mask: 1 = mutmut itself failed; 2 / 4 / 8
          # = some mutants survived / timed out / were suspicious, which the
          # score check below judges.
          if [ $(( rc & 1 )) -ne 0 ]; then
            echo "::error::mutmut failed (exit code $rc)"
            exit 1
          fi

      - name: Check score against break
        run: python scripts/check_mutation_score.py score python "${{ matrix.module }}" .mutmut-cache

      - name: Write reports
        if: always()
        run: |
          mutmut results || true
          mutmut junitxml > mutmut-junit.xml || true
          mutmut html || true

      - name: Upload mutmut report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mutation-report-python-${{ matrix.module }}
          path: |
            html/
            mutmut-junit.xml
            .mutmut-cache
          retention-days: 30
          if-no-files-found: warn

  rust:
    name: Rust (cargo-mutants) / ${{ matrix.module }}
    needs: plan
    if: github.event_name == 'schedule' || github.event.inputs.runtime == 'all' || github.event.inputs.runtime == 'rust'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rust) }}

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust -> target

      - name: Install ALSA dev (rodio feature 用)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants@27.1.0

      - name: Run cargo-mutants
        working-directory: src/rust
        env:
          PACKAGE: ${{ matrix.package }}
          FILE: ${{ matrix.file }}
          CARGO_TEST_ARGS: ${{ matrix.cargo_test_args }}
        # --in-place: the crates read data with include_str! paths outside
        # the crate, which a copied tree does not have.
        # Exit code 2 / 3 = some mutants were missed / timed out, which the
        # score check below judges; anything else is a failure of the run.
        run: |
          set +e
          # shellcheck disable=SC2086  # CARGO_TEST_ARGS holds several arguments
          cargo mutants -p "$PACKAGE" --file "$FILE" --no-shuffle --in-place --timeout 60 \
            -- $CARGO_TEST_ARGS
          rc=$?
          set -e
          case "$rc" in
            0|2|3) ;;
            *) echo "::error::cargo-mutants failed (exit code $rc)"; exit 1 ;;
          esac

      - name: Check score against break
        run: python3 scripts/check_mutation_score.py score rust "${{ matrix.module }}" src/rust/mutants.out/outcomes.json

      - name: Upload cargo-mutants report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mutation-report-rust-${{ matrix.module }}
          path: src/rust/mutants.out/
          retention-days: 30
          if-no-files-found: warn

  csharp:
    name: C# (Stryker.NET) / ${{ matrix.module }}
    needs: plan
    if: github.event_name == 'schedule' || github.event.inputs.runtime == 'all' || github.event.inputs.runtime == 'csharp'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.csharp) }}

    steps:
      - uses: actions/checkout@v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4.3.0
        continue-on-error: true
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-stryker-${{ hashFiles('src/csharp/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-stryker-
            ${{ runner.os }}-nuget-

      - name: Install Stryker.NET
        run: |
          dotnet tool install --global dotnet-stryker --version 5.0.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Run Stryker.NET
        # `--config-file`: in Stryker 5, `-c` is --concurrency.
        # The config's thresholds.break equals the spec's `break`, so
        # Stryker itself fails below it; the score check repeats it from the
        # JSON report so all three runtimes are judged the same way.
        run: dotnet stryker --config-file "$GITHUB_WORKSPACE/${{ matrix.config }}"
        working-directory: src/csharp

      - name: Check score against break
        if: ${{ !cancelled() }}
        run: |
          report=$(find src/csharp/StrykerOutput -name mutation-report.json -path '*/reports/*' | sort | tail -n 1)
          if [ -z "$report" ]; then
            echo "::error::Stryker wrote no mutation-report.json"
            exit 1
          fi
          python3 scripts/check_mutation_score.py score csharp "${{ matrix.module }}" "$report"

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mutation-report-csharp-${{ matrix.module }}
          path: src/csharp/StrykerOutput/
          retention-days: 30
          if-no-files-found: warn
