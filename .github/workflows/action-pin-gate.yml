name: "Action Pin Safety Gate"

# Verifies that no new sliding-major-tag references (e.g. `@v3`, `@v4`)
# appear in .github/workflows/*.{yml,yaml} or .github/actions/**/action.yml
# outside of the grandfathered baseline.
#
# Rationale: PR #414 had cosign-installer@v4 deleted upstream, crashing
# 7 CI jobs. Memory entry `feedback_pin_actions_sha.md` records the rule:
# pin actions by full SemVer (@v1.2.3) or 40-hex SHA, never by sliding
# `@v<major>` alone. The codebase has grandfathered uses; this gate
# uses a baseline file (scripts/action_pins_baseline.txt) to allow them
# while blocking any *new* sliding-tag reference.

on:
  push:
    branches: [dev, main]
    paths:
      - '.github/workflows/**.yml'
      - '.github/workflows/**.yaml'
      - '.github/actions/**'
      - 'scripts/check_action_pins.py'
      - 'scripts/action_pins_baseline.txt'
      - 'tests/scripts/test_check_action_pins.py'
  pull_request:
    paths:
      - '.github/workflows/**.yml'
      - '.github/workflows/**.yaml'
      - '.github/actions/**'
      - 'scripts/check_action_pins.py'
      - 'scripts/action_pins_baseline.txt'
      - 'tests/scripts/test_check_action_pins.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  action-pin-safety:
    name: No new sliding-major-tag refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Detection contract (test_check_action_pins.py)
        # The gate's USES_RE used to match only the plain `uses:` form, so the
        # list form `- uses:` — 52% of all uses: lines here — went unchecked
        # and the gate reported OK while 38 sliding-major refs sat in 17
        # workflows. Run the unit tests so a future regex tweak cannot
        # re-open that blind spot without CI noticing.
        # Override pytest.ini's addopts (which include --cov flags requiring
        # pytest-cov) so this gate stays self-contained; tests/scripts/ is not
        # in pytest.ini testpaths, so nothing else in CI runs this file.
        run: pytest tests/scripts/test_check_action_pins.py -v --override-ini="addopts="

      - name: Run action pin gate
        run: python scripts/check_action_pins.py
