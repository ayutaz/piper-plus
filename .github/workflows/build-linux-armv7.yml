name: Linux ARMv7 release verification

on:
  workflow_call:
    inputs:
      release_upload_url:
        required: false
        type: string
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-linux-armv7.yml'
      - '.github/workflows/dev-build-all.yml'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'src/cpp/**'
      - 'scripts/build_ort_armv7.sh'
      - 'scripts/fix_config_pua.py'
      - 'src/python/g2p/piper_plus_g2p/data/pua.json'
      - 'src/wasm/openjtalk-web/test/browser/models.json'
      - 'tests/scripts/test_armv7_release.py'

permissions:
  contents: read

jobs:
  build:
    name: Build Linux ARMv7
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          submodules: true

      - name: Cache pinned ARMv7 ONNX Runtime SDK
        id: sdk-cache
        uses: actions/cache@v4.3.0
        with:
          path: ort-armv7
          key: ort-armv7-${{ runner.os }}-${{ hashFiles('scripts/build_ort_armv7.sh', 'cmake/linux-armv7-toolchain.cmake', 'cmake/OnnxRuntime.cmake') }}

      - name: Build pinned ARMv7 ONNX Runtime
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf ninja-build
          bash scripts/build_ort_armv7.sh ort-armv7

      - name: Fetch pinned synthesis model
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          from urllib.request import urlopen
          models = json.loads(Path('src/wasm/openjtalk-web/test/browser/models.json').read_text())
          model = next(m for m in models if m['key'] == 'tsukuyomi')
          target = Path('armv7-smoke')
          target.mkdir(exist_ok=True)
          base = f"https://huggingface.co/{model['repo']}/resolve/{model['revision']}/"
          for remote, local, digest in [
              (model['onnx'], 'model.onnx', model['onnxSha256']),
              (model['onnx'] + '.json', 'model.onnx.json', model['configSha256']),
          ]:
              with urlopen(base + remote, timeout=180) as response:
                  data = response.read()
              assert hashlib.sha256(data).hexdigest() == digest, remote
              (target / local).write_bytes(data)

      - name: Normalize native phoneme config
        run: python scripts/fix_config_pua.py armv7-smoke/model.onnx.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0
        with:
          platforms: arm

      - name: Build in Docker
        run: |
          docker pull --platform linux/arm/v7 debian:trixie
          docker run --rm --platform linux/arm/v7 \
            -v "$(pwd)":/workspace -w /workspace debian:trixie \
            bash -euo pipefail -c '
              apt-get update
              apt-get install -y build-essential cmake git pkg-config \
                libicu-dev libespeak-ng-dev ninja-build ccache
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -GNinja \
                -DONNXRUNTIME_DIR=/workspace/ort-armv7
              cmake --build build --parallel 1
              cmake --install build --config Release --prefix dist/piper-plus
              export LD_LIBRARY_PATH=/workspace/dist/piper-plus/lib
              dist/piper-plus/bin/piper-plus --version
              printf "%s\n" "こんにちは。音声の動作確認です。" | \
                dist/piper-plus/bin/piper-plus --model armv7-smoke/model.onnx \
                --config armv7-smoke/model.onnx.json --output_file armv7-smoke/output.wav
              test -s armv7-smoke/output.wav
              if [ -d /usr/share/espeak-ng-data ]; then
                cp -r /usr/share/espeak-ng-data dist/piper-plus/share/
              fi
              cd dist
              tar czf piper-plus-cpp-linux-armv7.tar.gz piper-plus/
            '

      - name: Verify actual synthesized waveform
        shell: python
        run: |
          import array
          import wave
          with wave.open('armv7-smoke/output.wav', 'rb') as wav:
              assert wav.getframerate() == 22050
              assert wav.getsampwidth() == 2
              assert wav.getnframes() > wav.getframerate()
              samples = array.array('h', wav.readframes(wav.getnframes()))
              assert any(samples), 'Silent waveform'

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: piper-plus-cpp-linux-armv7
          path: dist/piper-plus-cpp-linux-armv7.tar.gz
          if-no-files-found: error

      - name: Upload to release
        if: inputs.release_upload_url != '' && inputs.release_upload_url != null
        uses: ./.github/actions/retry-upload
        with:
          upload_url: ${{ inputs.release_upload_url }}
          asset_path: dist/piper-plus-cpp-linux-armv7.tar.gz
          asset_name: piper-plus-cpp-linux-armv7.tar.gz
