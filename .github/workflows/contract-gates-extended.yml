# Extended contract gates
# =========================
# Six contract specs that previously lacked an automated drift gate. Each
# of the [[providers]] / [[runtimes]] / file references in the spec files
# is now checked at PR time so a silent file rename / table deletion / key
# mismatch is caught before merge.
#
# Why a dedicated workflow?  The existing model-quality-gate steps (lint-gates.yml) are
# scoped to ONNX-export-side artefacts (model files, phoneme set, ORT
# versions). The six contracts gated here cover orthogonal axes (audio
# format, EP matrix, streaming API surface, Swift FFI, Portuguese
# dialect, speaker encoder). Keeping them in their own workflow makes the
# step list readable and lets reviewers identify which contract drifted
# without reading the whole quality-gate log.
#
# One job per OS runs every contract as its own step. Each check takes a
# second or two, so a job per (contract, OS) pair spent most of its time on
# checkout and Python setup and took 30 runner slots per push. Every step
# runs even when an earlier one fails (`!cancelled()`), and the step name
# names the contract that drifted.
#
# Source-of-truth contract: docs/spec/<name>-contract.{toml,md}
# Check script:             scripts/check_<name>_contract.py
#
# `label-refs` is the one entry whose source-of-truth is not under docs/spec:
# it verifies that every GitHub label named by dependabot.yml / a workflow /
# first_pr_fast_lane.py is declared in `.github/labels.yml`. Same shape as the
# others (offline, stdlib-only, 3 OSes), different catalogue location.

name: Extended contract gates

on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/spec/audio-format-contract.toml'
      - 'docs/spec/ort-provider-contract.toml'
      - 'docs/spec/streaming-api-contract.toml'
      - 'docs/spec/swift-g2p-contract.toml'
      - 'docs/spec/pt-dialect-contract.toml'
      - 'docs/spec/model-sha256-manifest.toml'
      - 'docs/spec/artifact-retention-contract.toml'
      - 'docs/spec/test-flake-retry-contract.toml'
      - 'tests/fixtures/g2p/pt_dialect_parity.json'
      - 'docs/reference/speaker-encoder-contract.md'
      - 'docs/spec/pua-contract.toml'  # cross-referenced by swift-g2p
      - 'src/python/g2p/piper_plus_g2p/data/pua.json'
      - 'test/fixtures/speaker_encoder_golden.json'
      - 'scripts/check_audio_format_contract.py'
      - 'scripts/check_ort_provider_contract.py'
      - 'scripts/check_streaming_api_contract.py'
      - 'scripts/check_swift_g2p_contract.py'
      - 'scripts/check_pt_dialect_contract.py'
      - 'scripts/check_speaker_encoder_contract.py'
      - 'scripts/check_model_sha256_manifest.py'
      - 'scripts/check_artifact_retention.py'
      - 'scripts/check_test_flake_retry.py'
      - 'scripts/check_label_references.py'
      - '.github/labels.yml'  # label-refs: label カタログ (source-of-truth)
      - '.github/dependabot.yml'  # label-refs: 11 ecosystem の labels:
      - 'scripts/first_pr_fast_lane.py'  # label-refs: PROMOTE_LABEL
      - '.github/workflows/*.yml'  # artifact-retention scans every workflow
      - 'src/python_run/pyproject.toml'  # test-flake-retry: pytest-rerunfailures dep
      - '.github/workflows/python-tests.yml'  # test-flake-retry: --reruns flag
      - '.github/workflows/contract-gates-extended.yml'
      # Files the check scripts read. They went unlisted while the script
      # name was built in a `case` statement, which check_trigger_coverage.py
      # could not see through.
      # audio-format: runtime sources that name the output sample format
      - 'src/python_run/piper_plus/voice.py'
      - 'src/python_run/piper_plus/http_server.py'
      - 'src/rust/piper-core/src/engine.rs'
      - 'src/go/piperplus/synthesize.go'
      - 'src/csharp/PiperPlus.Core/Inference/PiperSession.cs'
      - 'src/wasm/openjtalk-web/src/index.js'
      # swift-g2p / model-sha256-manifest: helpers the checks import
      - 'scripts/check_pua_consistency.py'
      - 'scripts/verify_model_checksums.py'
      # pt-dialect: the parity test the contract names
      - 'src/python_run/tests/test_pt_dialect_parity.py'
      # speaker-encoder: golden generator and per-runtime golden / e2e tests
      - 'test/generate_speaker_encoder_golden.py'
      - 'test/test_speaker_encoder_e2e.py'
      - 'src/cpp/tests/test_speaker_encoder_e2e.cpp'
      - 'src/cpp/tests/test_speaker_encoder_golden.cpp'
      - 'src/csharp/PiperPlus.Core.Tests/SpeakerEncoderE2ETests.cs'
      - 'src/csharp/PiperPlus.Core.Tests/SpeakerEncoderTests.cs'
      - 'src/go/piperplus/speaker_encoder_e2e_test.go'
      - 'src/go/piperplus/speaker_encoder_test.go'
      - 'src/rust/piper-core/tests/test_speaker_encoder_e2e.rs'
      - 'src/rust/piper-core/tests/test_speaker_encoder_golden.rs'
      - 'src/wasm/openjtalk-web/test/js/test-speaker-encoder-e2e.js'
      - 'src/wasm/openjtalk-web/test/js/test-speaker-encoder-golden.js'
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-checks:
    name: contract-checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Run on all three OSes. Contract-gate scripts had Windows-only
        # failures (non-UTF-8 console encoding, path separators) that an
        # ubuntu-only matrix never caught — see the QA CI-coverage gap.
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # bash on all three OSes (windows-latest ships Git Bash), as before.
        shell: bash
    steps:
      - uses: actions/checkout@v6.1.0

      # tomllib is in the stdlib from Python 3.11; pin to 3.13 to match
      # the other contract gates (e.g. zh-en-loanword-sync.yml).
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: audio-format
        if: ${{ !cancelled() }}
        run: python scripts/check_audio_format_contract.py

      - name: ort-provider
        if: ${{ !cancelled() }}
        run: python scripts/check_ort_provider_contract.py

      - name: streaming-api
        if: ${{ !cancelled() }}
        run: python scripts/check_streaming_api_contract.py

      - name: swift-g2p
        if: ${{ !cancelled() }}
        run: python scripts/check_swift_g2p_contract.py

      - name: pt-dialect
        if: ${{ !cancelled() }}
        run: python scripts/check_pt_dialect_contract.py

      - name: speaker-encoder
        if: ${{ !cancelled() }}
        run: python scripts/check_speaker_encoder_contract.py

      - name: model-sha256-manifest
        if: ${{ !cancelled() }}
        run: python scripts/check_model_sha256_manifest.py

      - name: artifact-retention
        if: ${{ !cancelled() }}
        run: python scripts/check_artifact_retention.py

      - name: test-flake-retry
        if: ${{ !cancelled() }}
        run: python scripts/check_test_flake_retry.py

      - name: label-refs
        if: ${{ !cancelled() }}
        run: python scripts/check_label_references.py
