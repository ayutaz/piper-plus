name: Release Rust patch

on:
  workflow_dispatch:
    inputs:
      version:
        description: '準備済みRustタグのバージョン（例: 0.5.2）。同じタグを選んで実行してください'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
      - name: Validate immutable Rust tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/rust-v${RELEASE_VERSION}"
          test "$(git rev-parse "refs/tags/rust-v${RELEASE_VERSION}^{commit}")" = "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          data = tomllib.loads(Path('src/rust/Cargo.toml').read_text())
          assert data['workspace']['package']['version'] == os.environ['RELEASE_VERSION']
          PY

  test:
    needs: validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/rust
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust -> target
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
      - name: Build mandatory embedding fixtures
        run: |
          python -m pip install onnx==1.22.0
          python ../../tests/fixtures/ort_session/build_embedding_fixture.py
      - name: Run real embedding inference
        run: cargo test --locked -p piper-plus --features onnx --test test_embedding_dimensions
      - run: cargo test --locked -p piper-plus-g2p --all-features

  create_release:
    needs: [validate, test]
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Create or reuse verified draft
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="rust-v${RELEASE_VERSION}"
          if gh release view "$tag" --json isDraft > release.json; then
            jq -e '.isDraft == true' release.json
          else
            gh release create "$tag" --verify-tag --draft \
              --title "Rust ${RELEASE_VERSION}: ONNX推論の修正" \
              --notes 'ONNXモデルの宣言とキャッシュ保存先の権限を考慮した推論の修正版です。公開前に配布物と実推論を検証します。'
          fi
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"

  publish_crates:
    name: Publish to crates.io
    needs: create_release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write       # required by attest-build-provenance
      attestations: write
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Validate crate version
        working-directory: src/rust
        run: |
          CRATE_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          RELEASE_VERSION="${{ github.event.inputs.version }}"
          echo "Crate version: $CRATE_VERSION"
          echo "Release version: $RELEASE_VERSION"
          if [ "$CRATE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::notice::Rust crate version ($CRATE_VERSION) differs from release version ($RELEASE_VERSION). Rust packages use independent versioning."
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Package piper-plus-g2p
        working-directory: src/rust
        run: cargo package -p piper-plus-g2p --no-verify --locked

      - name: Attest piper-plus-g2p
        uses: actions/attest-build-provenance@v3.2.0
        with:
          subject-path: 'src/rust/target/package/piper-plus-g2p-[0-9]*.crate'

      - name: Publish piper-plus-g2p (dependency)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        working-directory: src/rust
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            set +e
            OUTPUT=$(cargo publish -p piper-plus-g2p 2>&1)
            STATUS=$?
            set -e
            echo "$OUTPUT"
            if [ "$STATUS" -ne 0 ]; then
              if echo "$OUTPUT" | grep -q "already uploaded\|already exists"; then
                echo "⚠️ piper-plus-g2p already published on crates.io (continuing)"
              else
                echo "::error::Failed to publish piper-plus-g2p to crates.io"
                exit "$STATUS"
              fi
            fi
            # Wait for crates.io index to update
            sleep 30
          else
            echo "::error::CARGO_REGISTRY_TOKEN is required to publish this release"
            exit 1
          fi

      - name: Package piper-plus
        working-directory: src/rust
        run: cargo package -p piper-plus --no-verify --locked

      - name: Attest piper-plus
        uses: actions/attest-build-provenance@v3.2.0
        with:
          subject-path: 'src/rust/target/package/piper-plus-[0-9]*.crate'

      - name: Publish piper-plus (core)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        working-directory: src/rust
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            set +e
            OUTPUT=$(cargo publish -p piper-plus 2>&1)
            STATUS=$?
            set -e
            echo "$OUTPUT"
            if [ "$STATUS" -ne 0 ]; then
              if echo "$OUTPUT" | grep -q "already uploaded\|already exists"; then
                echo "⚠️ piper-plus version already published on crates.io (continuing)"
              else
                echo "::error::Failed to publish piper-plus to crates.io"
                exit "$STATUS"
              fi
            fi
          else
            echo "::error::CARGO_REGISTRY_TOKEN is required to publish this release"
            exit 1
          fi

      - name: Package piper-plus-cli
        working-directory: src/rust
        run: cargo package -p piper-plus-cli --no-verify --locked

      - name: Attest piper-plus-cli
        uses: actions/attest-build-provenance@v3.2.0
        with:
          subject-path: 'src/rust/target/package/piper-plus-cli-[0-9]*.crate'

      - name: Publish piper-plus-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        working-directory: src/rust
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            # Wait for crates.io index to update
            sleep 30
            set +e
            OUTPUT=$(cargo publish -p piper-plus-cli 2>&1)
            STATUS=$?
            set -e
            echo "$OUTPUT"
            if [ "$STATUS" -ne 0 ]; then
              if echo "$OUTPUT" | grep -q "already uploaded\|already exists"; then
                echo "⚠️ piper-plus-cli version already published on crates.io (continuing)"
              else
                echo "::error::Failed to publish piper-plus-cli to crates.io"
                exit "$STATUS"
              fi
            fi
          else
            echo "::error::CARGO_REGISTRY_TOKEN is required to publish this release"
            exit 1
          fi

  # Rust CLI builds
  rust-cli:
    name: Build Rust CLI (${{ matrix.target }})
    needs: create_release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: piper-plus-rs-cli-linux-x64
            archive_ext: tar.gz
            cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: piper-plus-rs-cli-osx-arm64
            archive_ext: tar.gz
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: piper-plus-rs-cli-win-x64
            archive_ext: zip
            cross: false
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'TOML'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          TOML
          echo "Cargo config:"
          cat ~/.cargo/config.toml

      - name: Build release binary
        working-directory: src/rust
        run: cargo build --release -p piper-plus-cli --target ${{ matrix.target }}

      - name: Create archive (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        working-directory: src/rust
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/piper-plus-cli staging/
          cp ../../LICENSE.md piper-plus-g2p/THIRD_PARTY_LICENSES.md staging/
          tar -czf ${{ matrix.artifact }}.tar.gz -C staging .

      - name: Create archive (zip)
        if: matrix.archive_ext == 'zip'
        working-directory: src/rust
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging
          Copy-Item target/${{ matrix.target }}/release/piper-plus-cli.exe staging/
          Copy-Item ../../LICENSE.md,piper-plus-g2p/THIRD_PARTY_LICENSES.md staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Attest CLI archive
        uses: actions/attest-build-provenance@v3.2.0
        with:
          subject-path: src/rust/${{ matrix.artifact }}.${{ matrix.archive_ext }}

      - name: Show archive size
        shell: bash
        working-directory: src/rust
        run: ls -lh ${{ matrix.artifact }}.${{ matrix.archive_ext }}

      - name: Upload Release Asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create_release.outputs.tag_name }}" \
            "src/rust/${{ matrix.artifact }}.${{ matrix.archive_ext }}"
