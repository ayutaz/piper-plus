name: dev-build-all

on:
  workflow_call:
    inputs:
      release_upload_url:
        description: 'GitHub Release upload URL'
        required: false
        type: string
      version:
        description: 'Version to build'
        required: false
        type: string
    outputs:
      artifacts_built:
        description: 'Whether artifacts were successfully built'
        value: ${{ jobs.summary.outputs.success }}
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  CMAKE_BUILD_TYPE: Release

permissions:
  contents: write
  packages: read

jobs:
  # Use the reusable build-piper workflow for each platform
  build_linux_x64:
    name: Build Linux x86_64
    uses: ./.github/workflows/build-piper.yml
    with:
      os: ubuntu-24.04
      build-type: Release
      artifact-name: piper-plus-cpp-linux-x64
      cache-key-prefix: piper-plus-cpp-linux-x64

  build_macos_arm64:
    name: Build macOS ARM64
    uses: ./.github/workflows/build-piper.yml
    with:
      os: macos-14
      build-type: Release
      artifact-name: piper-plus-cpp-macos-arm64
      cache-key-prefix: piper-plus-cpp-macos-arm64

  build_windows_x64:
    name: Build Windows x64
    uses: ./.github/workflows/build-piper.yml
    with:
      os: windows-2022
      build-type: Release
      artifact-name: piper-plus-cpp-windows-x64
      cache-key-prefix: piper-plus-cpp-windows-x64

  # Reuse the same native build and synthesis verification exercised on PRs.
  build_linux_armv7:
    name: Build Linux ARMv7
    uses: ./.github/workflows/build-linux-armv7.yml
    with:
      release_upload_url: ${{ inputs.release_upload_url }}

  build_linux_arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          submodules: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Build in Docker
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg CMAKE_BUILD_TYPE=Release \
            --tag piper-arm64 \
            --file Dockerfile \
            --output type=local,dest=dist \
            .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: piper-plus-cpp-linux-arm64
          path: dist/piper-plus-cpp-linux-arm64.tar.gz

      - name: Upload to release
        if: inputs.release_upload_url != '' && inputs.release_upload_url != null
        uses: ./.github/actions/retry-upload
        with:
          upload_url: ${{ inputs.release_upload_url }}
          asset_path: dist/piper-plus-cpp-linux-arm64.tar.gz
          asset_name: piper-plus-cpp-linux-arm64.tar.gz

  # Build Python wheels for PyPI
  build_python_wheels:
    name: Build Python Wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Update VERSION file if provided
        if: inputs.version != '' && inputs.version != null
        run: |
          echo "Updating VERSION file to: ${{ inputs.version }}"
          echo "${{ inputs.version }}" > VERSION
          echo "VERSION file updated:"
          cat VERSION

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: Build wheel
        working-directory: src/python_run
        run: |
          python -m build --wheel --outdir ../../dist/

      # Gate 2 (Issue #590 / rename design §9): open the just-built wheel and
      # verify (a) required package-data JSON files are bundled and (b) no
      # stray top-level `piper/` directory leaked in — either regression is
      # invisible to unit tests but breaks downstream co-install with the
      # legacy `piper-tts` package on PyPI. ~1s, no extra deps.
      - name: Verify wheel bundles required package-data (Gate 2)
        run: python scripts/check_wheel_data_bundling.py --wheel dist/piper_plus-*.whl

      - name: List built wheels
        run: ls -la dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels-3.11
          path: dist/*.whl

  # Test Python wheels on multiple platforms
  test_python_wheels:
    name: Test Python Wheels (${{ matrix.os }})
    needs: [build_python_wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Download wheel artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: wheels-3.11
          path: dist/

      - name: Install wheel and dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
          pip install pyopenjtalk-plus g2p-en pypinyin
          python -c "import nltk; nltk.download('averaged_perceptron_tagger_eng', quiet=True); nltk.download('cmudict', quiet=True)"

      - name: Smoke test all 7 languages
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          python -c "
          from piper_plus.phonemize.multilingual import MultilingualPhonemizer
          mp = MultilingualPhonemizer(languages=['ja', 'en', 'zh', 'es', 'fr', 'pt', 'sv'])
          for lang, text in [('ja', 'こんにちは'), ('en', 'Hello'), ('zh', '你好'), ('es', 'Hola'), ('fr', 'Bonjour'), ('pt', 'Ola'), ('sv', 'Hej')]:
              result = mp.phonemize(text)
              assert len(result) > 3, f'{lang} failed: {len(result)} tokens'
          print('All 7 languages OK')
          "

  # Upload built artifacts to release if URL is provided
  upload_to_release:
    name: Upload to Release
    needs: [build_linux_x64, build_macos_arm64, build_windows_x64]
    if: inputs.release_upload_url != '' && inputs.release_upload_url != null
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - artifact: piper-plus-cpp-linux-x64
            asset_name: piper-plus-cpp-linux-x64.tar.gz
          - artifact: piper-plus-cpp-macos-arm64
            asset_name: piper-plus-cpp-macos-arm64.tar.gz
          - artifact: piper-plus-cpp-windows-x64
            asset_name: piper-plus-cpp-windows-x64.zip
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Download artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - name: List downloaded files
        run: ls -la dist/

      - name: Fix artifact names
        run: |
          # Rename downloaded artifacts to match expected names
          if [ -f "dist/piper-plus-cpp-Linux.tar.gz" ]; then
            mv dist/piper-plus-cpp-Linux.tar.gz dist/piper-plus-cpp-linux-x64.tar.gz
            echo "Renamed piper-plus-cpp-Linux.tar.gz to piper-plus-cpp-linux-x64.tar.gz"
          fi
          if [ -f "dist/piper-plus-cpp-macOS.tar.gz" ]; then
            mv dist/piper-plus-cpp-macOS.tar.gz dist/piper-plus-cpp-macos-arm64.tar.gz
            echo "Renamed piper-plus-cpp-macOS.tar.gz to piper-plus-cpp-macos-arm64.tar.gz"
          fi
          if [ -f "dist/piper-plus-cpp-Windows.zip" ]; then
            mv dist/piper-plus-cpp-Windows.zip dist/piper-plus-cpp-windows-x64.zip
            echo "Renamed piper-plus-cpp-Windows.zip to piper-plus-cpp-windows-x64.zip"
          fi
          echo "Final dist contents:"
          ls -la dist/

      - name: Upload to release
        uses: ./.github/actions/retry-upload
        with:
          upload_url: ${{ inputs.release_upload_url }}
          asset_path: dist/${{ matrix.asset_name }}
          asset_name: ${{ matrix.asset_name }}

  # Summary job
  summary:
    name: Build Summary
    needs: [build_linux_x64, build_macos_arm64, build_windows_x64, build_linux_armv7, build_linux_arm64, build_python_wheels, test_python_wheels]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      success: ${{ steps.check.outputs.success }}
    steps:
      - name: Check build results
        id: check
        run: |
          if [[ "${{ needs.build_linux_x64.result }}" == "success" ]] && \
             [[ "${{ needs.build_macos_arm64.result }}" == "success" ]] && \
             [[ "${{ needs.build_windows_x64.result }}" == "success" ]] && \
             [[ "${{ needs.build_linux_armv7.result }}" == "success" ]] && \
             [[ "${{ needs.build_linux_arm64.result }}" == "success" ]] && \
             [[ "${{ needs.build_python_wheels.result }}" == "success" ]] && \
             [[ "${{ needs.test_python_wheels.result }}" == "success" ]]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "✅ All builds and tests succeeded!"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "❌ Some builds/tests failed:"
            echo "  Linux x64: ${{ needs.build_linux_x64.result }}"
            echo "  macOS ARM64: ${{ needs.build_macos_arm64.result }}"
            echo "  Windows x64: ${{ needs.build_windows_x64.result }}"
            echo "  Linux ARMv7: ${{ needs.build_linux_armv7.result }}"
            echo "  Linux ARM64: ${{ needs.build_linux_arm64.result }}"
            echo "  Python Wheels: ${{ needs.build_python_wheels.result }}"
            echo "  Wheel Tests: ${{ needs.test_python_wheels.result }}"
            exit 1
          fi
