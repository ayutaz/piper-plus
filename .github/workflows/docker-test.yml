name: Docker public release verification

on:
  workflow_dispatch:
    inputs:
      images:
        description: '検証するイメージ名のJSON配列'
        default: '["python-inference","webui","wyoming"]'
        required: true
        type: string

permissions:
  contents: read

jobs:
  public-runtime:
    name: Public GHCR and DockerHub (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Free hosted runner disk space
        if: matrix.image == 'python-inference'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
      - name: Verify public digests and run actual Japanese synthesis
        env:
          RELEASE_IMAGE: ${{ matrix.image }}
        run: python ci/release_docker/run_public_runtime.py "$RELEASE_IMAGE"
      - name: Preserve exact image and runtime evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: public-docker-runtime-${{ matrix.image }}-2.0.0
          path: public-docker-proof/
          if-no-files-found: error
