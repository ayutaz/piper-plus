name: coverage-aggregation

on:
  workflow_run:
    # GitHub は workflow の `name:` で照合する (ファイル名ではない)。 以前は
    # `go-ci` / `csharp-ci` / `cpp-tests` と書いていて、 `Go CI` / `C# CI` /
    # `C++ Tests` の完了では一度も起動していなかった。 `+` はパターンの
    # 特殊文字なので `\+` と書く。 名前の実在は
    # tests/scripts/test_required_gate_workflow_contract.py が全 workflow で検査する。
    workflows: [python-tests, rust-tests, 'Go CI', 'C# CI', 'C\+\+ Tests', CI]
    types:
      - completed
  # A manual run has no triggering run, so it takes the ID of the run to
  # aggregate (without it the download step looked up run "NaN" and failed).
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of python-tests / rust-tests / Go CI / C# CI / C++ Tests / CI to aggregate"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6.1.0

      # Coverage reports travel in the `*test-results*` artifacts
      # (python-tests: coverage.xml, csharp-ci / ci: coverage.cobertura.xml).
      # Downloading every artifact pulled release binaries and Docker build
      # records too, and failed after 5 retries on Go CI's `*.dockerbuild`
      # artifacts; that failure was hidden by continue-on-error.
      - name: Download coverage artifacts from triggering workflow
        uses: actions/download-artifact@v6.0.0
        with:
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: '*test-results*'
          path: ./artifacts

      - name: Find coverage reports
        id: reports
        run: |
          mkdir -p ./artifacts  # nothing matched the pattern -> no directory
          count=$(find ./artifacts \( -name 'coverage*.xml' -o -name 'lcov.info' -o -name 'coverage.out' \) -type f 2>/dev/null | wc -l)
          echo "coverage reports: ${count}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: List downloaded artifacts
        run: |
          find ./artifacts -type f | head -30

      # Workflows that upload coverage straight to Codecov (Go, Rust, C++)
      # leave nothing to aggregate here.
      - name: Upload aggregated coverage to Codecov
        if: steps.reports.outputs.count != '0'
        uses: codecov/codecov-action@v5.5.5
        with:
          directory: ./artifacts
          flags: aggregated
          fail_ci_if_error: false
        continue-on-error: true

      - name: Coverage summary comment
        if: github.event.workflow_run.event == 'pull_request'
        run: |
          {
            echo "## Coverage Aggregation Summary"
            echo ""
            echo "| Language | Status |"
            echo "|----------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"
          for lang in python rust go csharp cpp; do
            # `find ... | head -1 > /dev/null` は head の終了コード (常に 0) を
            # 返すため、 artifact が無くても全言語が uploaded と表示されていた。
            if [ -n "$(find ./artifacts -path "*${lang}*" -name "*.xml" 2>/dev/null | head -1)" ]; then
              echo "| $lang | uploaded |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $lang | missing |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
