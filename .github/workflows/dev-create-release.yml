name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '準備済みタグのバージョン（例: 2.0.0）。同じタグを選んで実行してください'
        required: true
        type: string
      release_name:
        description: 'リリース名（未指定の場合は自動生成）'
        required: false
        type: string

permissions:
  contents: write
  packages: read

# Serialise tag-driven publish runs against the same ref so a re-tag (or
# the rare retry from the GitHub UI) cannot race the in-flight publish and
# double-upload. We do NOT cancel-in-progress: an interrupted publish can
# leave half-uploaded artefacts on PyPI / NuGet / crates.io that are awkward
# to clean up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Create Release
  create_release:
    name: Create Development Release
    runs-on: ubuntu-24.04
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_name: ${{ steps.get_release_name.outputs.name }}
      tag_name: ${{ steps.get_release_name.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Validate version format
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$RELEASE_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.-]?[a-zA-Z]+[0-9]+(\.[0-9]+)*)?$'; then
            echo "::error::Invalid release version: $RELEASE_VERSION"
            exit 1
          fi
          test "$(tr -d '\n\r' < VERSION)" = "$RELEASE_VERSION"

      # The selected commit must already contain the requested release version.
      # Validate the committed version before creating any release
      - name: Validate version consistency across files
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "Checking version consistency for: $VERSION"

          # Check the version committed at the selected tag.
          if [ -f "VERSION" ]; then
            FILE_VERSION=$(cat VERSION | tr -d '\n\r')
            if [ "$FILE_VERSION" != "$VERSION" ]; then
              echo "❌ VERSION file has '$FILE_VERSION', expected '$VERSION'"
              exit 1
            fi
            echo "✅ VERSION file: $FILE_VERSION"
          fi

          # Check pyproject.toml now uses dynamic version
          if [ -f "pyproject.toml" ]; then
            if grep -q 'dynamic = \["version"\]' pyproject.toml; then
              echo "✅ pyproject.toml: Using dynamic version from VERSION file"
            else
              echo "❌ pyproject.toml should use dynamic version"
              exit 1
            fi
          fi

          # Note: src/python/piper_train/VERSION is no longer used
          # All version information is now centralized in the root VERSION file

          # Note: src/python_run/setup.py now reads version from the root VERSION file
          # Verification is done by checking that the file exists and is readable
          if [ -f "src/python_run/setup.py" ]; then
            echo "✅ src/python_run/setup.py: Now uses dynamic version from VERSION file"
          fi

          echo -e "\n✅ All version files are consistent with version $VERSION"

      - name: Generate release name
        id: get_release_name
        run: |
          if [ -n "${{ github.event.inputs.release_name }}" ]; then
            echo "name=${{ github.event.inputs.release_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=Release ${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

          echo "tag_name=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: get_release_notes
        run: |
          # Auto-generate release notes
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "## 🚀 Release v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Build Date:** $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M:%S JST')" >> $GITHUB_OUTPUT
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT

          # Get recent commits
          echo "### 📝 Recent Changes" >> $GITHUB_OUTPUT
          git log --oneline -10 --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT

          echo "### 📦 Installation" >> $GITHUB_OUTPUT
          echo "\`\`\`bash" >> $GITHUB_OUTPUT
          echo "# Python" >> $GITHUB_OUTPUT
          echo "pip install piper-plus==${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          # C#/Rust/npm パッケージは独立バージョン管理 — 各 manifest から動的取得
          CS_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' src/csharp/PiperPlus.Cli/PiperPlus.Cli.csproj)
          echo "# C# (.NET Global Tool) — v${CS_VERSION}" >> $GITHUB_OUTPUT
          echo "dotnet tool install -g PiperPlus.Cli --version ${CS_VERSION}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          RS_VERSION=$(grep -m1 '^version' src/rust/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "# Rust — v${RS_VERSION}" >> $GITHUB_OUTPUT
          echo "cargo install piper-plus-cli --version ${RS_VERSION}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          NPM_VERSION=$(node -p "require('./src/wasm/openjtalk-web/package.json').version")
          echo "# npm (Browser WASM) — v${NPM_VERSION}" >> $GITHUB_OUTPUT
          echo "npm install piper-plus@${NPM_VERSION}" >> $GITHUB_OUTPUT
          echo "\`\`\`" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT

          echo "### 🔗 Links" >> $GITHUB_OUTPUT
          echo "- [PyPI Package](https://pypi.org/project/piper-plus/${{ github.event.inputs.version }}/)" >> $GITHUB_OUTPUT
          echo "- [NuGet Package (CLI)](https://www.nuget.org/packages/PiperPlus.Cli)" >> $GITHUB_OUTPUT
          echo "- [NuGet Package (Core)](https://www.nuget.org/packages/PiperPlus.Core)" >> $GITHUB_OUTPUT
          echo "- [crates.io Package (CLI)](https://crates.io/crates/piper-plus-cli)" >> $GITHUB_OUTPUT
          echo "- [crates.io Package (Core)](https://crates.io/crates/piper-plus)" >> $GITHUB_OUTPUT
          echo "- [npm Package](https://www.npmjs.com/package/piper-plus)" >> $GITHUB_OUTPUT
          echo "- [Documentation](https://github.com/ayutaz/piper-plus#readme)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ steps.get_release_name.outputs.tag_name }}"

          set -euo pipefail
          # Tags are pushed explicitly from the verified commit before dispatch.
          # GITHUB_TOKEN-created tags do not trigger downstream release workflows.
          TAG_COMMIT=$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")
          test "$TAG_COMMIT" = "$(git rev-parse HEAD)"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG_NAME is already public; refusing to overwrite it."
              exit 1
            fi
            echo "Reusing draft release for verified tag: $TAG_NAME"
          else
            gh release create "$TAG_NAME" \
              --title "${{ steps.get_release_name.outputs.name }}" \
              --notes "${{ steps.get_release_notes.outputs.body }}" \
              --draft --verify-tag
          fi

          # Get release information using gh release view with --json
          echo "Fetching release information..."
          RELEASE_JSON=$(gh release view "$TAG_NAME" --json id,url,uploadUrl)

          # Parse JSON output to get release information
          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
          RELEASE_URL=$(echo "$RELEASE_JSON" | jq -r '.url')
          UPLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.uploadUrl')

          # Verify we got valid values
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "::error::Failed to get release ID"
            echo "Response was: $RELEASE_JSON"
            exit 1
          fi

          echo "upload_url=${UPLOAD_URL}" >> $GITHUB_OUTPUT
          echo "release_url=${RELEASE_URL}" >> $GITHUB_OUTPUT
          echo "release_id=${RELEASE_ID}" >> $GITHUB_OUTPUT
          echo "✅ Created release: ${RELEASE_URL}"

  # Trigger builds
  build_all:
    name: Build All Platforms
    needs: create_release
    uses: ./.github/workflows/dev-build-all.yml
    with:
      release_upload_url: ${{ needs.create_release.outputs.upload_url }}
      version: ${{ github.event.inputs.version }}
    permissions:
      contents: write
      packages: read

  # Publish to PyPI
  publish_pypi:
    name: Publish to PyPI
    needs: [build_all]
    if: |
      always() &&
      needs.build_all.result == 'success'
    runs-on: ubuntu-24.04
    # Trusted Publishing (PEP 740): PyPI verifies the OIDC token issued to
    # this job instead of accepting a long-lived API token. This requires
    # the project to be configured with a "Trusted Publisher" entry on
    # PyPI matching repository=ayutaz/piper-plus, workflow=dev-create-release.yml,
    # environment=pypi.
    environment:
      name: pypi
      url: https://pypi.org/p/piper-plus
    permissions:
      contents: read
      id-token: write       # OIDC for PyPI Trusted Publishing
      attestations: write   # SLSA build provenance attestation
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Download all wheels
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Install twine
        run: pip install twine

      - name: Check wheels
        run: |
          ls -la dist/
          python scripts/check_python_release_wheel.py --name piper-plus --version "$(cat VERSION)" dist/*.whl
          if ls dist/*.whl 1> /dev/null 2>&1; then
            twine check dist/*.whl
          else
            echo "::error::No wheel files found"
            exit 1
          fi

      - name: Generate SLSA build provenance attestation (wheels)
        # Attest the exact byte content that PyPI will publish. The
        # attestation lands in the repo's GitHub attestation store and
        # can later be verified with `gh attestation verify`.
        if: hashFiles('dist/*.whl') != ''
        uses: actions/attest-build-provenance@v3.2.0
        with:
          subject-path: 'dist/*.whl'

      - name: Publish to PyPI (Trusted Publisher)
        # No password env var — the action uses the OIDC id-token to mint
        # a short-lived PyPI upload credential. PIPY_TOKEN is intentionally
        # NOT referenced anymore (kept as a fallback secret only for emergency).
        if: hashFiles('dist/*.whl') != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  # C# CLI builds
  csharp-cli:
    name: Build C# CLI (${{ matrix.rid }})
    needs: create_release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive_ext: zip
            cross: false
          - rid: win-arm64
            os: windows-latest
            archive_ext: zip
            cross: true
          - rid: linux-x64
            os: ubuntu-24.04
            archive_ext: tar.gz
            cross: false
          - rid: linux-arm64
            os: ubuntu-24.04
            archive_ext: tar.gz
            cross: true
          - rid: osx-x64
            os: macos-14
            archive_ext: tar.gz
            cross: true
          - rid: osx-arm64
            os: macos-14
            archive_ext: tar.gz
            cross: false
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Publish C# CLI
        shell: bash
        run: |
          PUBLISH_ARGS="-c Release -r ${{ matrix.rid }} --self-contained true"
          PUBLISH_ARGS="$PUBLISH_ARGS -p:PublishSingleFile=true -p:PublishTrimmed=true"
          # C# CLI uses its own version from csproj (independent from PyPI version)

          if [ "${{ matrix.cross }}" = "true" ]; then
            PUBLISH_ARGS="$PUBLISH_ARGS -p:PublishReadyToRun=false"
          else
            PUBLISH_ARGS="$PUBLISH_ARGS -p:PublishReadyToRun=true"
          fi

          dotnet publish src/csharp/PiperPlus.Cli/PiperPlus.Cli.csproj $PUBLISH_ARGS -o publish/

      - name: Create archive (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: tar -czf piper-plus-cli-${{ matrix.rid }}.tar.gz -C publish .

      - name: Create archive (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath piper-plus-cli-${{ matrix.rid }}.zip

      - name: Show archive size
        run: ls -lh piper-plus-cli-${{ matrix.rid }}.${{ matrix.archive_ext }}
        shell: bash

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ needs.create_release.outputs.tag_name }}" \
            "piper-plus-cli-${{ matrix.rid }}.${{ matrix.archive_ext }}" \
            --clobber

  # Component packages are immutable and published by their own tag workflows.
  publish_nuget:
    name: Verify existing nuget packages
    needs: create_release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Verify immutable component registry packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/check_component_registry.py
          --component nuget --directory "$RUNNER_TEMP/nuget-verification"
      - name: Preserve component verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: root-release-nuget-verification
          path: ${{ runner.temp }}/nuget-verification/proof/
          if-no-files-found: error

  # Component packages are immutable and published by their own tag workflows.
  publish_crates:
    name: Verify existing crates packages
    needs: create_release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
      - name: Verify immutable component registry packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/check_component_registry.py
          --component crates --directory "$RUNNER_TEMP/crates-verification"
      - name: Preserve component verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: root-release-crates-verification
          path: ${{ runner.temp }}/crates-verification/proof/
          if-no-files-found: error

  # Rust CLI builds
  rust-cli:
    name: Build Rust CLI (${{ matrix.target }})
    needs: create_release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: piper-plus-rs-cli-linux-x64
            archive_ext: tar.gz
            cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: piper-plus-rs-cli-osx-arm64
            archive_ext: tar.gz
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: piper-plus-rs-cli-win-x64
            archive_ext: zip
            cross: false
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'TOML'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          TOML
          echo "Cargo config:"
          cat ~/.cargo/config.toml

      - name: Build release binary
        working-directory: src/rust
        run: cargo build --release -p piper-plus-cli --target ${{ matrix.target }}

      - name: Create archive (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        working-directory: src/rust
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/piper-plus-cli staging/
          tar -czf ${{ matrix.artifact }}.tar.gz -C staging .

      - name: Create archive (zip)
        if: matrix.archive_ext == 'zip'
        working-directory: src/rust
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging
          Copy-Item target/${{ matrix.target }}/release/piper-plus-cli.exe staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Show archive size
        shell: bash
        working-directory: src/rust
        run: ls -lh ${{ matrix.artifact }}.${{ matrix.archive_ext }}

      - name: Upload Release Asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create_release.outputs.tag_name }}" \
            "src/rust/${{ matrix.artifact }}.${{ matrix.archive_ext }}" \
            --clobber

  # Final summary
  release_summary:
    name: Release Summary
    runs-on: ubuntu-24.04
    needs: [create_release, build_all, publish_pypi, publish_nuget, publish_crates, csharp-cli, rust-cli]
    if: always()
    steps:
      - name: Summary
        run: |
          set -euo pipefail
          for result in "${{ needs.create_release.result }}" "${{ needs.build_all.result }}" "${{ needs.publish_pypi.result }}" "${{ needs.publish_nuget.result }}" "${{ needs.publish_crates.result }}" "${{ needs.csharp-cli.result }}" "${{ needs.rust-cli.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::Release is incomplete: $result"
              exit 1
            fi
          done
          echo "## Release Summary"
          echo ""
          echo "**Release Name:** ${{ needs.create_release.outputs.release_name }}"
          echo "**Tag:** ${{ needs.create_release.outputs.tag_name }}"
          echo ""
          echo "### Build Status"
          echo "- Create Release: ${{ needs.create_release.result }}"
          echo "- Build All: ${{ needs.build_all.result }}"
          echo "- Publish PyPI: ${{ needs.publish_pypi.result }}"
          echo "- Publish NuGet: ${{ needs.publish_nuget.result }}"
          echo "- Publish crates.io: ${{ needs.publish_crates.result }}"
          echo "- C# CLI: ${{ needs.csharp-cli.result }}"
          echo "- Rust CLI: ${{ needs.rust-cli.result }}"
          echo ""

          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- C++/Python Build: ${{ needs.build_all.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- PyPI: ${{ needs.publish_pypi.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- NuGet: ${{ needs.publish_nuget.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- crates.io: ${{ needs.publish_crates.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- C# CLI: ${{ needs.csharp-cli.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Rust CLI: ${{ needs.rust-cli.result }}" >> $GITHUB_STEP_SUMMARY
