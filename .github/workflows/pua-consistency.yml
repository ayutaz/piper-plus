name: "PUA Consistency Gate"

# Prevents the multi-codepoint regression class (e.g. ɔɪ/œ̃/ɐ̃ leak in v1.12.0).
# See docs/spec/pua-contract.toml for the full contract.
#
# This workflow runs on every push/PR that touches:
#   - the canonical pua.json
#   - any of the 7 runtime PUA tables (Python/Rust/Go/JS/C#/C++/Swift)
#   - the inventory lists in id_maps.py
#   - the contract spec or this workflow itself

on:
  push:
    branches: [dev, main]
    paths:
      - 'src/python/g2p/piper_plus_g2p/data/pua.json'
      - 'src/python/g2p/piper_plus_g2p/encode/**'
      - 'src/python_run/piper_plus/phonemize/token_mapper.py'
      - 'src/rust/piper-plus-g2p/src/token_map.rs'
      - 'src/go/phonemize/pua.go'
      - 'src/go/phonemize/pua_test.go'
      - 'src/wasm/g2p/src/pua-map.js'
      - 'src/csharp/PiperPlus.Core/Mapping/OpenJTalkToPiperMapping.cs'
      - 'src/cpp/phoneme_parser.cpp'
      - 'src/cpp/piper.cpp'
      - 'src/python/piper_train/update_model_config.py'
      - 'Sources/PiperPlusG2P/PUAMap.swift'
      - 'docs/spec/pua-contract.toml'
      - 'scripts/check_pua_consistency.py'
      - '.github/workflows/pua-consistency.yml'
      - 'scripts/regenerate_test_fixture.py'
      - 'scripts/test_sync_gates_meta.py'
      - 'scripts/check_config_phoneme_keys.py'
      - 'tests/scripts/test_check_config_phoneme_keys.py'
      - 'src/python_run/piper_plus/api/_model_resolver.py'
  pull_request:
    paths:
      - 'src/python/g2p/piper_plus_g2p/data/pua.json'
      - 'src/python/g2p/piper_plus_g2p/encode/**'
      - 'src/python_run/piper_plus/phonemize/token_mapper.py'
      - 'src/rust/piper-plus-g2p/src/token_map.rs'
      - 'src/go/phonemize/pua.go'
      - 'src/go/phonemize/pua_test.go'
      - 'src/wasm/g2p/src/pua-map.js'
      - 'src/csharp/PiperPlus.Core/Mapping/OpenJTalkToPiperMapping.cs'
      - 'src/cpp/phoneme_parser.cpp'
      - 'src/cpp/piper.cpp'
      - 'src/python/piper_train/update_model_config.py'
      - 'Sources/PiperPlusG2P/PUAMap.swift'
      - 'docs/spec/pua-contract.toml'
      - 'scripts/check_pua_consistency.py'
      - '.github/workflows/pua-consistency.yml'
      - 'scripts/regenerate_test_fixture.py'
      - 'scripts/test_sync_gates_meta.py'
      - 'scripts/check_config_phoneme_keys.py'
      - 'tests/scripts/test_check_config_phoneme_keys.py'
      - 'src/python_run/piper_plus/api/_model_resolver.py'
  schedule:
    # Weekly: catch a stale *distributed* (HuggingFace) config — e.g. the
    # v1.12.0 ɔɪ/œ̃/ɐ̃ multi-codepoint leak that broke C++ inference on Windows.
    # PR-time gates cannot see it because the artifact lives on HF, not the repo.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-runtime-table-consistency:
    name: All 7 runtime PUA tables match pua.json (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # PUA byte-sync is line-ending sensitive — run on Windows / macOS
        # too so a CRLF-checkout regression is caught at PR time.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Verify cross-runtime PUA mapping consistency
        run: python scripts/check_pua_consistency.py --verbose --check-version

      # Meta-test: bump pua.json version to a sentinel and assert the gate
      # exits non-zero with --check-version. Catches regressions in the
      # version-comparison regex / parser without needing a separate harness.
      - name: Meta-test (gate fails on intentional version drift)
        # bash on all three OSes (windows-latest ships Git Bash) for the
        # `if ! git diff` guard below.
        shell: bash
        run: |
          python scripts/test_sync_gates_meta.py
          # Restore must have run; assert tree is clean for the next jobs.
          if ! git diff --quiet; then
            echo "ERROR: meta-test left the working tree dirty (restore failed):"
            git --no-pager diff
            exit 1
          fi

  fixture-drift:
    name: Test fixture in sync with pua.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Detect drift between pua.json and phoneme_test_cases.json
        run: python scripts/regenerate_test_fixture.py --check

  inventory-and-fail-fast-tests:
    name: Inventory coverage + fail-fast guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: astral-sh/setup-uv@v6.8.0
        with:
          python-version: '3.13'

      - name: Install Python G2P deps
        working-directory: src/python/g2p
        run: uv sync --extra all --extra dev

      - name: Run PUA invariant tests (G2P)
        working-directory: src/python/g2p
        # `--no-cov` で coverage 計測を無効化 (test_pua_invariants.py のみ
        # 実行するため、coverage 閾値 80% を満たさない誤検知を回避)
        run: uv run pytest tests/test_pua_invariants.py -v --no-cov

      - name: Install piper_train deps
        working-directory: src/python
        run: uv sync --extra test

      - name: Run update_model_config validate tests
        working-directory: src/python
        # `--no-cov` で coverage 計測を無効化 (単一テスト実行で coverage 閾値 70%
        # を満たさない誤検知を回避)
        run: uv run pytest tests/test_update_model_config.py -v --no-cov

  rust-pua-tests:
    name: Rust PUA table tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust

      - name: Run Rust PUA tests
        working-directory: src/rust
        run: |
          cargo test -p piper-plus-g2p --lib -- token_map
          cargo test -p piper-plus-g2p --lib -- test_fixed_pua_count

  go-pua-tests:
    name: Go PUA table tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-go@v5.6.0
        with:
          go-version: 'stable'

      - name: Run Go PUA tests
        working-directory: src/go
        run: go test ./phonemize/... -run "TestFixedPUA|TestRegisterToken_DynamicPUA" -v

  js-pua-tests:
    name: JS/WASM PUA table tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '24.x'

      - name: Run JS PUA tests
        working-directory: src/wasm/g2p
        run: |
          node --test test/test-pua-map.js
          node --test test/test-encode.js

  config-key-validator:
    name: Pre-flight config validator (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      # git 管理下で phoneme_id_map を持つ全 JSON を、 C++ reader と同じ規則
      # (1 codepoint か、 contract の raw alias 3 key) で検査する。 以前は
      # `config.json` という名前のファイルだけを探しており、 repo の config は
      # `*.onnx.json` なので 1 件も検査せずに緑だった。
      - name: Validate every config checked into the repo
        run: python scripts/check_config_phoneme_keys.py --repo

  distributed-config-validator:
    name: Distributed (HF) config validator
    # 配布中の config は HF にあり、 PR の差分には現れない (v1.12.0 の
    # ɔɪ/œ̃/ɐ̃ 漏れで Windows の C++ 推論が壊れた事例)。 この workflow が
    # 走るたびに (PUA 関連ファイルを触る PR / push と週次)、 MODEL_ALIASES の
    # 各 config を pin された revision で取得して検査する。 取得に失敗した
    # model は skip せず失敗にする (script 側で retry する)。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Validate HF-distributed model configs load in the C++ reader
        run: python scripts/check_config_phoneme_keys.py --distributed
