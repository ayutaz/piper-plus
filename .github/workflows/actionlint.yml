name: actionlint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [dev, main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install actionlint and shellcheck (pinned)
        # Pinned so CI and local runs report the same findings: the runner's
        # preinstalled shellcheck and the "latest" download script both drift.
        # Keep ACTIONLINT_VERSION in sync with the actionlint rev in
        # .pre-commit-config.yaml (tests/scripts/test_actionlint_workflow.py).
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lint"
          cd "$RUNNER_TEMP/lint"
          al="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$al" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${al}"
          echo "${ACTIONLINT_SHA256}  ${al}" | sha256sum -c -
          tar xzf "$al" actionlint
          sc="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLo "$sc" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${sc}"
          echo "${SHELLCHECK_SHA256}  ${sc}" | sha256sum -c -
          tar xJf "$sc"
          ./actionlint -version
          "./shellcheck-v${SHELLCHECK_VERSION}/shellcheck" --version
        shell: bash

      - name: Check workflow files
        # YAML syntax, action inputs/outputs, expressions, job dependencies,
        # and every bash `run:` script through shellcheck. A finding fails
        # the job.
        run: |
          lint="$RUNNER_TEMP/lint"
          "$lint/actionlint" -color -shellcheck "$lint/shellcheck-v0.11.0/shellcheck"
        shell: bash
