name: Build All Platforms

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-matrix:
    name: Build Matrix
    strategy:
      # build-piper.yml の Unix step は `bash -eo pipefail`、 Windows step は
      # pwsh の throw と、 失敗の出方が OS で異なる。 既定 (fail-fast: true) の
      # ままだと 1 プラットフォームの一過性ネットワーク失敗が残り 2 job を
      # キャンセルし、 「どの OS で何が起きたか」を切り分けられなくなる。
      # dev-build-all.yml:213 も同じ理由で false にしている。
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux-x86_64
            artifact: piper-plus-cpp-linux-x86_64
          - os: macos-latest
            name: macOS-aarch64
            artifact: piper-plus-cpp-macos-aarch64
          - os: windows-latest
            name: Windows-x64
            artifact: piper-plus-cpp-windows-x64

    uses: ./.github/workflows/build-piper.yml
    with:
      os: ${{ matrix.os }}
      build-type: Release
      artifact-name: ${{ matrix.artifact }}-${{ github.sha }}

  build-summary:
    name: Build Summary
    needs: build-matrix
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check build results
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY

          # Check if all builds succeeded
          if [ "${{ needs.build-matrix.result }}" == "success" ]; then
            echo "| All Platforms | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All platform builds completed successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Build Status | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "One or more platform builds failed." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
