      # -------------------------------------------------------- version-consistency
      # Compares each manifest's version with the major.minor prefix pinned in
      # docs/spec/release-versions.toml. `mode = "warn"` there emits warnings
      # and exits 0; a manual run can override it with the mode_override input.
      - name: "version-consistency: pinned versions vs manifests"
        id: version-consistency
        if: ${{ !cancelled() }}
        env:
          MODE_OVERRIDE: ${{ github.event.inputs.mode_override }}
        run: |
          python3 - <<'PY'
          """
          Reads docs/spec/release-versions.toml and compares each pinned
          `expected_prefix` against the actual version extracted from the
          named manifest. Honours `mode = "warn" | "fail"` from the toml,
          with `MODE_OVERRIDE` env var taking precedence (used by
          workflow_dispatch).
          """
          from __future__ import annotations
          import json
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          ROOT = Path(".").resolve()
          SPEC = ROOT / "docs/spec/release-versions.toml"

          if not SPEC.exists():
              print(f"::error::Missing spec file: {SPEC}")
              sys.exit(1)

          with SPEC.open("rb") as fh:
              spec = tomllib.load(fh)

          mode = (os.environ.get("MODE_OVERRIDE") or spec.get("meta", {}).get("mode") or "warn").strip()
          if mode not in ("warn", "fail"):
              print(f"::warning::Unknown mode '{mode}' — defaulting to 'warn'")
              mode = "warn"
          print(f"Running in mode: {mode}")

          # ---------- Manifest extractors ----------------------------------------
          def read_text(rel: str) -> str:
              p = ROOT / rel
              if not p.exists():
                  raise FileNotFoundError(rel)
              return p.read_text(encoding="utf-8")

          def extract_version_file(rel: str) -> str:
              return read_text(rel).strip()

          def extract_csproj(rel: str) -> str:
              text = read_text(rel)
              m = re.search(r"<Version>([^<]+)</Version>", text)
              if not m:
                  raise ValueError(f"<Version> not found in {rel}")
              return m.group(1).strip()

          def extract_cargo_workspace(rel: str) -> str:
              text = read_text(rel)
              # Workspace-level version: first `^version = "..."` after
              # `[workspace.package]` (or the top-level `[package]` for
              # non-workspace crates).
              for line in text.splitlines():
                  m = re.match(r'^\s*version\s*=\s*"([^"]+)"\s*$', line)
                  if m:
                      return m.group(1)
              raise ValueError(f"version line not found in {rel}")

          def extract_package_json(rel: str) -> str:
              data = json.loads(read_text(rel))
              return str(data["version"])

          def extract_swift_let(rel: str, field: str) -> str:
              text = read_text(rel)
              # Match: `let version = "1.13.0"` (allows leading whitespace).
              pat = rf'^\s*let\s+{re.escape(field)}\s*=\s*"([^"]+)"'
              m = re.search(pat, text, flags=re.MULTILINE)
              if not m:
                  raise ValueError(f"`let {field}` not found in {rel}")
              return m.group(1)

          def extract_gradle_property(rel: str, field: str) -> str:
              text = read_text(rel)
              # Match: `VERSION_NAME=1.0.0` (no quotes, ignore spaces).
              pat = rf'^\s*{re.escape(field)}\s*=\s*([^\s#]+)'
              m = re.search(pat, text, flags=re.MULTILINE)
              if not m:
                  raise ValueError(f"property `{field}` not found in {rel}")
              return m.group(1).strip()

          def detect_pyproject_dynamic(rel: str) -> bool:
              text = read_text(rel)
              return bool(re.search(r'dynamic\s*=\s*\[\s*"version"\s*\]', text))

          # ---------- Per-section dispatch ---------------------------------------
          # Each section knows how to map a spec entry to (label, actual_version
          # or sentinel "DYNAMIC"). The spec keys are arbitrary — we walk all
          # tables except [meta] and dispatch by manifest extension / fields.
          failures: list[str] = []
          warnings: list[str] = []

          def emit(label: str, manifest: str, expected: str, actual: str):
              ok = actual.startswith(expected)
              symbol = "OK   " if ok else "MISS "
              print(f"{symbol} {label:30s}  manifest={manifest}  expected_prefix={expected}  actual={actual}")
              if not ok:
                  msg = (
                      f"{label}: manifest `{manifest}` reports version "
                      f"`{actual}` but expected_prefix is `{expected}` "
                      f"(see docs/spec/release-versions.toml)."
                  )
                  if mode == "fail":
                      failures.append(msg)
                  else:
                      warnings.append(msg)

          for section_name, body in spec.items():
              if section_name == "meta" or not isinstance(body, dict):
                  continue
              # A section may have its own `manifest` key AND nested children
              # (e.g. `[python]` carries the VERSION file, while `[python.pyproject]`
              # carries pyproject.toml). Collect both.
              entries = []
              if "manifest" in body:
                  entries.append((section_name, body))
              for sub_name, sub_body in body.items():
                  if isinstance(sub_body, dict) and "manifest" in sub_body:
                      entries.append((f"{section_name}.{sub_name}", sub_body))

              for label, entry in entries:
                  manifest = entry["manifest"]
                  expected = entry.get("expected_prefix")
                  field = entry.get("field")
                  dynamic = entry.get("dynamic", False)

                  try:
                      if dynamic and manifest.endswith("pyproject.toml"):
                          if detect_pyproject_dynamic(manifest):
                              print(f"OK    {label:30s}  manifest={manifest}  (dynamic version)")
                          else:
                              msg = f"{label}: pyproject.toml expected `dynamic = ['version']`."
                              (failures if mode == "fail" else warnings).append(msg)
                          continue

                      if manifest == "VERSION":
                          actual = extract_version_file(manifest)
                      elif manifest.endswith(".csproj"):
                          actual = extract_csproj(manifest)
                      elif manifest.endswith("Cargo.toml"):
                          actual = extract_cargo_workspace(manifest)
                      elif manifest.endswith("package.json"):
                          actual = extract_package_json(manifest)
                      elif manifest.endswith("Package.swift"):
                          if not field:
                              raise ValueError(f"{label}: Package.swift entry needs `field` (version|g2pVersion)")
                          actual = extract_swift_let(manifest, field)
                      elif manifest.endswith("gradle.properties"):
                          if not field:
                              raise ValueError(f"{label}: gradle.properties entry needs `field`")
                          actual = extract_gradle_property(manifest, field)
                      else:
                          raise ValueError(f"{label}: unsupported manifest type: {manifest}")

                      if expected is None:
                          # No prefix means "ignore version, just verify file exists".
                          print(f"INFO  {label:30s}  manifest={manifest}  actual={actual}  (no expected_prefix)")
                      else:
                          emit(label, manifest, expected, actual)
                  except FileNotFoundError as e:
                      msg = f"{label}: manifest not found: {e}"
                      (failures if mode == "fail" else warnings).append(msg)
                  except Exception as e:
                      msg = f"{label}: extraction error: {e}"
                      (failures if mode == "fail" else warnings).append(msg)

          # ---------- Reporting --------------------------------------------------
          if warnings:
              print()
              print("---- Warnings (drift detected, mode=warn) ----")
              for w in warnings:
                  print(f"::warning::{w}")
          if failures:
              print()
              print("---- Failures (drift detected, mode=fail) ----")
              for f in failures:
                  print(f"::error::{f}")
              sys.exit(1)

          if not warnings and not failures:
              print()
              print("All pinned versions match their manifests.")
          else:
              print()
              print(f"Detected {len(warnings)} warning(s) — exiting 0 because mode=warn.")
          PY

      # -------------------------------------------------------- model-quality-gate
      - name: "model-quality-gate: check ONNX export contract"
        id: mq-onnx-export
        if: ${{ !cancelled() }}
        run: python scripts/check_onnx_export_contract.py

      - name: "model-quality-gate: model artifact verifier and published manifest regression tests"
        id: mq-artifact-tests
        if: ${{ !cancelled() }}
        run: pytest tests/scripts/test_model_artifact_tools.py tests/scripts/test_check_model_sha256_manifest.py -q --override-ini="addopts="

      - name: "model-quality-gate: install actual ONNX artifact validator dependencies"
        id: mq-install
        if: ${{ !cancelled() }}
        run: pip install onnx onnxruntime numpy

      - name: "model-quality-gate: execute artifact loading, warmup and negative output tests"
        id: mq-artifact-validation
        if: ${{ !cancelled() }}
        run: pytest tests/scripts/test_onnx_artifact_validation.py -q --override-ini="addopts="

      - name: "model-quality-gate: check phoneme set version contract"
        id: mq-phoneme-set
        if: ${{ !cancelled() }}
        run: python scripts/check_phoneme_set_version.py

      - name: "model-quality-gate: gate self-test (check_dictionary_versions)"
        id: mq-dictionary-tests
        if: ${{ !cancelled() }}
        run: pytest tests/scripts/test_check_dictionary_versions.py -q --override-ini="addopts="

      - name: "model-quality-gate: check dictionary versions"
        id: mq-dictionary
        if: ${{ !cancelled() }}
        run: python scripts/check_dictionary_versions.py --verbose

      - name: "model-quality-gate: gate self-test (check_ort_version_drift)"
        id: mq-ort-drift-tests
        if: ${{ !cancelled() }}
        run: pytest tests/scripts/test_check_ort_version_drift.py -q --override-ini="addopts="

      - name: "model-quality-gate: check ORT version drift"
        id: mq-ort-drift
        if: ${{ !cancelled() }}
        run: python scripts/check_ort_version_drift.py --verbose

      - name: "model-quality-gate: verify model checksums (manifest print)"
        id: mq-checksums
        if: ${{ !cancelled() }}
        run: python scripts/verify_model_checksums.py --print-manifest

      # -------------------------------------------------------- cli-help-docs-sync
      # Every flag listed in docs/guides/development/cli-usage.md must still be
      # advertised by `python -m piper_plus --help`. `--mode stale-only` blocks
      # only a flag that left `--help` while its markdown row survived: the
      # reference doc covers the C++ CLI, so a new Python flag missing from it
      # is reported but does not fail.
      - name: "cli-help-docs-sync: install piper-plus (python_run) for --help capture"
        id: cli-help-install
        if: ${{ !cancelled() }}
        run: |
          pip install --no-cache-dir uv
          uv pip install --system -e "src/python/g2p"
          uv pip install --system -e "src/python_run[cpu]"

      - name: "cli-help-docs-sync: capture `python -m piper_plus --help`"
        id: cli-help-capture
        if: ${{ !cancelled() }}
        run: |
          python -m piper_plus --help > piper_help.txt 2>&1 || true
          echo '--- captured help ---'
          cat piper_help.txt

      - name: "cli-help-docs-sync: CLI help / docs drift"
        id: cli-help-drift
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          python scripts/check_cli_help_drift.py \
            --help-file piper_help.txt \
            --docs docs/guides/development/cli-usage.md \
            --mode stale-only \
            --allow=--custom-dict \
            --allow=--gpu-device-id \
            --allow=--json-input \
            --allow=--language \
            --allow=--model-dir \
            --allow=--output-timing \
            --allow=--phoneme-silence \
            --allow=--quiet \
            --allow=--raw-phonemes \
            --allow=--streaming \
            --allow=--test-mode \
            --allow=--text \
            --allow=--timing-format \
            --allow=--use-cuda \
            2>&1 | tee drift_report.txt

      - name: "cli-help-docs-sync: upload drift report"
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: cli-help-drift-report
          path: |
            piper_help.txt
            drift_report.txt
          retention-days: 7

      - name: "cli-help-docs-sync: comment drift report on PR"
        if: ${{ !cancelled() && steps.cli-help-drift.outcome == 'failure' && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7.1.0
        with:
          script: |
            const fs = require('fs');
            let body = '## CLI Help / Docs Drift detected\n\n';
            body += 'The user-facing CLI doc references flags that `python -m piper_plus --help` ';
            body += 'no longer exposes. This usually means a flag was removed or renamed ';
            body += '(see v1.12.0 `--mb-istft` removal as a precedent) but the markdown ';
            body += 'flag-table row was not updated.\n\n';
            body += '<details><summary>Drift report</summary>\n\n```\n';
            try {
              body += fs.readFileSync('drift_report.txt', 'utf8');
            } catch (e) {
              body += '(drift report not captured)';
            }
            body += '\n```\n\n</details>\n\n';
            body += 'Fix: update `docs/guides/development/cli-usage.md` to remove or rename the ';
            body += 'stale row, or pass `--allow <flag>` in the workflow if intentional.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      # ------------------------------------------------------------------- report
      - name: Report every check
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          steps = json.loads(os.environ["STEPS"])
          mark = {"success": "pass", "failure": "FAIL", "skipped": "skipped", "cancelled": "cancelled"}
          lines = ["| check step | result |", "|---|---|"]
          failed = []
          for step_id, info in steps.items():
              outcome = info.get("outcome", "")
              lines.append(f"| `{step_id}` | {mark.get(outcome, outcome)} |")
              if outcome == "failure":
                  failed.append(step_id)
          head = f"## Lint and gates: {len(failed)} failed" if failed else "## Lint and gates: all passed"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(head + "\n\n" + "\n".join(lines) + "\n")
          print(head)
          for step_id in failed:
              print(f"::error::{step_id} failed")
          PY
