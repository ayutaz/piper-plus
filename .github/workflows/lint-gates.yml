name: Lint and gates

# Lints and repository gates that each finish in seconds, run as steps of one
# job. They used to be 23 workflows of one job each, and a pull request push
# started all of them at once: GitHub Free runs 20 jobs at a time for the
# whole account, so a few pushes in a row queued ubuntu jobs for over an hour
# (2026-10-25: 18 running, 559 waiting). One job pays for one runner, one
# checkout and one Python setup instead of 23.
#
# Every step runs on every pull request and every push to dev; none keeps the
# paths filter its workflow had. Each check takes seconds, and a gate whose
# trigger missed the file it guards was skipped exactly when it mattered
# (scripts/check_trigger_coverage.py). Checks that only make sense for a pull
# request (its diff, its labels) still run only there.
#
# Order: the scanners that read the whole working tree (codespell,
# markdownlint, ruff, gitleaks) run before anything writes into it (lychee's
# cache, the editable installs, the help capture).
#
# Reading a failure:
#   * every step is named "<check>: <what it does>" and runs with
#     `!cancelled()`, so one failing check does not hide the others;
#   * the last step writes each step's outcome to the job summary;
#   * re-running the job re-runs every check (about a minute in total).
#
# Former workflows: action-pin-gate, actionlint, changelog-format,
# cli-help-docs-sync, codespell, dependency-review, doc-examples-gate,
# forward-compat-fuzz, g2p-known-divergences, hadolint,
# inference-input-contract, link-check, markdownlint,
# migration-changelog-parity, migration-guide-lint, model-quality-gate,
# ort-version-sync, public-abi-snapshot, python-lint, readme-heading-tree-parity,
# rulesets, ruff-version-sync, secret-scan, test-threshold-relaxation,
# timing-monotonicity, version-consistency; and the pull-request run of
# action-sha-drift (its weekly issue and baseline update stay there). The pull-request title / body / commit message checks
# are in pr-metadata.yml, which also runs when the title or body is edited.

on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    # rulesets: the live rulesets must equal .github/rulesets/*.json, and a
    # change made in the settings UI turns this red. link-check: link rot.
    # secret-scan: the full history.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode_override:
        description: 'version-consistency: override `mode` (warn|fail) — empty to use toml setting'
        required: false
        type: string
      fuzz_seed:
        description: 'forward-compat-fuzz: random seed — empty for a random one'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # sticky / drift comments (cli-help-docs-sync, public-abi-snapshot),
      # dependency-review summary, gitleaks PR comments
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          # secret-scan scans the history; test-threshold-relaxation diffs
          # against the base commit.
          fetch-depth: 0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: "setup: pytest for the gate self-tests"
        run: python -m pip install --upgrade pip 'pytest>=9.1.1,<10'

      # ---------------------------------------------------------------- actionlint
      # Fails on a shellcheck finding; tests/scripts/test_actionlint_workflow.py
      # keeps these two steps pinned and in step with the pre-commit hook.
      - name: Install actionlint and shellcheck (pinned)
        id: actionlint-install
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lint"
          cd "$RUNNER_TEMP/lint"
          al="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$al" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${al}"
          echo "${ACTIONLINT_SHA256}  ${al}" | sha256sum -c -
          tar xzf "$al" actionlint
          sc="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLo "$sc" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${sc}"
          echo "${SHELLCHECK_SHA256}  ${sc}" | sha256sum -c -
          tar xJf "$sc"
          ./actionlint -version
          "./shellcheck-v${SHELLCHECK_VERSION}/shellcheck" --version
        shell: bash

      - name: Check workflow files
        id: actionlint
        if: ${{ !cancelled() }}
        run: |
          lint="$RUNNER_TEMP/lint"
          "$lint/actionlint" -color -shellcheck "$lint/shellcheck-v0.11.0/shellcheck"
        shell: bash

      # ----------------------------------------------------------------- codespell
      # The version must match `rev: v<VER>` of the codespell-project/codespell
      # entry in .pre-commit-config.yaml, so the local hook and CI use the same
      # dictionary. Files are listed explicitly with git ls-files: codespell's
      # `skip =` does not prune subtrees, and crawling the tree scanned the
      # multi-megabyte phoneme dictionaries and minified bundles (40-50 min runs
      # of false positives). Non-English test corpora and G2P sources are
      # excluded for the same reason.
      - name: "codespell: install"
        id: codespell-install
        if: ${{ !cancelled() }}
        run: pip install 'codespell==2.4.2'

      - name: "codespell: run"
        id: codespell
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          codespell --version
          git ls-files \
            '*.py' '*.pyi' '*.pyx' \
            '*.rs' \
            '*.go' \
            '*.cs' '*.csproj' '*.sln' \
            '*.kt' '*.kts' \
            '*.swift' \
            '*.md' '*.markdown' '*.mdx' \
            '*.yaml' '*.yml' \
            '*.toml' \
            '*.cfg' '*.ini' \
            '*.sh' '*.bash' '*.zsh' \
            '*Dockerfile*' 'Makefile' \
            '.codespellrc' '.codespell-ignore-words.txt' \
            '.editorconfig' '.gitignore' '.gitattributes' '.pre-commit-config.yaml' \
            ':!:README_DE.md' ':!:README_ES.md' ':!:README_FR.md' \
            ':!:README_KO.md' ':!:README_PT.md' ':!:README_ZH.md' \
            ':!:tools/benchmark/**' \
            ':!:test/models/**' \
            ':!:**/testdata/**' \
            ':!:**/phonemize/**' \
            ':!:**/Phonemize/**' \
            ':!:src/rust/piper-plus-g2p/**' \
            ':!:src/python/g2p/**' \
            ':!:**/test_swedish*' ':!:**/test_chinese*' ':!:**/test_french*' \
            ':!:**/test_spanish*' ':!:**/test_portuguese*' \
            ':!:**/SwedishPhonemizerTests.cs' ':!:**/ChinesePhonemizerTests.cs' \
            ':!:**/FrenchPhonemizerTests.cs' ':!:**/SpanishPhonemizerTests.cs' \
            ':!:**/PortuguesePhonemizerTests.cs' \
            ':!:src/python_run/piper_plus/sample_texts.py' \
            ':!:src/python_run/piper_plus/webui.py' \
            | xargs --no-run-if-empty codespell

      # -------------------------------------------------------------- markdownlint
      - name: "markdownlint: lint Markdown"
        id: markdownlint
        if: ${{ !cancelled() }}
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: |
            **/*.md
            !node_modules
            !**/node_modules/**
            !.git
            !.build/**
            !**/.venv/**
            !test/models/**
            !**/build/**
            !build-*/**
            !**/dist/**
            !**/target/**
          config: .markdownlint.yaml

      # ------------------------------------------------------------------ hadolint
      # --failure-threshold error: warnings are reported as info; only the rules
      # escalated by .hadolint.yaml's override.error (DL3000/DL3002/DL3025/
      # DL4000/DL4006) fail. Every Dockerfile is linted even after one fails.
      - name: "hadolint: lint every Dockerfile"
        id: hadolint
        if: ${{ !cancelled() }}
        run: |
          HADOLINT_VERSION=2.12.0
          curl -fsSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          chmod +x /tmp/hadolint
          /tmp/hadolint --version
          failed=()
          for dockerfile in \
            docker/cpp-dev/Dockerfile \
            docker/cpp-inference/Dockerfile \
            docker/cpp-inference/Dockerfile.distroless \
            docker/cpp-inference/Dockerfile.test \
            docker/python-inference/Dockerfile \
            docker/python-inference/Dockerfile.cpu \
            docker/python-inference/Dockerfile.cpu.distroless \
            docker/python-train/Dockerfile \
            docker/wyoming/Dockerfile \
            docker/webui/Dockerfile \
            docker/webui/Dockerfile.distroless
          do
            echo "::group::hadolint ${dockerfile}"
            if ! /tmp/hadolint --config .hadolint.yaml --failure-threshold error --no-color "$dockerfile"; then
              failed+=("$dockerfile")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            for f in "${failed[@]}"; do echo "::error file=${f}::hadolint found an error-level finding in ${f}"; done
            exit 1
          fi

      # ---------------------------------------------------------------- python-lint
      # One of the ruff pin sites that scripts/check_ruff_version_sync.py keeps
      # equal (with .pre-commit-config.yaml and pyproject.toml).
      - name: "python-lint: install Ruff"
        id: ruff-install
        if: ${{ !cancelled() }}
        run: pip install ruff==0.15.15

      - name: "python-lint: ruff check"
        id: ruff-check
        if: ${{ !cancelled() }}
        run: ruff check --output-format=github

      - name: "python-lint: ruff format --check"
        id: ruff-format
        if: ${{ !cancelled() }}
        run: ruff format --check

      # ---------------------------------------------------------------- secret-scan
      - name: "secret-scan: Gitleaks"
        id: gitleaks
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

      # On a pull request gitleaks-action scans only the base...head commits,
      # so a line that already exists on the base but reappears as new after a
      # squash merge goes unseen until the push to dev (PR #401). This runs the
      # same full working-tree scan as a push, before the merge. The binary is
      # checked against the release's checksums.txt.
      - name: "secret-scan: Gitleaks (full working-tree parity scan)"
        id: gitleaks-tree
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd /tmp
          curl -sSfL -o "${ARCHIVE}" "${BASE_URL}/${ARCHIVE}"
          curl -sSfL -o gitleaks_checksums.txt \
            "${BASE_URL}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${ARCHIVE}\$" gitleaks_checksums.txt \
            | sha256sum --check --strict
          tar -xzf "${ARCHIVE}" gitleaks
          cd "${GITHUB_WORKSPACE}"
          /tmp/gitleaks dir \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            .

      # ---------------------------------------------------------------- link-check
      - name: "link-check: restore lychee cache"
        id: lychee-cache
        if: ${{ !cancelled() }}
        uses: actions/cache@v4.3.0
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: "link-check: scan Markdown links"
        id: link-scan
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --no-progress
            --root-dir ${{ github.workspace }}
            './**/*.md'
          lycheeVersion: v0.24.2
          fail: false
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "link-check: retry failed full scans with lower concurrency"
        id: link-check
        if: ${{ !cancelled() && steps.link-scan.outcome == 'success' && steps.link-scan.outputs.exit_code != '0' }}
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for delay in 5 15; do
            sleep "$delay"
            if lychee --config .lychee.toml --no-progress --cache=false \
              --max-concurrency 1 --root-dir "$GITHUB_WORKSPACE" \
              --format markdown --output lychee/retry.md './**/*.md'; then
              cat lychee/retry.md >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          cat lychee/retry.md >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # ----------------------------------------------------------- action-pin-gate
      - name: "action-pin-gate: detection contract (test_check_action_pins.py)"
        id: action-pin-tests
        if: ${{ !cancelled() }}
        run: pytest tests/scripts/test_check_action_pins.py -v --override-ini="addopts="

      - name: "action-pin-gate: no new sliding-major-tag refs"
        id: action-pin
        if: ${{ !cancelled() }}
        run: python scripts/check_action_pins.py

      # ---------------------------------------------------------- action-sha-drift
      # Each 40-hex SHA pin must still exist on GitHub (not force-pushed away).
      # The weekly issue and the baseline update stay in action-sha-drift.yml.
      # The report goes to the job summary: a sticky comment on every pull
      # request would be noise now that this runs on all of them.
      - name: "action-sha-drift: every SHA pin still resolves on GitHub"
        id: action-sha-drift
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_action_sha_drift.py --report /tmp/action-sha-drift-report.md

      - name: "action-sha-drift: report to the job summary"
        if: ${{ !cancelled() && steps.action-sha-drift.outcome != 'skipped' }}
        run: |
          if [ -f /tmp/action-sha-drift-report.md ]; then
            cat /tmp/action-sha-drift-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "action-sha-drift: upload report"
        if: ${{ !cancelled() && steps.action-sha-drift.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: action-sha-drift-report-${{ github.run_id }}
          path: /tmp/action-sha-drift-report.md
          retention-days: 30
          if-no-files-found: warn

      # ---------------------------------------------------------- changelog-format
      - name: "changelog-format: validate CHANGELOG.md"
        id: changelog-format
        if: ${{ !cancelled() }}
        run: python scripts/check_changelog_format.py CHANGELOG.md

      # --------------------------------------------------------- dependency-review
      # Only a pull request has a dependency diff to review.
      - name: "dependency-review: review the pull request's dependency changes"
        id: dependency-review
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC,
            Unicode-DFS-2016, Unicode-3.0, CC0-1.0, MPL-2.0,
            Zlib, OpenSSL, BSL-1.0, 0BSD, Apache-2.0 WITH LLVM-exception
          allow-dependencies-licenses: >-
            pkg:pypi/audioop-lts,
            pkg:pypi/protobuf,
            pkg:pypi/regex,
            pkg:pypi/astroid,
            pkg:pypi/defusedxml,
            pkg:pypi/pillow,
            pkg:pypi/matplotlib,
            pkg:pypi/mypy,
            pkg:pypi/pylint,
            pkg:pypi/sphinx-rtd-theme,
            pkg:pypi/typing-extensions,
            pkg:pypi/llvmlite,
            pkg:pypi/soxr,
            pkg:npm/protobufjs,
            pkg:cargo/webpki-roots
          warn-only: false
          vulnerability-check: true

      # --------------------------------------------------------- doc-examples-gate
      # Syntax-validates (bash -n / py_compile) every docs block the audit JSON
      # classifies as executable; nothing is actually run. The report goes to
      # the job summary.
      - name: "doc-examples-gate: install markdown-it-py"
        id: doc-examples-install
        if: ${{ !cancelled() }}
        run: pip install markdown-it-py==4.0.0

      - name: "doc-examples-gate: audit snapshot matches the docs"
        id: doc-examples-audit
        if: ${{ !cancelled() }}
        run: |
          python scripts/check_doc_examples.py audit \
            --check-snapshot tests/fixtures/doc_examples_audit/audit.json \
            --generated-at 2026-05-19T00:00:00Z

      - name: "doc-examples-gate: syntax-validate executable docs blocks"
        id: doc-examples-execute
        if: ${{ !cancelled() }}
        run: |
          # Pre-seed both files so a script crash before they are written still
          # leaves a summary and an artifact.
          printf '%s\n' \
            "## doc-examples-gate report (informational)" \
            "" \
            "_The execute script did not complete successfully; this is a placeholder._" \
            > /tmp/doc-examples-sticky.md
          printf '%s\n' '{"results": [], "observed_total": 0, "expected_total": 0, "runner_languages": []}' \
            > /tmp/doc-examples-report.json
          python scripts/check_doc_examples.py execute \
            --report /tmp/doc-examples-report.json \
            --sticky-comment /tmp/doc-examples-sticky.md \
            --strict

      - name: "doc-examples-gate: report to the job summary"
        if: ${{ !cancelled() && steps.doc-examples-execute.outcome != 'skipped' }}
        run: cat /tmp/doc-examples-sticky.md >> "$GITHUB_STEP_SUMMARY"

      - name: "doc-examples-gate: upload report"
        if: ${{ !cancelled() && steps.doc-examples-execute.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: doc-examples-report-${{ github.run_id }}
          path: /tmp/doc-examples-report.json
          retention-days: 30
          if-no-files-found: warn

      # ------------------------------------------------------- forward-compat-fuzz
      # 1000 random future-schema inputs (schema_version > 2, unknown fields)
      # for the zh_en_loanword.json / pua.json loaders must not raise.
      - name: "forward-compat-fuzz: random future-schema inputs to the Python loaders"
        id: forward-compat-fuzz
        if: ${{ !cancelled() }}
        env:
          SEED: ${{ inputs.fuzz_seed }}
        run: |
          seed_args=()
          if [ -n "$SEED" ]; then seed_args=(--seed "$SEED"); fi
          python scripts/fuzz_forward_compat.py fuzz \
            --iterations 1000 "${seed_args[@]}" --output /tmp/fuzz.json

      - name: "forward-compat-fuzz: record dashboard entry"
        id: forward-compat-record
        if: ${{ !cancelled() && steps.forward-compat-fuzz.outcome == 'success' }}
        run: python scripts/fuzz_forward_compat.py record --input /tmp/fuzz.json

      - name: "forward-compat-fuzz: upload results"
        if: ${{ !cancelled() && steps.forward-compat-fuzz.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: forward-compat-fuzz-${{ github.run_id }}
          path: |
            /tmp/fuzz.json
            docs/ci-dashboard/data/forward-compat-fuzz.jsonl
          retention-days: 90

      # ----------------------------------------------------- g2p-known-divergences
      - name: "g2p-known-divergences: unit tests for the gate"
        id: g2p-known-divergences-tests
        if: ${{ !cancelled() }}
        run: python -m pytest tests/scripts/test_check_g2p_known_divergences.py -q -o addopts=

      - name: "g2p-known-divergences: known-difference lists are valid"
        id: g2p-known-divergences
        if: ${{ !cancelled() }}
        run: python scripts/check_g2p_known_divergences.py

      # -------------------------------------------------- inference-input-contract
      - name: "inference-input-contract: contract constants match the Python implementation"
        id: inference-input-contract
        if: ${{ !cancelled() }}
        run: python scripts/check_inference_input_contract.py

      # ------------------------------------------------ migration-changelog-parity
      - name: "migration-changelog-parity: CHANGELOG breaking items have migration coverage"
        id: migration-changelog-parity
        if: ${{ !cancelled() }}
        run: python scripts/check_migration_changelog_parity.py --verbose

      # ------------------------------------------------------ migration-guide-lint
      # The cross-reference lint runs when the pull request carries the
      # `breaking` label or adds a `### Breaking` heading to CHANGELOG.md, and on
      # a manual run.
      - name: "migration-guide-lint: detect breaking-change signal"
        id: migration-signal
        if: ${{ !cancelled() }}
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          has_label=false
          has_diff=false
          if [ -n "$LABELS" ]; then
            if echo "$LABELS" | tr ',' '\n' | grep -qx breaking; then
              has_label=true
            fi
          fi
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
            if git diff "$BASE_SHA"...HEAD -- CHANGELOG.md 2>/dev/null | grep -E "^\+### Breaking" >/dev/null; then
              has_diff=true
            fi
          fi
          echo "has_label=$has_label" >> "$GITHUB_OUTPUT"
          echo "has_diff=$has_diff" >> "$GITHUB_OUTPUT"
          echo "Signal: label=$has_label diff=$has_diff"

      - name: "migration-guide-lint: migration cross-ref lint"
        id: migration-guide-lint
        if: ${{ !cancelled() && (steps.migration-signal.outputs.has_label == 'true' || steps.migration-signal.outputs.has_diff == 'true' || github.event_name == 'workflow_dispatch') }}
        run: python scripts/check_migration_xref.py

      # ----------------------------------------------------------- ort-version-sync
      - name: "ort-version-sync: pin regex contract (test_check_ort_versions.py)"
        id: ort-version-sync-tests
        if: ${{ !cancelled() }}
        run: pytest scripts/test_check_ort_versions.py -v --override-ini="addopts="

      - name: "ort-version-sync: cmake / workflows ORT versions match"
        id: ort-version-sync
        if: ${{ !cancelled() }}
        run: python scripts/check_ort_versions.py --verbose

      # -------------------------------------------------------- public-abi-snapshot
      - name: "public-abi-snapshot: C ABI diff (bootstrap, current = baseline)"
        id: abi-c
        if: ${{ !cancelled() }}
        run: |
          python scripts/diff_public_abi.py diff \
            --surface c \
            --baseline tests/fixtures/public-abi/c.json \
            --current  tests/fixtures/public-abi/c.json \
            --output /tmp/c-abi-diff.md

      - name: "public-abi-snapshot: Swift ABI diff (bootstrap)"
        id: abi-swift
        if: ${{ !cancelled() }}
        run: |
          python scripts/diff_public_abi.py diff \
            --surface swift \
            --baseline tests/fixtures/public-abi/swift.json \
            --current  tests/fixtures/public-abi/swift.json \
            --output /tmp/swift-abi-diff.md

      - name: "public-abi-snapshot: Kotlin ABI diff (bootstrap)"
        id: abi-kotlin
        if: ${{ !cancelled() }}
        run: |
          python scripts/diff_public_abi.py diff \
            --surface kotlin \
            --baseline tests/fixtures/public-abi/kotlin.json \
            --current  tests/fixtures/public-abi/kotlin.json \
            --output /tmp/kotlin-abi-diff.md

      - name: "public-abi-snapshot: post sticky comment"
        if: ${{ !cancelled() && steps.abi-c.outcome == 'success' && github.event_name == 'pull_request' }}
