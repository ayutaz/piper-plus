name: "Rulesets"

# .github/rulesets/*.json is the source of the repository rulesets: what dev
# requires before a merge, and that release tags cannot be deleted or moved.
#
# - pull_request: the files must keep those requirements
#   (scripts/check_rulesets.py --validate) and the script's tests must pass.
#   Live settings are not compared here: a PR that changes a file differs
#   from the live settings until an admin applies it after the merge.
# - push to dev / schedule / workflow_dispatch: the live rulesets must equal
#   the files, and every live tag must be covered by the tag ruleset
#   (--check). A change made in the settings UI turns this red.
#
# Applying is done by an admin: `python scripts/check_rulesets.py --apply`.

on:
  push:
    branches: [dev]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Ruleset files keep the merge requirements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Script tests
        run: python -m pytest tests/scripts/test_check_rulesets.py -q -o addopts=
      - name: Validate .github/rulesets
        run: python scripts/check_rulesets.py --validate

  live:
    name: Live rulesets equal the files
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
      - name: Compare with the live rulesets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_rulesets.py --check --repo "$GITHUB_REPOSITORY"
