name: sbom

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Cargo.toml'
      - 'src/rust/**/Cargo.toml'
      - 'src/csharp/**/*.csproj'
      - 'go.mod'
      - 'src/wasm/**/package.json'
      - 'android/**/build.gradle.kts'
      - '.github/workflows/sbom.yml'
  push:
    branches: [dev, main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # 1) Repository-level SBOM (all source files, polyglot project)
  # ----------------------------------------------------------------
  syft-repo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom-repo.spdx.json
          artifact-name: sbom-repo-spdx

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-repo.cyclonedx.json
          artifact-name: sbom-repo-cyclonedx

  # ----------------------------------------------------------------
  # 2) Python package SBOM (piper-plus runtime + g2p)
  # ----------------------------------------------------------------
  # Built from uv.lock (the versions a user gets), not from the runner's
  # Python environment: `cyclonedx-py environment` on a bare runner only
  # listed cyclonedx-py's own dependencies.
  cyclonedx-python:
    runs-on: ubuntu-24.04
    env:
      CYCLONEDX_BOM_VERSION: 7.5.0
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: astral-sh/setup-uv@v6.8.0
        with:
          python-version: '3.13'

      - name: Generate Python SBOMs from uv.lock
        run: |
          set -euo pipefail
          sbom() {
            # $1 = package, $2 = its pyproject.toml, $3 = output, rest = extras
            local pkg=$1 pyproject=$2 out=$3
            shift 3
            uv export --format requirements.txt --package "$pkg" --frozen \
              --no-dev --no-hashes --no-emit-workspace "$@" -o "$RUNNER_TEMP/$pkg.txt"
            uvx --from "cyclonedx-bom==$CYCLONEDX_BOM_VERSION" cyclonedx-py requirements \
              --of JSON --pyproject "$pyproject" -o "$out" "$RUNNER_TEMP/$pkg.txt"
            jq -e --arg pkg "$pkg" \
              '.metadata.component.name == $pkg and (.components | length) > 0' "$out" > /dev/null
            echo "$out: $(jq '.components | length' "$out") components"
          }
          # cpu and gpu are mutually exclusive extras; cpu is the default install.
          sbom piper-plus src/python_run/pyproject.toml sbom-python-runtime.cyclonedx.json --extra cpu --extra http
          sbom piper-plus-g2p src/python/g2p/pyproject.toml sbom-python-g2p.cyclonedx.json --extra all

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sbom-python
          path: |
            sbom-python-runtime.cyclonedx.json
            sbom-python-g2p.cyclonedx.json
          retention-days: 30
          if-no-files-found: error

  # ----------------------------------------------------------------
  # 3) Rust workspace SBOM (cargo-cyclonedx)
  # ----------------------------------------------------------------
  cyclonedx-rust:
    runs-on: ubuntu-24.04
    env:
      CARGO_CYCLONEDX_VERSION: 0.5.9
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked

      - name: Generate Rust SBOM
        # cargo-cyclonedx writes one `<crate dir>/<package>.cdx.json` per
        # workspace member (piper-core/piper-plus.cdx.json, ...). The upload
        # used to look for `sbom-rust*.json` and uploaded nothing.
        working-directory: src/rust
        run: |
          set -euo pipefail
          cargo cyclonedx --format json
          for f in */*.cdx.json; do
            jq -e '(.components | length) > 0' "$f" > /dev/null
            echo "$f: $(jq '.components | length' "$f") components"
          done

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sbom-rust
          path: src/rust/*/*.cdx.json
          retention-days: 30
          if-no-files-found: error

  # ----------------------------------------------------------------
  # 4) Go module SBOM (cyclonedx-gomod)
  # ----------------------------------------------------------------
  cyclonedx-go:
    runs-on: ubuntu-24.04
    env:
      CYCLONEDX_GOMOD_VERSION: v1.12.0
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: src/go/go.mod
          cache-dependency-path: src/go/go.sum

      - name: Install cyclonedx-gomod
        run: go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@$CYCLONEDX_GOMOD_VERSION"

      - name: Generate Go SBOM
        # `app` mode は main package が ./ 直下にある前提だが、piper-plus は
        # src/go/cmd/piper-plus/ 配下に main があり src/go 直下には Go file
        # が無い ('no Go files in /home/runner/.../src/go' エラー)。
        # `mod` mode で go.mod 全体の dependency tree を SBOM 化する。
        working-directory: src/go
        run: |
          set -euo pipefail
          cyclonedx-gomod mod -json -output ../../sbom-go.cyclonedx.json
          jq -e '(.components | length) > 0' ../../sbom-go.cyclonedx.json > /dev/null

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sbom-go
          path: sbom-go.cyclonedx.json
          retention-days: 30
          if-no-files-found: error

  # ----------------------------------------------------------------
  # 5) C# project SBOM (CycloneDX-DotNet)
  # ----------------------------------------------------------------
  cyclonedx-dotnet:
    runs-on: ubuntu-24.04
    env:
      CYCLONEDX_DOTNET_VERSION: 6.3.1
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Install CycloneDX.DotNet tool
        run: dotnet tool install --global CycloneDX --version "$CYCLONEDX_DOTNET_VERSION"

      - name: Generate C# SBOM
        run: |
          set -euo pipefail
          dotnet CycloneDX src/csharp/PiperPlus.sln \
            --json --filename sbom-csharp.cyclonedx.json --output .
          jq -e '(.components | length) > 0' sbom-csharp.cyclonedx.json > /dev/null

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sbom-csharp
          path: sbom-csharp.cyclonedx.json
          retention-days: 30
          if-no-files-found: error

  # ----------------------------------------------------------------
  # 6) NPM package SBOM (cyclonedx-npm for both g2p + openjtalk-web)
  # ----------------------------------------------------------------
  # Both steps ran without node_modules and failed (exit 254, "missing
  # evidence" / "npm-ls exited with errors") behind `continue-on-error`.
  # They now read the dependency tree from a package lock instead.
  cyclonedx-npm:
    runs-on: ubuntu-24.04
    env:
      CYCLONEDX_NPM_VERSION: 6.0.1
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '24'

      - name: Install @cyclonedx/cyclonedx-npm
        run: npm install -g "@cyclonedx/cyclonedx-npm@$CYCLONEDX_NPM_VERSION"

      - name: Generate NPM SBOM (g2p)
        # g2p commits no package-lock.json (the lockfile-size gate keeps it
        # out), so resolve one here without installing anything.
        working-directory: src/wasm/g2p
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cyclonedx-npm --package-lock-only --output-file ../../../sbom-npm-g2p.cyclonedx.json
          jq -e '(.components | length) > 0' ../../../sbom-npm-g2p.cyclonedx.json > /dev/null

      - name: Generate NPM SBOM (openjtalk-web)
        working-directory: src/wasm/openjtalk-web
        run: |
          set -euo pipefail
          cyclonedx-npm --package-lock-only --output-file ../../../sbom-npm-openjtalk.cyclonedx.json
          jq -e '(.components | length) > 0' ../../../sbom-npm-openjtalk.cyclonedx.json > /dev/null

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sbom-npm
          path: |
            sbom-npm-g2p.cyclonedx.json
            sbom-npm-openjtalk.cyclonedx.json
          retention-days: 30
          if-no-files-found: error

  # ----------------------------------------------------------------
  # 7) Attest and preserve release SBOMs separately from the binary inventory.
  # Root release payloads/checksums/signatures are managed by the release
  # publisher. This read-only workflow must not create/publish that release.
  # ----------------------------------------------------------------
  aggregate:
    needs: [syft-repo, cyclonedx-python, cyclonedx-rust, cyclonedx-go, cyclonedx-dotnet, cyclonedx-npm]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v6.0.0
        with:
          path: ./sbom-artifacts

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@v3.2.0
        with:
          subject-path: ./sbom-artifacts/**/*.json

      - name: Preserve attested release SBOMs
        uses: actions/upload-artifact@v7.0.0
        with:
          name: release-sbom-${{ github.ref_name }}
          path: ./sbom-artifacts/**/*.json
          if-no-files-found: error
