name: model-quality-gate

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/python/piper_train/export*.py'
      - 'src/python/piper_train/speaker_encoder/export_encoder.py'
      - 'src/python/g2p/piper_plus_g2p/data/pua.json'
      - 'src/python_run/setup.py'
      - 'src/python_run/pyproject.toml'
      - 'src/rust/piper-core/Cargo.toml'
      - 'src/rust/piper-plus-g2p/Cargo.toml'
      # check_ort_version_drift.py が doc 表と突き合わせる実 pin サイト。
      # 特に `src/go/go.mod` は必須: dependabot.yml の gomod ecosystem が
      # `onnxruntime_go` を bump する PR は、 ここに無いと本 gate を起動せずに
      # merge され、 その push で初めて dev が赤くなる。
      - 'src/python/pyproject.toml'
      - 'src/python_run/requirements.txt'
      - 'src/python_run/requirements_gpu.txt'
      - 'src/go/go.mod'
      - 'src/csharp/PiperPlus.Core/PiperPlus.Core.csproj'
      - 'src/wasm/openjtalk-web/package.json'
      - 'tests/scripts/test_check_ort_version_drift.py'
      - 'tests/scripts/test_check_dictionary_versions.py'
      - 'docs/spec/onnx-export-contract.toml'
      - 'docs/spec/model-sha256-manifest.toml'
      - 'docs/spec/dictionary-versions.toml'
      - 'docs/spec/phoneme-set-version.toml'
      - 'docs/reference/ort-versions.md'
      - 'scripts/check_*.py'
      - 'scripts/verify_*.py'
      - '.github/workflows/model-quality-gate.yml'
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    # Wave 6-1.1: contract gate は通常 3-5 min だが、 大量の check_*.py が
    # serial に走るため hung script が cost 暴走する risk あり。 15 min fail-fast。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Install tomli (Python 3.10 fallback only)
        run: pip install tomli  # Python 3.11+ has tomllib built-in but harmless

      # `tests/scripts` は pytest.ini の testpaths 外なので、 self-test step は
      # パス明示 + `--override-ini` が要る (ort-version-sync.yml と同じ形)。
      - name: Install pytest (gate self-test)
        run: pip install pytest

      - name: Check ONNX export contract
        run: python scripts/check_onnx_export_contract.py

      - name: Check phoneme set version contract
        run: python scripts/check_phoneme_set_version.py

      # `continue-on-error` は外した。 元のコメント (「spec text scan は false
      # negative あり」) は当時の実装 — spec 全文への substring 一致 — を指した
      # ものだが、 その実装は 4 target 全てがマッチせず `[OK]` を出して exit 0
      # する状態になっていた (setup.py が Issue #418 で pin を失い、 Rust の
      # pattern も実際の `{ version = "..." }` 形式に一致しなかった)。
      # 現在は spec を TOML として読み、 各 pin を自分の宣言値と比較する。
      - name: Gate self-test (check_dictionary_versions)
        run: pytest tests/scripts/test_check_dictionary_versions.py -q --override-ini="addopts="

      - name: Check dictionary versions
        run: python scripts/check_dictionary_versions.py --verbose

      # `continue-on-error` は付けない。 この step は #401 (`692cb3f6`) で
      # workflow が生まれた時点から `continue-on-error: true` を持っており、
      # 一度も job を落としたことがなかった。 その裏で doc の Python 2 行が
      # `>=1.20.0` のまま実 pin `>=1.26.0` と乖離していた。
      - name: Gate self-test (check_ort_version_drift)
        run: pytest tests/scripts/test_check_ort_version_drift.py -q --override-ini="addopts="

      - name: Check ORT version drift
        run: python scripts/check_ort_version_drift.py --verbose

      - name: Verify model checksums (manifest print)
        run: python scripts/verify_model_checksums.py --print-manifest
        continue-on-error: true
