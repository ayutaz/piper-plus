name: Test ARM64 TTS

# 最小権限 (least privilege): test / report のみ、 書込不要。
permissions:
  contents: read

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.dockerignore'
      - '.github/workflows/dev-build-all.yml'
      - '.github/workflows/_build-linux-arm64.yml'
      - 'scripts/check_arm64_runtime.py'
      - 'tests/scripts/test_check_arm64_runtime.py'
      - 'Dockerfile'
      - '.github/workflows/test-arm64-tts.yml'
      - 'scripts/check_arm64_archive.py'
      - 'tests/scripts/test_check_arm64_archive.py'
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.dockerignore'
      - '.github/workflows/dev-build-all.yml'
      - '.github/workflows/_build-linux-arm64.yml'
      - 'scripts/check_arm64_runtime.py'
      - 'tests/scripts/test_check_arm64_runtime.py'
      - 'Dockerfile'
      - '.github/workflows/test-arm64-tts.yml'
      - 'scripts/check_arm64_archive.py'
      - 'tests/scripts/test_check_arm64_archive.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    uses: ./.github/workflows/_build-linux-arm64.yml
