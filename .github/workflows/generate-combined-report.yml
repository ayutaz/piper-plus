name: Generate Combined Performance Report

# 最小権限 (least privilege): test / report のみ、 書込不要。
permissions:
  contents: read

# Only Test Japanese TTS uploads performance data
# (japanese-tts-combined-summary-run<N>). Test Multilingual TTS uploads
# audio only, so it used to trigger this workflow for nothing: both
# downloads looked for a non-existent `*-combined-summary-*` name in the
# triggering run and were continue-on-error, so every run (20 of 20 in
# 2026-10) reported "no performance data" and stayed green.
on:
  workflow_run:
    workflows: ["Test Japanese TTS"]
    types:
      - completed

jobs:
  generate_combined_report:
    name: Generate Combined Performance Report
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # download artifacts of the triggering run

    steps:
      - uses: actions/checkout@v6.1.0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Download Japanese TTS results
        uses: actions/download-artifact@v6.0.0
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: japanese-tts-combined-summary-run*
          path: japanese-results

      - name: Require performance data
        run: |
          count=$(find japanese-results -name '*.json' -type f 2>/dev/null | wc -l)
          echo "performance JSON files: ${count}"
          if [ "$count" -eq 0 ]; then
            echo "::error::No performance JSON in japanese-tts-combined-summary-run* of run ${{ github.event.workflow_run.id }}"
            exit 1
          fi

      - name: Combine all results
        run: |
          echo "Combining all test results..."

          # Create combined directory
          mkdir -p all-combined-results/performance

          find japanese-results -name "*.json" -print0 | xargs -0 -r cp -t all-combined-results/performance/

          # List all collected files
          echo "Collected performance files:"
          find all-combined-results -name "*.json" -type f

      - name: Generate final combined summary
        run: |
          python scripts/generate_job_summary.py --results-dir all-combined-results

      - name: Upload final combined report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: combined-performance-report-${{ github.run_id }}
          path: |
            all-combined-results/
          retention-days: 30
