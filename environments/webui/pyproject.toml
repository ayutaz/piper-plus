[project]
name = "piper-plus-webui-environment"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "piper-plus[cpu,http]",
    "gradio==6.30.0",
    "numpy>=1.26.4,<2.3",
]

[tool.uv]
package = false
# gradio caps `pillow<13.0`; Pillow 13.0.0 fixes 5 CRITICAL advisories. Same as
# src/python_run/overrides_webui.txt (tests/scripts/test_webui_pillow_override.py).
override-dependencies = ["pillow>=13.0.0"]

[tool.uv.sources]
piper-plus = { path = "../../src/python_run", editable = true }

# This environment intentionally has its own lock: Gradio requires HF Hub 1.x,
# while the training workspace's Transformers 4.x requires HF Hub <1.
[tool.uv.workspace]
members = []
