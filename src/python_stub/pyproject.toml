[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-tts-plus"
dynamic = ["version"]
description = "This package has been renamed to piper-plus. Install piper-plus instead."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "yousan", email = "rabbitcats77@gmail.com"},
]
# 2.0.2 is the first piper-plus with the cpu / gpu provider extras relayed below.
dependencies = ["piper-plus>=2.0.2"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["piper", "tts", "deprecated", "renamed"]

[project.optional-dependencies]
# Relay piper-plus's extras. Since piper-plus 2.0.2 its base dependencies carry
# no ONNX Runtime: choose exactly one provider extra (cpu or gpu). Keep the base
# dependency provider-free so [gpu] does not also pull the CPU wheel.
cpu = ["piper-plus[cpu]"]
gpu = ["piper-plus[gpu]"]
http = ["piper-plus[http]"]

[project.urls]
Homepage = "https://github.com/ayutaz/piper-plus"
"New Package" = "https://pypi.org/project/piper-plus/"

[tool.setuptools.dynamic]
version = {file = "VERSION"}
