# Trivy の検知抑止 (trivy-action の `trivyignores` 経由で読ませる)。
#
# 運用ルール (`.github/workflows/security-audit.yml` の `--ignore-vuln` と同型):
#   一 advisory = 一エントリ + `statement` に理由 + 解除条件 + tracking issue。
#   `purls` は必ず **版まで含めて** 書く。 `id` だけで抑止すると、 将来
#   実体のあるパッケージが同 CVE に該当したときにそれも隠れてしまう。
#   `expired_at` を必ず設定し、 放置されても自動で抑止が切れるようにする。
#   この 3 点は tests/scripts/test_runtime_images_ship_no_pip.py が検査する。
#
# ── 現在抑止しているもの ──
#
# なし。 抑止が要らないときも、 workflow の `trivyignores:` が読むので
# ファイルは残し、 `vulnerabilities: []` にしておく。
#
# ── 過去に抑止していたもの (#748、 2026-10-24 に解除) ──
#
# setuptools 70.3.0 (CVE-2025-47273 / CVE-2026-59890) と msgpack 1.1.2
# (GHSA-6v7p-g79w-8964) を「FilePath も license も空で、 イメージ内に実体が
# 無い」として抑止していた。 この見立ては誤りだった。 出どころは pip 26.x が
# 同梱する CycloneDX SBOM `pip/_vendor/bom.cdx.json` で、 pip が vendor して
# いる msgpack 1.1.2 / setuptools 70.3.0 (pkg_resources) / urllib3 2.7.0 などが
# 載っている。 Trivy はこの SBOM を読んでパッケージとして報告するため、
# `METADATA` 由来の項目と違って FilePath と license が付かない。 コード自体は
# pip の中に実在する。 `pip/_vendor/vendor.txt` を消しても結果は変わらず、
# `bom.cdx.json` を消すと全部消える (Trivy 0.67.2 / 0.76.1 で確認)。
#
# 対策として、 実行時に pip を使わない runtime image から pip を削除した
# (各 Dockerfile の `pip uninstall` の手順と、 そのビルド時検査)。 同じ版を
# ここで再び抑止しないことも上記テストが検査する。 詳細:
# docs/design/trivy-pip-vendor-findings-2026-10-24.md

vulnerabilities: []
