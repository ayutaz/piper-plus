# Custom dictionary JSON mirror declarations.
#
# Source of truth: data/dictionaries/<name>.json
# Mirror:          src/wasm/openjtalk-web/assets/<name>.json
#
# Consumed by scripts/check_dictionary_consistency.py (thin wrapper around
# scripts/_mirror_check.py). When you add a new dictionary distributed in
# additional runtimes, append a [[groups]] entry — no Python edit needed.

[meta]
forward_compat_policy = "strict"

schema_version = 1

[[groups]]
name = "default_common dictionary"
canonical = "data/dictionaries/default_common_dict.json"
mirrors = ["src/wasm/openjtalk-web/assets/default_common_dict.json"]
notes = "WASM mirror was 319 lines behind in 2026-05 (PR #447 discovered drift)."

[[groups]]
name = "default_tech dictionary"
canonical = "data/dictionaries/default_tech_dict.json"
mirrors = ["src/wasm/openjtalk-web/assets/default_tech_dict.json"]

[[groups]]
name = "additional_tech dictionary"
canonical = "data/dictionaries/additional_tech_dict.json"
mirrors = ["src/wasm/openjtalk-web/assets/additional_tech_dict.json"]

[[groups]]
name = "cmudict dictionary"
canonical = "src/rust/piper-plus-g2p/data/cmudict_data.json"
mirrors = [
  "src/wasm/g2p/data/cmudict_data.json",
  "test/models/cmudict_data.json",
]
notes = "src/wasm/g2p/data/ ships in the @piper-plus/g2p npm package (Issue #828)."

[[groups]]
name = "pinyin_single dictionary"
canonical = "src/rust/piper-plus-g2p/data/pinyin_single.json"
mirrors = [
  "src/wasm/openjtalk-web/assets/pinyin_single.json",
  "src/wasm/g2p/data/pinyin_single.json",
  "test/models/pinyin_single.json",
]
notes = "Generated by scripts/build_pinyin_dicts.py (numeric tones). Tone-marked data parsed as tone 5 in every runtime."

[[groups]]
name = "pinyin_phrases dictionary"
canonical = "src/rust/piper-plus-g2p/data/pinyin_phrases.json"
mirrors = [
  "src/wasm/openjtalk-web/assets/pinyin_phrases.json",
  "src/wasm/g2p/data/pinyin_phrases.json",
  "test/models/pinyin_phrases.json",
]
notes = "Generated by scripts/build_pinyin_dicts.py (numeric tones). src/wasm/g2p/data/ ships in the @piper-plus/g2p npm package (Issue #829)."
