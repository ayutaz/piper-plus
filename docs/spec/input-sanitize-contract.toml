# Input sanitizing contract: control characters are stripped before phonemizing.
#
# Gate: scripts/check_input_sanitize_contract.py (pre-commit hook
# `input-sanitize-contract`, lint-gates step of the same name).
# Shared cases: tests/fixtures/g2p/input_sanitize_cases.json. Every runtime's
# consumer test reads that file (or its mirror), so one edit there re-tests
# every runtime.
#
# Why: #934 (2026-11) added C1 stripping to the Python G2P and said it matched
# Rust's `validate_input`. It did not. The Python helper ran for ja / en / sv
# only, `validate_input` had no caller, and no other runtime stripped
# anything. A NUL inside "hola" split the word in two for es / fr / pt.
#
# Status per runtime: `enforced` only. The consumer tests exist and read the
# fixture, and every entry point calls the stripping function; the gate
# checks both. A new runtime gets a [[runtime]] table and a [coverage] row
# (the gate fails without the row).

schema_version = 1

[meta]
forward_compat_policy = "strict"

[rule]
# Unicode general category Cc: C0 (U+0000-001F), DEL (U+007F), C1
# (U+0080-009F). Format characters (Cf: U+200D, U+FEFF), separators (Zl:
# U+2028), NBSP and astral characters are kept. A UTF-16 runtime decides per
# code point, never per surrogate half.
strip_category = "Cc"
# Sentence splitting and SSML rely on these.
keep = ["\n", "\t", "\r"]
# The other Cc in Unicode White_Space (VT, FF, NEL) separate words: Word
# writes VT for a manual line break, PDF text has FF. Deleting them joined the
# words around them ("hola\fadiós" read as one word), so they become U+0020.
# U+001C-001F are removed: Python's str.isspace counts them, but they are not
# White_Space, and Rust / Go / C# do not treat them as spaces.
to_space = ["\u000B", "\u000C", "\u0085"]
# Stripping is idempotent, so a text that passes two layers (a TTS runtime
# and the G2P library under it) reads the same as one that passes one.
idempotent = true

[where]
# (a) A G2P library strips at every public per-language phonemizer entry.
g2p_library = "every public per-language phonemizer entry point"
# (b) A TTS runtime also strips first, before SSML detection, the [[ ]]
#     inline phoneme notation, custom dictionaries and sentence splitting.
tts_runtime = "first thing, before SSML detection, [[ ]] notation, custom dictionaries and sentence splitting"

[empty_result]
# A text that is only control characters reads like an empty text.
python_phonemize = "[]"
python_phonemize_with_prosody = "([], [])"

[length_limits]
# Recorded, not part of the contract: each runtime keeps its current limit.
python-g2p = "10000 characters (ValueError) in ja and en, and in sv phonemize, as before: they call _sanitize_input, which adds the limit. The other entry points call _strip_control_chars and have none, as before (PiperPlus.synthesize, infer_onnx and /api/phoneme-timing pass whole texts)"
python-http = "1 MB in bytes (HTTP 413)"
cpp-c-api = "1 MB in bytes (OpenJTalk input)"
rust-g2p = "none (piper-core passes the whole text, a limit would reject texts read today)"
others = "none"

[fixture]
canonical = "tests/fixtures/g2p/input_sanitize_cases.json"
# Packages published on their own carry a copy.
mirrors = [
  "src/rust/piper-plus-g2p/tests/fixtures/input_sanitize_cases.json",
]
# Every language here needs a word in word_cases. A new language without one
# fails the gate (and the Python contract test, which reads the registry).
languages = ["ja", "en", "zh", "ko", "es", "fr", "pt", "pt-PT", "sv", "multilingual"]

# ---------------------------------------------------------------- runtimes

[[runtime]]
name = "python-g2p"
status = "enforced"
function = "Phonemizer._strip_control_chars"
consumer_tests = ["src/python/g2p/tests/test_input_contract.py"]
entry_points = [
  {file = "src/python/g2p/piper_plus_g2p/japanese.py", calls = "_sanitize_input"},
  {file = "src/python/g2p/piper_plus_g2p/english.py", calls = "_sanitize_input"},
  {file = "src/python/g2p/piper_plus_g2p/chinese.py", calls = "_strip_control_chars"},
  {file = "src/python/g2p/piper_plus_g2p/korean.py", calls = "_strip_control_chars"},
  {file = "src/python/g2p/piper_plus_g2p/spanish.py", calls = "_strip_control_chars"},
  {file = "src/python/g2p/piper_plus_g2p/french.py", calls = "_strip_control_chars"},
  {file = "src/python/g2p/piper_plus_g2p/portuguese.py", calls = "_strip_control_chars"},
  {file = "src/python/g2p/piper_plus_g2p/swedish.py", calls = "_strip_control_chars"},
  {file = "src/python/g2p/piper_plus_g2p/multilingual.py", calls = "_strip_control_chars"},
]
notes = "Also the path of src/python_run/piper_plus/api/api.py (PiperPlus), which calls phonemize_with_prosody directly: its text is stripped from this change on."

[[runtime]]
name = "rust-g2p"
status = "enforced"
function = "phonemizer::strip_control_chars"
consumer_tests = ["src/rust/piper-plus-g2p/tests/input_sanitize.rs"]
entry_points = [
  {file = "src/rust/piper-plus-g2p/src/japanese.rs", calls = "strip_control_chars"},
  {file = "src/rust/piper-plus-g2p/src/english.rs", calls = "strip_control_chars"},
  {file = "src/rust/piper-plus-g2p/src/chinese.rs", calls = "strip_control_chars"},
  {file = "src/rust/piper-plus-g2p/src/korean.rs", calls = "strip_control_chars"},
  {file = "src/rust/piper-plus-g2p/src/spanish.rs", calls = "strip_control_chars"},
  {file = "src/rust/piper-plus-g2p/src/french.rs", calls = "strip_control_chars"},
  {file = "src/rust/piper-plus-g2p/src/portuguese.rs", calls = "strip_control_chars"},
  {file = "src/rust/piper-plus-g2p/src/swedish.rs", calls = "strip_control_chars"},
  {file = "src/rust/piper-plus-g2p/src/multilingual.rs", calls = "strip_control_chars"},
]
notes = "Also covers piper-plus (piper-core), the Rust WASM path of npm piper-plus and the Swift G2P (Rust FFI, which also strips in its wrapper: swift-g2p), which call these phonemizers. Not Kotlin: its AAR wraps the C++ library."

[[runtime]]
name = "python-runtime"
status = "enforced"
function = "piper_plus.text_sanitize.strip_control_chars"
consumer_tests = ["src/python_run/tests/test_input_sanitize_contract.py"]
entry_points = [
  # PiperVoice.phonemize and synthesize_stream_raw; synthesize and
  # synthesize_with_timing go through them. The CLI, the HTTP server and the
  # WebUI call these methods.
  {file = "src/python_run/piper_plus/voice.py", calls = "strip_control_chars"},
  {file = "src/python_run/piper_plus/phonemize/multilingual.py", calls = "strip_control_chars"},
  # PiperPlus.synthesize and synthesize_stream (which splits sentences before
  # its G2P strips).
  {file = "src/python_run/piper_plus/api/api.py", calls = "strip_control_chars"},
]

[[runtime]]
name = "go"
status = "enforced"
function = "phonemize.StripControlChars"
consumer_tests = [
  "src/go/phonemize/input_sanitize_test.go",
  "src/go/piperplus/input_sanitize_test.go",
]
entry_points = [
  # Every PhonemizeWithProsody / PhonemizeWithLanguage of the phonemize
  # module (a G2P library published on its own). The consumer test also
  # parses the package and fails for a method that does not strip.
  {file = "src/go/phonemize/japanese.go", calls = "StripControlChars"},
  {file = "src/go/phonemize/english.go", calls = "StripControlChars"},
  {file = "src/go/phonemize/chinese.go", calls = "StripControlChars"},
  {file = "src/go/phonemize/chinese_loanword.go", calls = "StripControlChars"},
  {file = "src/go/phonemize/korean.go", calls = "StripControlChars"},
  {file = "src/go/phonemize/spanish.go", calls = "StripControlChars"},
  {file = "src/go/phonemize/french.go", calls = "StripControlChars"},
  {file = "src/go/phonemize/portuguese.go", calls = "StripControlChars"},
  {file = "src/go/phonemize/swedish.go", calls = "StripControlChars"},
  {file = "src/go/phonemize/dict.go", calls = "StripControlChars"},
  {file = "src/go/phonemize/multilingual.go", calls = "StripControlChars"},
  # Voice.Synthesize (before SSML detection) and prepareSynthesisRequest
  # (before the text dictionary and the short-text check).
  {file = "src/go/piperplus/synthesize.go", calls = "StripControlChars"},
  # Voice.SynthesizeStream, before sentence splitting.
  {file = "src/go/piperplus/streaming.go", calls = "StripControlChars"},
]
notes = "Also the Go CLI (cmd/piper-plus), which calls Voice. src/go/piperplus/input_sanitize_integration_test.go (build tag integration, go-ci integration-test job) compares the audio of a real model for the same cases."

[[runtime]]
name = "csharp"
status = "enforced"
function = "PiperPlus.Core.Phonemize.TextSanitizer.StripControlChars"
consumer_tests = [
  "src/csharp/PiperPlus.Core.Tests/TextSanitizerContractTests.cs",
  "src/csharp/PiperPlus.Core.Tests/CliInputSanitizeTests.cs",
]
entry_points = [
  # Every IPhonemizer strips at the start of its PhonemizeCore (the
  # European Portuguese one delegates to PortuguesePhonemizer), and so does
  # ChineseEmbeddedEnglish.Convert (the English run between Chinese text).
  # The consumer test lists every IPhonemizer type by reflection and fails
  # for one it does not know.
  {file = "src/csharp/PiperPlus.Core/Phonemize/ChinesePhonemizer.cs", calls = "StripControlChars"},
  {file = "src/csharp/PiperPlus.Core/Phonemize/ChineseEmbeddedEnglish.cs", calls = "StripControlChars"},
  {file = "src/csharp/PiperPlus.Core/Phonemize/EnglishPhonemizer.cs", calls = "StripControlChars"},
  {file = "src/csharp/PiperPlus.Core/Phonemize/FrenchPhonemizer.cs", calls = "StripControlChars"},
  {file = "src/csharp/PiperPlus.Core/Phonemize/JapanesePhonemizer.cs", calls = "StripControlChars"},
  {file = "src/csharp/PiperPlus.Core/Phonemize/KoreanPhonemizer.cs", calls = "StripControlChars"},
  {file = "src/csharp/PiperPlus.Core/Phonemize/MultilingualPhonemizer.cs", calls = "StripControlChars"},
  {file = "src/csharp/PiperPlus.Core/Phonemize/PortuguesePhonemizer.cs", calls = "StripControlChars"},
  {file = "src/csharp/PiperPlus.Core/Phonemize/SpanishPhonemizer.cs", calls = "StripControlChars"},
  {file = "src/csharp/PiperPlus.Core/Phonemize/SwedishPhonemizer.cs", calls = "StripControlChars"},
  # PhonemeEncoder.Encode / EncodeDirect, before any phonemizer.
  {file = "src/csharp/PiperPlus.Core/Phonemize/PhonemeEncoder.cs", calls = "StripControlChars"},
  # The CLI: --text in test mode, --text with a model (before the custom
  # dictionary, the short-text check, [[ ]] and sentence splitting) and the
  # text of JSONL input.
  {file = "src/csharp/PiperPlus.Cli/Program.cs", calls = "StripControlChars"},
]
notes = "CliInputSanitizeTests runs the CLI process with the test model. A command-line argument cannot hold a NUL, so its --text cases put DEL where a case has a NUL; JSONL carries the NUL itself."

[[runtime]]
name = "cpp"
status = "enforced"
function = "piper::stripControlChars (src/cpp/text_sanitize.hpp)"
consumer_tests = [
  "src/cpp/tests/test_input_sanitize_contract.cpp",
  "scripts/test_cpp_cli_input_sanitize.py",
]
entry_points = [
  # piper::phonemizeText (before the [[ ]] notation, the language split and
  # every phonemizer) and piper::textToAudioStreaming (before sentence
  # splitting).
  {file = "src/cpp/piper.cpp", calls = "stripControlChars"},
  # piper::phonemizeEmbeddedEnglish (the English run between Chinese text;
  # the C API piper_plus_phonemize_embedded_english calls it).
  {file = "src/cpp/chinese_phonemize.cpp", calls = "stripControlChars"},
  # piper_plus_synthesize / synth_start (and so synthesize_streaming) /
  # phonemize / g2p_phonemize, before the custom dictionary.
  {file = "src/cpp/piper_plus_c_api.cpp", calls = "stripControlChars"},
  # The CLI: every line (--text, stdin, the text of JSONL) before the custom
  # dictionary and SSML detection.
  {file = "src/cpp/main.cpp", calls = "stripControlChars"},
]
notes = "Bytes that are not valid UTF-8 are kept. The C API takes C strings, which cannot hold a NUL, so its cases put DEL where a case has a NUL. scripts/test_cpp_cli_input_sanitize.py runs the built CLI (CI step 'CLI input sanitizing E2E' in _build-test-cpp.yml). Also the Swift TTS (Sources/PiperPlus), which wraps the C API in the released xcframework and gets the stripping with its next native build, and the Kotlin G2P, whose AAR wraps libpiper_plus.so (it also strips in its wrapper: kotlin)."

[[runtime]]
name = "npm"
status = "enforced"
function = "stripControlChars (src/wasm/g2p/src/sanitize.js; piper-plus has the same rule in src/wasm/openjtalk-web/src/sanitize.js)"
consumer_tests = [
  "src/wasm/g2p/test/test-input-sanitize-contract.js",
  "src/wasm/openjtalk-web/test/js/test-input-sanitize-contract.js",
]
entry_points = [
  # @piper-plus/g2p: G2P.phonemize / phonemizeWithProsody / detectLanguage /
  # segmentText, and phonemize / phonemizeWithProsody of every language class
  # (EuropeanPortugueseG2P delegates to the Brazilian class in pt/index.js).
  # The consumer test lists the exported classes and fails for one it does
  # not know.
  {file = "src/wasm/g2p/src/index.js", calls = "stripControlChars"},
  {file = "src/wasm/g2p/src/en/index.js", calls = "stripControlChars"},
  {file = "src/wasm/g2p/src/es/index.js", calls = "stripControlChars"},
  {file = "src/wasm/g2p/src/fr/index.js", calls = "stripControlChars"},
  {file = "src/wasm/g2p/src/ja/index.js", calls = "stripControlChars"},
  {file = "src/wasm/g2p/src/ko/index.js", calls = "stripControlChars"},
  {file = "src/wasm/g2p/src/pt/index.js", calls = "stripControlChars"},
  {file = "src/wasm/g2p/src/sv/index.js", calls = "stripControlChars"},
  # ChineseG2P also strips in phonemizeEmbeddedEnglish(WithProsody).
  {file = "src/wasm/g2p/src/zh/index.js", calls = "stripControlChars"},
  # piper-plus: every synthesize method and findDroppedSymbols, first (before
  # SSML detection, the language detection and sentence splitting), and
  # synthesizeSsml again for each segment, since the SSML parser decodes
  # character references such as &#0;.
  {file = "src/wasm/openjtalk-web/src/index.js", calls = "stripControlChars"},
]
notes = "piper-plus does not import the function from @piper-plus/g2p: releases up to 0.4.2 do not export it, and a named import of a missing export fails module linking for the whole package. Both copies are tested against the fixture. The Rust WASM G2P (ja / zh in piper-plus) also strips, with rust-g2p."

[[runtime]]
name = "kotlin"
status = "enforced"
function = "com.piperplus.g2p.TextSanitizer.stripControlChars"
consumer_tests = [
  "android/piper-plus-g2p/src/test/java/com/piperplus/g2p/InputSanitizeContractTest.kt",
]
entry_points = [
  # PiperPlusG2p.phonemize, before the JNI call.
  {file = "android/piper-plus-g2p/src/main/java/com/piperplus/g2p/PiperPlusG2p.kt", calls = "stripControlChars"},
]
notes = "The AAR wraps libpiper_plus.so, which strips too (cpp), but JNI passes the text as modified UTF-8, where U+0000 is the bytes C0 80: the native strip keeps bytes that are not valid UTF-8, so a NUL inside 'hola' reached the phonemizer. The wrapper strips before the call. The consumer test (L1, JVM) reads the fixture; src/androidTest/java/com/piperplus/g2p/InputSanitizeInstrumentedTest.kt (L3, emulator in kotlin-g2p-ci) phonemizes the word cases through the native library."

[[runtime]]
name = "swift-g2p"
status = "enforced"
function = "PiperPlusG2P.TextSanitizer.stripControlChars"
consumer_tests = ["tests/PiperPlusG2PTests/InputSanitizeContractTests.swift"]
entry_points = [
  # Phonemizer.phonemize, before the FFI call.
  {file = "Sources/PiperPlusG2P/Phonemizer.swift", calls = "stripControlChars"},
]
notes = "Wraps the Rust FFI of piper-plus-g2p, which strips too (rust-g2p), but the text crosses as a C string, which ends at the first NUL: 'ho' + NUL + 'la' reached Rust as 'ho'. The wrapper strips before the call. swift-g2p-ci runs the consumer test against the Rust library built from source."

# ---------------------------------------------------------------- coverage

[coverage]
# Every runtime path in RUNTIME_PATHS of .claude/skills/check-cross-runtime/
# SKILL.md, mapped to the runtime above that strips its input. The gate fails
# for a path listed there without a row here, so a new runtime cannot ship
# without saying where it strips.
"src/python_run/piper_plus/" = "python-runtime"
"docker/python-inference/" = "python-runtime"
"docker/webui/" = "python-runtime"
"src/csharp/PiperPlus.Core/" = "csharp"
"src/csharp/PiperPlus.Cli/" = "csharp"
"src/rust/piper-core/" = "rust-g2p"
"src/rust/piper-cli/" = "rust-g2p"
"src/rust/piper-plus-g2p/" = "rust-g2p"
"src/rust/piper-wasm/" = "rust-g2p"
"src/go/piperplus/" = "go"
"src/go/cmd/piper-plus/" = "go"
"src/go/phonemize/" = "go"
"src/wasm/openjtalk-web/" = "npm"
"src/wasm/g2p/" = "npm"
"src/cpp/" = "cpp"
"Sources/PiperPlus/" = "cpp"
"Sources/PiperPlusG2P/" = "swift-g2p"
"android/piper-plus-g2p/" = "kotlin"
