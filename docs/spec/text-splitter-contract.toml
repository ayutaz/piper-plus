# Text Splitter — Closing Punctuation Contract
# ==============================================
# This file defines the canonical character set for closing punctuation marks
# that should be consumed after a sentence terminator during text splitting.
#
# All runtime implementations of isClosingPunctuation() (or equivalent) MUST
# include exactly these characters. The set is the union of all characters
# used across runtimes, covering all 8 supported languages (JA, EN, ZH, KO,
# ES, FR, PT, SV).
#
# This file serves as a design-time cross-language contract. Implementations
# and tests are expected to be kept in sync with these values manually unless
# and until automated contract-verification tests are added.
#
# Implementations:
#   C++:    src/cpp/piper.cpp                              isClosingPunctuation()
#   Rust:   src/rust/piper-core/src/streaming.rs           is_closing_punctuation()
#   C#:     src/csharp/PiperPlus.Core/Phonemize/TextSplitter.cs  IsClosingPunctuation()
#   Go:     src/go/piperplus/text_splitter.go              isClosingPunctuation()
#   Python: src/python_run/piper_plus/text_splitter.py          _CLOSING_PUNCTUATION
#   WASM:   (uses Rust via piper-wasm)
#
# Related:
#   Issue: https://github.com/ayutaz/piper-plus/issues/346
#   Spec:  docs/spec/text-splitter-contract.toml (this file)
#
# Closing punctuation divergence (as of 2026-05-17):
#   C++:    14/14 chars (fully conformant after Issue #346)
#   Rust:   14/14 chars (fully conformant after Issue #346)
#   C#:     14/14 chars (fully conformant after Issue #346)
#   Python: 14/14 chars (mirrors Rust streaming.rs)
#   Go:     14/14 chars (post-consume aligned with canonical)
#
# Sentence terminator divergence (as of 2026-05-17):
#   C++:    7/7 terminators (fully conformant after Issue #346)
#   Rust:   6/7 terminators (missing U+FF0E)
#   C#:     6/7 terminators (missing U+FF0E)
#   Python: 7/7 terminators (fully conformant per spec)
#   Go:     7/7 terminators (fully conformant)
#
# Future work: align Rust/C# sentence terminators (add U+FF0E).

# ---------------------------------------------------------------------------
# Closing Punctuation Character Set (14 characters)
# ---------------------------------------------------------------------------
# Characters are consumed greedily after a sentence terminator when
# hasTerminator is true. This prevents closing brackets from leaking
# into the next sentence chunk.

[meta]
forward_compat_policy = "strict"

[[closing_punctuation]]
char = ")"
codepoint = "U+0029"
name = "Right Parenthesis"
category = "Pe"
languages = ["EN", "ES", "FR", "PT", "SV", "JA", "ZH", "KO"]

[[closing_punctuation]]
char = "]"
codepoint = "U+005D"
name = "Right Square Bracket"
category = "Pe"
languages = ["EN", "ES", "FR", "PT", "SV"]

[[closing_punctuation]]
char = "}"
codepoint = "U+007D"
name = "Right Curly Bracket"
category = "Pe"
languages = ["EN"]

[[closing_punctuation]]
char = "\""
codepoint = "U+0022"
name = "Quotation Mark"
category = "Po"
note = "Ambiguous open/close. Safe: only called after sentence terminator."
languages = ["EN", "ES", "FR", "PT", "SV"]

[[closing_punctuation]]
char = "'"
codepoint = "U+0027"
name = "Apostrophe"
category = "Po"
note = "Ambiguous open/close. Safe: only called after sentence terminator."
languages = ["EN"]

[[closing_punctuation]]
char = "\u300D"
codepoint = "U+300D"
name = "Right Corner Bracket (」)"
category = "Pe"
languages = ["JA", "ZH", "KO"]

[[closing_punctuation]]
char = "\u300F"
codepoint = "U+300F"
name = "Right White Corner Bracket (』)"
category = "Pe"
languages = ["JA", "ZH", "KO"]

[[closing_punctuation]]
char = "\uFF09"
codepoint = "U+FF09"
name = "Fullwidth Right Parenthesis (）)"
category = "Pe"
languages = ["JA", "ZH", "KO"]

[[closing_punctuation]]
char = "\uFF3D"
codepoint = "U+FF3D"
name = "Fullwidth Right Square Bracket (］)"
category = "Pe"
languages = ["JA", "ZH"]

[[closing_punctuation]]
char = "\u3011"
codepoint = "U+3011"
name = "Right Black Lenticular Bracket (】)"
category = "Pe"
languages = ["JA", "ZH"]

[[closing_punctuation]]
char = "\uFF63"
codepoint = "U+FF63"
name = "Halfwidth Right Corner Bracket (｣)"
category = "Pe"
languages = ["JA"]

[[closing_punctuation]]
char = "\u201D"
codepoint = "U+201D"
name = "Right Double Quotation Mark (\u201C\u201D)"
category = "Pf"
languages = ["EN", "ZH", "JA"]

[[closing_punctuation]]
char = "\u2019"
codepoint = "U+2019"
name = "Right Single Quotation Mark (\u2018\u2019)"
category = "Pf"
note = "Used in EN/FR for closing single quotes. Not in original Rust/C#/Go sets."
languages = ["EN", "FR"]

[[closing_punctuation]]
char = "\u00BB"
codepoint = "U+00BB"
name = "Right-Pointing Double Angle Quotation Mark (guillemet, \u00AB\u00BB)"
category = "Pf"
note = "Used in FR/PT/ES/SV as closing quotation mark. Not in original Rust/C#/Go sets."
languages = ["FR", "PT", "ES", "SV"]

# ---------------------------------------------------------------------------
# Sentence Terminators (7 characters)
# ---------------------------------------------------------------------------
# These are the characters that trigger sentence splitting. Closing
# punctuation is only consumed when hasTerminator is true.

[[sentence_terminators]]
char = "."
codepoint = "U+002E"
name = "Full Stop"

[[sentence_terminators]]
char = "!"
codepoint = "U+0021"
name = "Exclamation Mark"

[[sentence_terminators]]
char = "?"
codepoint = "U+003F"
name = "Question Mark"

[[sentence_terminators]]
char = "\u3002"
codepoint = "U+3002"
name = "Ideographic Full Stop (。)"

[[sentence_terminators]]
char = "\uFF01"
codepoint = "U+FF01"
name = "Fullwidth Exclamation Mark (！)"

[[sentence_terminators]]
char = "\uFF1F"
codepoint = "U+FF1F"
name = "Fullwidth Question Mark (？)"

[[sentence_terminators]]
char = "\uFF0E"
codepoint = "U+FF0E"
name = "Fullwidth Full Stop (．)"
note = "In C++ and Go. Not in Rust/C#. Covers CJK fullwidth period usage."

# ---------------------------------------------------------------------------
# Behavioral Contract
# ---------------------------------------------------------------------------

[behavior]
# How closing punctuation is handled after sentence terminators.
# "post-consume": After detecting a sentence terminator, greedily consume
#                 any following closing punctuation into the same chunk.
#                 Used by all runtimes (C++, Rust, C#, Go, Python).
#
# Example (post-consume canonical):
#   Input: 彼は「元気です。」と言った。終わり。
#   Output: ["彼は「元気です。」", "と言った。", "終わり。"]  (3 chunks)
strategy = "post-consume"

# ---------------------------------------------------------------------------
# Full stops that do not end a sentence (Issue #831)
# ---------------------------------------------------------------------------
# The training data is phonemized without sentence splitting, and the English
# G2P (g2p_en) reads some full stops as part of the text around them: "3.14"
# is "three point one four" and "e.g." is "for example". Splitting there
# changes the phonemes ("three" + "fourteen"), so a full stop (U+002E, or the
# fullwidth U+FF0E) is NOT a sentence terminator when
#
#   1. it sits between two digits (ASCII 0-9 or fullwidth U+FF10-FF19 on each
#      side): "3.14", "2.0.1", "３．５";
#   2. it is one of the full stops of an abbreviation below, matched ASCII
#      case-insensitively, and the abbreviation is at the start of the text or
#      follows a character that is not an ASCII letter or digit: "e.g.",
#      "E.g.", "(i.e.". "Note.g." does not match ("e" follows "t").
#
# Only abbreviations g2p_en rewrites are listed; a title such as "Mr." keeps
# the same phonemes when it is split off, so it still ends a chunk.

[[non_terminating_abbreviations]]
text = "e.g."
reading = "for example"

[[non_terminating_abbreviations]]
text = "i.e."
reading = "that is"

# ---------------------------------------------------------------------------
# Consumers (Issue #831)
# ---------------------------------------------------------------------------
# Tests that check every split case below. scripts/check_text_splitter_contract.py
# fails when one of them is missing or no longer reads split_cases from
# tests/fixtures/text_splitter/contract.json.

[consumers]
split_case_tests = [
  "src/python_run/tests/test_text_splitter_contract.py",
  "src/rust/piper-core/tests/test_text_splitter_contract.rs",
  "src/go/piperplus/text_splitter_contract_test.go",
  "src/csharp/PiperPlus.Core.Tests/TextSplitterContractTests.cs",
  "src/cpp/tests/test_text_splitter_contract.cpp",
  "src/wasm/openjtalk-web/test/js/test-streaming-pipeline.js",
]

# ---------------------------------------------------------------------------
# Split cases (Issue #831)
# ---------------------------------------------------------------------------
# Every runtime's splitter must return exactly `expected` for `input`
# (copied into tests/fixtures/text_splitter/contract.json as split_cases).

[[split_cases]]
input = "Hello. World!"
expected = ["Hello.", "World!"]

[[split_cases]]
input = "It costs 3.14 dollars. Thanks."
expected = ["It costs 3.14 dollars.", "Thanks."]

[[split_cases]]
input = "Pi is 3.14."
expected = ["Pi is 3.14."]

[[split_cases]]
input = "Version 2.0.1 is out. Update now!"
expected = ["Version 2.0.1 is out.", "Update now!"]

[[split_cases]]
input = "The answer is 3. Next question."
expected = ["The answer is 3.", "Next question."]

[[split_cases]]
input = "Count to 3.Then stop."
expected = ["Count to 3.", "Then stop."]

[[split_cases]]
input = "Fruit, e.g. an apple. Done."
expected = ["Fruit, e.g. an apple.", "Done."]

[[split_cases]]
input = "One thing, i.e. this one. Next."
expected = ["One thing, i.e. this one.", "Next."]

[[split_cases]]
input = "E.g. this works. I.E. that too."
expected = ["E.g. this works.", "I.E. that too."]

[[split_cases]]
input = "A fruit (e.g. an apple) is sweet."
expected = ["A fruit (e.g. an apple) is sweet."]

[[split_cases]]
input = "Note.g. Next."
expected = ["Note.", "g.", "Next."]

[[split_cases]]
input = "気温は3.5度です。明日も晴れ。"
expected = ["気温は3.5度です。", "明日も晴れ。"]

[[split_cases]]
input = "気温は３．５度です。"
expected = ["気温は３．５度です。"]
