# ONNX Runtime Session Contract
# ==============================
# This file defines the canonical parameter values that ALL implementations
# (Rust, C#, C++, Python) must agree on. When changing any value here,
# update all implementations and their tests accordingly.
#
# This file serves as a design-time cross-language contract. Implementations
# and tests are expected to be kept in sync with these values manually unless
# and until automated contract-verification tests are added.
#
# Implementations:
#   Rust:   src/rust/piper-core/src/engine.rs
#   C#:     src/csharp/PiperPlus.Core/Inference/SessionFactory.cs
#   C++:    src/cpp/piper.cpp
#   Python: src/python/piper_train/ort_utils.py

[meta]
forward_compat_policy = "strict"

[session]
graph_optimization_level = "ORT_ENABLE_ALL"
execution_mode = "SEQUENTIAL"
max_intra_threads = 4
inter_op_threads = 1
enable_cpu_mem_arena = true
enable_memory_pattern = true
dynamic_block_base = 4

[warmup]
phoneme_length = 100
bos_token = 1
eos_token = 2
dummy_phoneme = 8
default_runs = 2
noise_scale = 0.4
length_scale = 1.0
noise_w = 0.5

[warmup.optional_inputs]
# These inputs are added only when the model requires them
sid_value = 0                       # speaker ID (if model has 'sid' input)
lid_value = 0                       # language ID (if model has 'lid' input)
prosody_shape = "1 x phoneme_length x 3"  # prosody_features (if model has input)
prosody_fill = 0                    # zero-filled

[cache]
optimized_extension = "opt.onnx"    # e.g., model.cpu.opt.onnx
sentinel_extension = "opt.onnx.ok"  # e.g., model.cpu.opt.onnx.ok
sentinel_content = "ok"
device_label_cpu = "cpu"
device_label_cuda_format = "cuda{device_id}"  # "cuda0", "cuda1" (no dots)

[cache.behavior]
# Cache hit:  .opt.onnx + .ok both exist → load with ORT_DISABLE_ALL
# Incomplete: .opt.onnx only (no .ok) → delete .opt.onnx, re-optimize
# Miss:       neither exists → optimize, save to a UNIQUE TEMP path, rename
#             it onto .opt.onnx, then write .ok (see [cache.concurrency])
# Load failure: cached model fails to load → delete both, re-optimize
# Write failure: PermissionError/OSError → warn, continue without cache

[cache.concurrency]
# ORT must be pointed at a per-writer TEMP path, never at .opt.onnx itself.
#
# Every implementation used to set optimized_model_filepath to the shared
# .opt.onnx, so two sessions created concurrently for the same model asked ORT
# to write the same file at the same time. On Windows the second open is
# denied and the session constructor throws; the sentinel does not help,
# because it is written after the file, so it cannot protect the file while it
# is being produced.
#
# Measured (issue #686): `csharp-tests (windows-latest)` had
# ZeroShotE2ETests.ZeroShot_Inference_ProducesAudio and
# ZeroShot_DifferentEmbeddings_ProduceDifferentAudio fail in the same
# millisecond -- xUnit runs them in parallel -- with
#   [ErrorCode:Fail] Load model from ...\zero-shot-test.cpu.opt.onnx failed:
#   system error number 13
# (13 = EACCES). 1453 other tests passed in the same run, which is why this
# read as an intermittent flake rather than a defect for months.
#
# The write is therefore: optimize into `{optimized_path}.{pid}.{unique}.tmp`,
# then rename that onto `{optimized_path}`, then write the sentinel. Rename
# within one directory is atomic on POSIX (`rename(2)`) and on Windows
# (`MoveFileEx` with MOVEFILE_REPLACE_EXISTING), so a reader sees either the
# old complete file or the new complete file, never a partial one.
temp_suffix_format = "{optimized_path}.{pid}.{seq:08x}.tmp"
# `unique` is a PROCESS-LOCAL MONOTONIC COUNTER, not a timestamp and not a
# truncated UUID. Two parts are required: the pid separates processes, the
# counter separates writers within one process.
#
# Both weaker sources were tried and measured to fail:
#   - SystemTime::now().subsec_nanos() returned the SAME value for two
#     consecutive calls in the Rust port, which moved the race inside the
#     process instead of removing it (caught by
#     `temp_cache_paths_differ_between_writers`)
#   - uuid4().hex[:8] / Guid prefix is 32 bits, which collided 6 times in
#     200,000 draws -- the birthday bound, ~4.7 expected
unique_source = "process_local_monotonic_counter"
rename_is_atomic_within_directory = true
# Losing the rename race is NOT an error: another writer already produced an
# equally valid cache, or is holding the destination open (Windows denies the
# replace). Discard the temp and carry on -- the session in hand was built
# from the original model and is correct either way.
on_rename_failure = "discard_temp_and_continue"
# A crash between "ORT wrote the temp" and "rename" leaves an orphaned .tmp.
# It is never read (the name is unique per writer) and is harmless. Sweeping
# other writers' temps is deliberately NOT done: a .tmp that looks stale may
# be a live write by a slower process.
orphan_temp_policy = "leave_in_place"

[env_vars]
# Environment variables for runtime control
# Priority: CLI flag > env var > auto-detect
disable_warmup = "PIPER_PLUS_DISABLE_WARMUP"   # "1", "true", "yes" to disable
disable_cache = "PIPER_PLUS_DISABLE_CACHE"     # "1", "true", "yes" to disable
intra_threads = "PIPER_PLUS_INTRA_THREADS"     # integer, overrides auto-detect

[env_vars.implementation_status]
# Which implementations support each control mechanism
# ✓ = supported via env var, CLI = supported via CLI flag, - = not implemented
#                        Rust    C#     C++    Python
# warmup disable         CLI     CLI    CLI    ✓ (env)
# cache disable          -       -      -      ✓ (env)
# intra threads          -       -      CLI    ✓ (env)

[phonemize_cache]
# Japanese phonemization LRU cache (Python only, Phase 1)
strategy = "lru_cache"
maxsize = 2000
cache_unit = "sentence"  # cache per-sentence after text splitting
key_format = "(sentence_text, prosody_flag)"  # piper_train: text only (prosody always true)
clear_api = "clear_phonemize_cache()"
