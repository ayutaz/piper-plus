# Published Checkpoint Compatibility Contract
# ===========================================
# Pins the guarantee that every checkpoint piper-plus has published stays
# loadable by the current model definition.
#
# Why this file exists
# --------------------
# Issue #616: PR #579 widened `MBiSTFTGenerator.cond` from
# `upsample_initial_channel` to `upsample_initial_channel * 2` outputs. Every
# published checkpoint immediately stopped loading -- `torch.load` succeeded,
# then `load_state_dict` raised `size mismatch for model_g.dec.cond.weight`,
# and `strict=False` did not help (it tolerates missing/unexpected keys, never
# mismatched shapes). Nothing in CI noticed, because every existing test builds
# its checkpoints *from the current model definition* and is therefore
# self-consistent no matter how the architecture moves.
#
# This contract records what the published artifacts actually contain, so a
# layout change that breaks them fails CI instead of reaching users.
#
# Only `key -> shape` is stored, never weights: the gate materialises zero
# tensors from these shapes, runs them through
# `piper_train.vits.commons.normalize_checkpoint_state_dict`, and requires a
# `strict=True` load to succeed. No download, no GPU, ~1 s.
#
# Shapes use `AxBxC` (e.g. `256x512x1`); a scalar is the empty string.
#
# Regenerating:
#     python scripts/check_checkpoint_compat.py --update-snapshot <ckpt> --name <id>
#
# DO NOT regenerate this file merely to turn CI green. A red gate means a
# published checkpoint became unloadable; the fix is a migration in
# `piper_train/vits/commons.py`, or -- if the break is deliberate -- a newly
# published checkpoint plus a `### Breaking` CHANGELOG entry and a migration
# guide section. Regenerating without one of those re-creates issue #616.
#
# Implementations:
#   - gate:      scripts/check_checkpoint_compat.py
#   - migration: src/python/piper_train/vits/commons.py
#   - hook:      piper_train.vits.lightning.VitsModel.on_load_checkpoint
#   - tests:     src/python/tests/test_checkpoint_film_migration.py

