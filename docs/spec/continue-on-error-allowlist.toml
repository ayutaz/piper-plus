# continue-on-error allowlist — every `continue-on-error` in .github/workflows
# that is not literally `false` must have an entry here.
#
# Enforced by scripts/check_continue_on_error.py (pre-commit hook
# `continue-on-error-allowlist` and tests/scripts/test_check_continue_on_error.py,
# which scripts-tests.yml runs on every PR and push).
#
# Why: in 2026-10 the workflows had 62 continue-on-error keys. 37 of them hid
# checks whose results nobody read; several had been failing on every run
# (sbom npm, trivy-docker, the RTF wasm cell, generate-combined-report) and
# the ones promising "warn-only until the baseline settles, then strict"
# were about five months past that point.
#
# Fields:
#   workflow  file name under .github/workflows/
#   job       job id
#   step      step `name` (or `uses` when unnamed); omit for a job-level key
#   kind      "harmless" — the step cannot hide a check result: a cache
#                          restore, an artifact / report upload, an upload to
#                          an external coverage service, a display-only reporter.
#             "tracked"  — a check whose failure is ignored on purpose for now.
#                          Requires `expires` (YYYY-MM-DD). After that date the
#                          gate fails until the entry is removed (fix the check
#                          and drop continue-on-error) or renewed with a new
#                          reason in a reviewed PR.
#   reason    why the failure may be ignored (and, for tracked, what has to
#             happen before the key can go)
#
# A tracked check must not also hide its result inside the step (`|| true`,
# `--error-exitcode=0`, a pipe without pipefail): the step has to fail when
# the check fails, so the failure is visible on the run and removing
# continue-on-error turns it into a real gate.

[meta]
spec_version = 1
last_updated = "2026-10-25"
applies_to = ["github-actions"]
canonical_reference = ".github/workflows/*.yml"
# Unknown entry fields fail the gate (a typo such as `expire` must not
# silently drop the deadline).
forward_compat_policy = "strict"

