# Phoneme Timing Output Contract
# ===============================
# This file defines canonical parameter values, calculation logic, and output
# formats that ALL runtimes (Python, Rust, Go, C++, C#, WASM/JS) must implement
# identically for phoneme timing extraction.
#
# Cross-runtime byte-for-byte compatibility is maintained by all implementations
# adhering to this spec.

[meta]
spec_version = "1.1"
last_updated = "2026-09-18"
applies_to = ["python", "rust", "go", "cpp", "csharp", "wasm-js"]
forward_compat_policy = "strict"

# ============================================================================
# Calculation
# ============================================================================

[calculation]
# VITS models output a 'durations' tensor [1, phoneme_length] containing the
# number of frames (hop_length-sized) each phoneme occupies. This section
# specifies how to convert frame counts to millisecond timestamps.

formula = "frame_time_ms = (hop_length / sample_rate) * 1000"
default_hop_length = 256
# default_sample_rate is read from config.json's audio.sample_rate
example_sample_rate = 22050
# At 22050Hz / 256 hop, frame_time_ms ≈ 11.609977

[calculation.cursor_walk]
description = """
Iterate phoneme-by-phoneme, accumulating start_ms with each duration.
Each phoneme's end_ms equals the next phoneme's start_ms (continuous boundaries).
"""
algorithm = """
cursor_ms = 0.0
for each (duration_frames, phoneme_token) in zip(durations, tokens):
    duration_ms = max(duration_frames, 0.0) * frame_time_ms
    start_ms = cursor_ms
    end_ms = cursor_ms + duration_ms
    yield {phoneme, start_ms, end_ms, duration_ms}
    cursor_ms = end_ms
total_duration_ms = cursor_ms
"""

[calculation.negative_handling]
# Negative durations should be clamped to 0.0 with a warning logged
clamp_to = 0.0
log_level = "warning"
# Negative values must NOT raise an exception (gracefully degrade)

# ============================================================================
# Concatenation across multiple inferences (spec_version 1.1)
# ============================================================================
# [calculation.cursor_walk] specifies ONE inference: its algorithm literally
# starts at `cursor_ms = 0`. A single text->audio call may however run several
# inferences (one per sentence, per phrase split by phoneme_silence_seconds, or
# per inline `[[ ... ]]` segment) and concatenate their audio into one stream.
# This section specifies how the per-inference timings are joined so that a
# timestamp refers to the audio stream the caller actually receives. See
# `exactness_precondition` below for the one case where that correspondence
# degrades from content-exact to count-exact.

[concatenation]
applies_when = "one text->audio call performs more than one synthesize() inference"
unit = """
UNIT = one synthesize() inference (one sentence, one phrase, or one inline
phoneme segment). A generator always emits 0-based timings for its own unit;
no offset is ever applied inside the per-unit cursor walk.
"""
algorithm = """
emitted_samples = 0                      # interleaved PCM samples already handed to the caller
for each unit u in emission order:
    before = output_buffer.size()
    synthesize(u)                         # appends to output_buffer
    grown  = max(output_buffer.size() - before, 0)
    if u.has_timing:
        offset_seconds = emitted_samples / (sample_rate * max(channels, 1))
        offset_frames  = emitted_samples // (hop_length * max(channels, 1))
        for each entry in u.timings:
            emit(entry shifted by offset_seconds / offset_frames)
    emitted_samples += grown + inter_unit_silence_samples(u)
"""
offset_source = "emitted PCM samples (unit audio + inter-unit silence), measured as the growth of the output buffer across one synthesize() call"
forbidden_offset_sources = [
  "SynthesisResult.audioSeconds / any per-unit audioSeconds (#654: re-assigned from the whole accumulated buffer inside the trim branches; measured 1.53x over on a 3-unit utterance)",
  "sum of raw durations (#653: the exported durations tensor is pre-ceil, 0.55-0.83x of real length; -140 ms by the 3rd unit of a 779 ms utterance)",
  "sum of ceil(durations) * hop_length (the PRE-trim unit length; +72..+121 ms)",
  "the last entry's end_time (the cursor walk advances over pad/bos/eos ids without emitting entries for them, so the unit tail is invisible)",
]
first_unit_offset = 0
# Single-inference output is therefore bit-identical to spec_version 1.0.
exactness_precondition = """
`grown` is measured AFTER the unit's own post-trims have run. A trim that only
shortens the unit's own tail keeps every published offset content-exact. A trim
that removes samples from the FRONT of the accumulated buffer, however, deletes
audio belonging to units that were already published, which shifts their
content left while their timestamps stay put: an already-published offset then
reads late by the sum of the front trims of all units synthesized after it.
In C++ this happens only via #655 (trimPaddingByDurations slices index 0 of the
cumulative buffer) and therefore only when a non-first unit is short enough to
be padded (< 15 phoneme ids). Offsets remain count-exact in every case, and
content-exact for single-unit output, for followers that are not padded, and
for both streaming paths (which synthesize into a per-unit buffer). Fixing #655
makes the correspondence content-exact everywhere with no change to this
algorithm.
"""
millisecond_fields_are_canonical_across_units = true
frame_fields_advisory_across_units = true
# start_frame/end_frame truncate on division, so they may drift by <= 1 frame
# per inter-unit silence gap. Compare milliseconds, not frames, across units.
aggregate_total_duration_ms = "the emitted stream length (offset after the last unit, inter-unit silence included) -- NOT the sum of the per-unit cursor walks, which understates it by the pre-ceil gap of #653"
aggregate_total_duration_ms_conformance = "python: conformant (voice.py tracks the emitted sample count). cpp: NOT yet -- outputTimingsAsJSON derives total_duration_ms from max(end_ms) over the entries because the writer is never given the emitted length, so it omits the trailing pad/eos frames and the trailing silence. Unifying needs the emitted count threaded to the writer, which needs either a new exported overload or a trustworthy per-unit audioSeconds (#654)."
# History: Python advanced the offset by the SUM OF THE UNIT'S DURATIONS
# (`cumulative_ms += timing.total_duration_ms`) until issue #660. Because the
# durations tensor is exported pre-ceil (#653) that offset was 0.55-0.83x of
# the real unit length, so timestamps drifted earlier with every unit. Both
# C++ and Python now anchor to emitted samples, so this section has no
# per-runtime divergence.

[concatenation.silence]
# Inter-unit silence is audio the caller receives, so it MUST be part of the
# offset -- but it is not speech, so it never produces a timing entry.
silence_produces_entry = false
after_phrase = "phoneme_silence_seconds[phoneme] * sample_rate * channels samples, inserted after every phrase whose terminating phoneme carries a silence entry -- including the sentence-final phrase when the sentence ends on that phoneme"
after_sentence = "sentence_silence_seconds * sample_rate * channels samples, inserted after every sentence"
applied_after_last_unit = true
# `applied_after_last_unit` refers to the AUDIO: a trailing sentence silence is
# still emitted after the final unit. It cannot enter any offset because no
# unit follows it, so it never affects a timestamp.
channels_in_divisor = true
# `channels` appears in both the silence sample count and the seconds/frames
# divisors so the two cancel. It is 1 on every shipped path today.

[concatenation.exemptions]
# Runtimes that run exactly one inference per text are trivially conformant:
# the first unit's offset is 0, so their output is unchanged by this section.
single_inference = ["rust", "go"]
# csharp ships the formatter only: PiperPlus.Core/Inference/TimingWriter.cs has
# no production caller, so there is no aggregation site to conform. Whoever
# wires it into a synthesis path must implement this section.
no_production_caller = ["csharp"]
intentionally_timing_less = [
  "wasm_js synthesizeStreaming (Float32Array only; timing discarded by design)",
  "wasm_js synthesizeSsml (iterates segments, so it IS multi-inference, but returns AudioResult with timing = null by design; synthesize() dispatches here for SSML input)",
  "cpp main.cpp SSML branch (synthesizeSsmlToBuffer aggregates per-segment results and publishes no timing; the CLI resets the timing fields per line so a previous line never leaks into an SSML line)",
]
# Single-unit C++ paths that DO publish timing without needing this section,
# because synthesize() assigns straight into the caller's result:
single_unit_direct = ["cpp phonemesToAudio", "cpp phonemeIdsToWavFile"]

# ============================================================================
# Validation
# ============================================================================

[validation]
# Inputs that all implementations must reject

[validation.sample_rate]
must_be = "positive finite number"
forbidden = ["NaN", "Infinity", "-Infinity", "0", "negative"]
exception_type = "TypeError (JS) / ValueError (Python) / Error (Rust/Go)"

[validation.hop_length]
must_be = "positive finite integer"
forbidden = ["NaN", "Infinity", "-Infinity", "0", "negative"]
exception_type = "TypeError (JS) / ValueError (Python) / Error (Rust/Go)"

[validation.length_consistency]
# durations and phoneme_tokens (when provided) must have the same length
exception_type = "RangeError (JS) / ValueError (Python) / Error (Rust/Go)"

# ============================================================================
# Data Structures
# ============================================================================

[types.phoneme_timing_info]
# Single phoneme entry
fields = [
  { name = "phoneme", type = "string", description = "Phoneme token (e.g. 'a', 'k', or 'U+E019' for unmapped PUA)" },
  { name = "start_ms", type = "float", description = "Start time in milliseconds from utterance start" },
  { name = "end_ms", type = "float", description = "End time in milliseconds from utterance start" },
  { name = "duration_ms", type = "float", description = "Duration in milliseconds (= end_ms - start_ms)" },
]

[types.timing_result]
# Complete timing result for an utterance
fields = [
  { name = "phonemes", type = "array<PhonemeTimingInfo>", description = "Per-phoneme timing entries" },
  { name = "total_duration_ms", type = "float", description = "Total utterance duration in milliseconds" },
  { name = "sample_rate", type = "int", description = "Audio sample rate (Hz)" },
]

# ============================================================================
# Output Formats
# ============================================================================

[output_formats.json_pretty]
# Pretty-printed JSON with 2-space indentation
indent = 2
ensure_ascii = false
schema = "{ phonemes: [{phoneme, start_ms, end_ms, duration_ms}], total_duration_ms, sample_rate }"
field_naming = "snake_case"
example = '''
{
  "phonemes": [
    {"phoneme": "^", "start_ms": 0.0, "end_ms": 58.0, "duration_ms": 58.0}
  ],
  "total_duration_ms": 58.0,
  "sample_rate": 22050
}
'''

[output_formats.json_compact]
# Single-line JSON for streaming/network use
indent = 0
ensure_ascii = false

[output_formats.tsv]
header = "start_ms\tend_ms\tduration_ms\tphoneme"
column_separator = "\t"
row_separator = "\n"
trailing_newline = true
float_precision = 3  # toFixed(3) / "{:.3f}"
escape_tab_in_phoneme = "\\t"
escape_newline_in_phoneme = "\\n"
example = '''
start_ms	end_ms	duration_ms	phoneme
0.000	58.000	58.000	^
58.000	150.800	92.800	k
'''

[output_formats.srt]
# SubRip subtitle format
timestamp_format = "HH:MM:SS,mmm"
cue_format = "{index}\n{start} --> {end}\n{phoneme}\n\n"
indexing_starts_at = 1
example = '''
1
00:00:00,000 --> 00:00:00,058
^

2
00:00:00,058 --> 00:00:00,151
k
'''

# ============================================================================
# Phoneme ID Reverse Mapping
# ============================================================================

[reverse_map]
# When converting phoneme IDs back to display strings, a reverse map is built
# from the model config's phoneme_id_map.

[reverse_map.collision_resolution]
# When multiple phoneme strings map to the same ID, the first occurrence
# (by iteration order over phoneme_id_map keys) is preserved. Later
# duplicates are ignored. Both Python and JavaScript implementations use
# this first-wins semantics for deterministic cross-runtime behavior.
# Python: `if phoneme_id not in reverse_map: reverse_map[phoneme_id] = display`
# JS:     `if (!(id in reverse)) { reverse[id] = display; }`
strategy = "first-wins"

[reverse_map.pua_handling]
# PUA characters (U+E000–U+F8FF) without an explicit name mapping should be
# rendered as "U+XXXX" using uppercase hex.
range = ["U+E000", "U+F8FF"]
fallback_format = "U+{HEX:04X}"
example = "char '\\uE019' → 'U+E019'"

[reverse_map.explicit_pua_mapping]
# Implementations may accept an optional pua_to_multi_char dict to translate
# PUA chars into human-readable multi-char names (e.g. "N_m", "ch", "tʃ").
optional = true
example = "{ '\\uE019': 'N_m', '\\uE00E': 'ch' }"

# ============================================================================
# Implementation Status
# ============================================================================

[implementations]
# Tracks which runtime implements each format and feature

[implementations.python]
file = "src/python_run/piper_plus/timing.py"
voice_integration = "src/python_run/piper_plus/voice.py:synthesize_with_timing"
concatenation = "emitted-sample anchoring (issue #660); see [concatenation]"
http_endpoint = "POST /api/phoneme-timing (src/python_run/piper_plus/http_server.py)"
formats = ["json_pretty", "json_compact", "tsv", "srt"]
test_files = [
  "src/python_run/tests/test_phoneme_timing.py",
  "src/python_run/tests/test_voice_timing.py",
  "src/python_run/tests/test_http_timing.py",
]

[implementations.rust]
file = "src/rust/piper-core/src/timing.rs"
cli_integration = "src/rust/piper-cli/src/main.rs (--output-timing, --timing-format)"
formats = ["json_pretty", "json_compact", "tsv", "srt"]

[implementations.go]
file = "src/go/piperplus/timing.go"
cli_integration = "src/go/cmd/piper-plus/main.go (--output-timing, --timing-format)"
http_integration = true
formats = ["json_pretty", "json_compact", "tsv", "srt"]

[implementations.cpp]
file = "src/cpp/piper.cpp (extractTimingsFromDurations)"
cli_integration = "src/cpp/main.cpp (--output-timing, --timing-format)"
formats = ["json_pretty", "json_compact", "tsv", "srt"]
concatenation = "src/cpp/phoneme_timing_concat.hpp (appendShifted / ConcatCursor), applied by textToAudio, textToAudioFloat, phonemesToAudioFloat, textToAudioStreaming, phonemesToAudioStreaming"
c_api_integration = "piper_plus_get_phoneme_timing (src/cpp/piper_plus_c_api.cpp)"
test_files = [
  "src/cpp/tests/test_phoneme_timing.cpp",
  "src/cpp/tests/test_phoneme_timing_concat.cpp",
  "src/cpp/tests/test_phoneme_timing_text_path.cpp",
  "src/cpp/tests/test_c_api_integration.cpp",
]

[implementations.csharp]
file = "src/csharp/PiperPlus.Core/Inference/TimingWriter.cs"
formats = ["json_pretty", "json_compact", "tsv", "srt"]

[implementations.wasm_js]
file = "src/wasm/openjtalk-web/src/timing.js"
audio_result_integration = "src/wasm/openjtalk-web/src/audio-result.js (timing, hasTimingInfo)"
piper_plus_integration = "src/wasm/openjtalk-web/src/index.js (synthesize, synthesizeWithVoiceCloning)"
streaming = "Float32Array only — timing intentionally discarded in synthesizeStreaming"
formats = ["json_pretty", "json_compact", "tsv", "srt"]
exports = ["main", "./timing subpath"]

# ============================================================================
# Backward Compatibility
# ============================================================================

[backward_compat]
# All runtimes must maintain backward compatibility with pre-timing APIs

python_synthesize = "Returns bytes (unchanged from pre-timing version)"
python_synthesize_stream_raw = "Returns Iterable[bytes] (unchanged)"
python_synthesize_ids_to_raw = "Returns bytes (now wraps _synthesize_ids_core internally)"

wasm_audio_result_2arg = "new AudioResult(samples, sampleRate) still works (timing defaults to null)"
wasm_synthesize_streaming = "onChunk callback still receives Float32Array (no timing)"
